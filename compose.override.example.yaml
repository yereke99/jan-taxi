# Local edge without TLS: run the full Docker stack on a laptop and open the
# apps at http://localhost:8088/passenger/ and http://localhost:8089/.
#
#   cp compose.override.example.yaml compose.override.yaml
#
# and in .env (development values only):
#   APP_ENV=development
#   APP_DOMAIN=http://localhost:8088
#   ADMIN_DOMAIN=http://localhost:8089
#   CADDY_GLOBAL_OPTIONS="auto_https off"
#   PASSENGER_MINIAPP_URL=http://localhost:8088/passenger/
#   DRIVER_MINIAPP_URL=http://localhost:8088/driver/
#   ADMIN_FRONTEND_URL=http://localhost:8089/
#   API_PUBLIC_URL=http://localhost:8088
#   ADMIN_COOKIE_SECURE=false
#   POSTGIS_IMAGE=imresamu/postgis:17-3.5-alpine   (Apple Silicon)
#
# The bots need real test bot tokens (docs/TELEGRAM_SETUP.md). Without them,
# start everything except the bots:
#   docker compose up -d db migrate api web db-backup
#
# Telegram cannot open Mini Apps over plain http; open them in a desktop
# browser with a signed link from devlink instead:
#   go run ./admin/backend/cmd/devlink --app passenger --base http://localhost:8088/passenger/
# (with PASSENGER_BOT_TOKEN from .env in the environment). The preflight check
# skips the production-only domain and https rules when APP_ENV=development.

services:
  web:
    # Replaces the public 80/443 ports of compose.yaml (Compose 2.24.4+).
    ports: !override
      - "127.0.0.1:8088:8088"
      - "127.0.0.1:8089:8089"
