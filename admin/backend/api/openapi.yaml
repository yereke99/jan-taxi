      allOf:
        - $ref: '#/components/schemas/AdminTopUp'
        - type: object
          required: [events, payment_transaction, duplicate_warnings, receipt, receipts, confirm_prefill]
          properties:
            receipt:
              description: Latest parsed Kaspi PDF receipt (null without one).
              oneOf:
                - $ref: '#/components/schemas/PaymentReceipt'
                - type: 'null'
            receipts:
              type: array
              description: Every PDF receipt attached to the top-up, newest first.
              items: {$ref: '#/components/schemas/PaymentReceipt'}
            confirm_prefill:
              description: Values for the confirmation form, taken from `receipt`.
              oneOf:
                - $ref: '#/components/schemas/ConfirmPrefill'
                - type: 'null'

            events:
              type: array
              description: Status history, oldest first (receipt uploads appear with `from_status = to_status`).
              items: {$ref: '#/components/schemas/TopUpEvent'}
            payment_transaction:
              description: Recorded payment, once confirmed.
              oneOf:
                - $ref: '#/components/schemas/PaymentTransaction'
                - type: 'null'
            duplicate_warnings:
              type: array
              description: Possible double payments to check before confirming (empty when none).
              items: {$ref: '#/components/schemas/DuplicateWarning'}
