openapi: 3.1.0
info:
  title: Jan Taxi API
  version: 1.0.0
  summary: Taxi and parcel delivery in Kazakhstan through Telegram Mini Apps, an admin panel and two bots.
  description: |
    Contract of the central Jan Taxi API. `docs/ARCHITECTURE.md` is the design source; this file is
    the wire contract. It is embedded in the API binary and served at `GET /api/v1/openapi.yaml`,
    and a test checks that every mounted route is documented here.

    ## Clients and authentication
    | Client | Auth | Scheme |
    |---|---|---|
    | Passenger Mini App | `Authorization: Bearer <app token>` with `app=passenger` | `appToken` |
    | Driver Mini App | `Authorization: Bearer <app token>` with `app=driver` | `appToken` |
    | Admin panel | cookie `jt_admin` (+ `X-CSRF-Token` on every non-GET request) | `adminSession`, `csrfHeader` |
    | Passenger / driver bot | `Authorization: Bearer $INTERNAL_BOT_SERVICE_SECRET` + `X-Jantaxi-Bot` | `serviceSecret` |

    App tokens come from `POST /auth/telegram/{passenger|driver}` (Telegram `initData`, validated
    with the matching bot token). The token's `app` claim must match the route group: passenger
    routes reject driver tokens and vice versa (`403 forbidden`). Blocked users get `403 forbidden`.
    Each operation lists the Mini App it serves in `x-jantaxi-app` and, for admin routes, the
    required permission in `x-jantaxi-permission`.

    ## Conventions
    * JSON, UTF-8, `snake_case`. Unknown JSON fields are rejected (`400 bad_request`). JSON bodies are
      limited to 64 KiB, uploads to 10 MiB (`413 payload_too_large`).
    * IDs are UUID strings. Human-facing numbers: `order.number` (1042), `driver.code` (EMB001),
      `topup.reference` (EMB001-TOPUP-000123).
    * Coordinates are WGS84 `{"lat": 48.8264, "lon": 58.1442}` with 6 decimals. GeoJSON positions
      and bounding boxes use `[lon, lat]` order; `bbox` is `[min_lon, min_lat, max_lon, max_lat]`.
    * **Service area:** every passenger stop and every driver location must lie inside Kazakhstan
      (PostGIS `ST_Covers` on the stored boundary). Anything outside is rejected with
      `422 outside_service_area` and `details: {"field": "stops", "index": 1}`.
    * Money is integer **KZT** (no fractions, no floats), field names without suffix (`fare`,
      `amount`, `balance`). Wallet and top-up objects carry `"currency": "KZT"`.
      Commission = `(fare * commission_bps + 5000) / 10000` (integer division, half up).
    * Time values are RFC 3339 strings in UTC (`2026-10-16T09:30:00Z`).
    * Free text (`comment`, `cargo_description`, rating comment, cancel reasons) is trimmed,
      NFC-normalised, newlines/tabs become spaces, control and bidi-override characters are removed,
      runs of spaces collapse, and the result must be at most **120 Unicode code points**
      (`[...s.normalize('NFC')].length` in the Mini Apps).
    * Phones are Kazakhstan mobile numbers in E.164 (`+77XXXXXXXXX`); inputs like `8 707 …`,
      `+7 707 …` and `707…` are normalised.
    * Mini App lists: `?limit=20&before=<cursor>` → `{"items": [...], "next_cursor": "..." | null}`,
      newest first; pass `next_cursor` back as `before`.
      Admin lists: `?page=1&page_size=25` → `{"items": [...], "page": 1, "page_size": 25, "total": 123}`
      (`page_size` ≤ 100).
    * Idempotency: `POST /orders`, `POST /driver/wallet/topups` and admin wallet adjustments take an
      `idempotency_key` (UUID) in the body. A replay with the same key returns the original resource
      with `200`; reusing a key with a different payload returns `409 conflict`.
    * Every response carries `X-Request-ID` (echoed from the request when supplied). Rate-limited
      calls return `429 too_many_requests` with `Retry-After` (seconds).

    ## Errors
    ```json
    {"error": {"code": "validation_failed", "message": "validation failed",
               "fields": {"comment": "too_long"}, "details": {}}}
    ```
    Frontends translate by `code` (and by the per-field reason in `fields`); `message` is an English
    fallback for logs and is never shown to users. See `components.schemas.ErrorCode` for the
    full list and HTTP statuses.

    ## Order lifecycle
    ```
    searching ──accept (driver) / assign (admin)──▶ accepted ──arriving──▶ driver_arriving
    accepted | driver_arriving ──start (driver)──▶ in_progress ──complete (driver)──▶ completed
    searching ──cancel (passenger | admin | system search timeout)──▶ cancelled
    accepted | driver_arriving ──cancel (passenger | driver | admin)──▶ cancelled
    in_progress ──cancel (admin only)──▶ cancelled
    in_progress | completed ──dispute (passenger | admin)──▶ disputed ──resolve (admin)──▶ completed | cancelled
    ```
    Any other transition returns `409 invalid_transition`. A driver cancel returns the order to
    `cancelled` (no automatic re-dispatch). Intermediate stops are completed in `seq` order while
    `in_progress`; `complete` requires all of them and marks the destination completed.

    | category | service_type | cargo_type | required extras |
    |---|---|---|---|
    | `taxi` | `passenger` | `none` | — (`comment` optional) |
    | `parcel` | `delivery` | `parcel` | `cargo_description`, `recipient_phone`, `prohibited_items_ack=true` |
    | `other` | `delivery` | `other` | `cargo_description`, `prohibited_items_ack=true` |

    ## Wallet ledger
    | Event | balance | reserved | ledger key |
    |---|---|---|---|
    | top-up confirmed | +amount | 0 | `topup:<topup_id>` |
    | order accepted | 0 | +commission | `reserve:<order_id>:<driver_id>` |
    | order cancelled before completion | 0 | −commission | `release:<reservation_id>` |
    | order completed | −commission | −commission | `charge:<order_id>` |
    | dispute resolved as cancelled after completion | +commission | 0 | `commission_refund:<order_id>` |
    | admin adjustment | ±amount | 0 | `adjust:<idempotency_key>` |
    | top-up refunded | −amount | 0 | `topup_refund:<topup_id>` |

    `available = balance - reserved`. Accepting an order requires `available >= commission_amount`
    (`402 insufficient_balance` otherwise).

    ## Mini App start parameters
    Deep links `https://t.me/<bot>?startapp=<param>&mode=fullscreen`, `<param>` matching
    `^[A-Za-z0-9_-]{1,64}$`. They are navigation hints only; every screen re-fetches data through
    this API with full authorization.

    | App | Param | Screen |
    |---|---|---|
    | passenger | `home` (default) | map home |
    | passenger | `taxi` / `parcel` / `other` | booking flow with the category preselected |
    | passenger | `orders` | my orders |
    | passenger | `order_<uuid>` | order detail / live trip (`GET /orders/{id}`) |
    | passenger | `support` | support |
    | passenger | `driver` | "become a driver" screen |
    | driver | `home` (default) | driver home |
    | driver | `register` | registration / corrections (`GET /driver/registration`) |
    | driver | `orders` | available orders (`GET /driver/orders`) |
    | driver | `order_<uuid>` | order detail (`GET /driver/orders/{id}`) |
    | driver | `trip` | active trip (`GET /driver/orders/active`) |
    | driver | `wallet` / `topup` / `topup_<uuid>` | wallet / new top-up / top-up detail |
    | driver | `profile` / `support` | profile / support |

    ## Realtime
    `GET /ws` upgrades to a WebSocket. Events are hints; clients re-fetch authoritative state over
    REST. See the operation description for the protocol.
  contact:
    name: Jan Taxi engineering
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /api/v1
    description: |
      Public API behind Caddy: `https://APP_DOMAIN/api/v1` for the Mini Apps and
      `https://ADMIN_DOMAIN/api/v1` for the admin panel. Operations tagged `internal` override this
      with the internal bot listener.
security: []
tags:
  - name: system
    description: Health checks and the contract itself.
  - name: auth
    description: Telegram Mini App sign-in (initData → app token).
  - name: me
    description: The signed-in Mini App user and their preferences.
  - name: config
    description: Public runtime configuration for the Mini Apps and the admin panel.
  - name: realtime
    description: WebSocket event stream.
  - name: geo
    description: Address search and reverse geocoding (Kazakhstan only).
  - name: routes
    description: Route preview and fare quotes.
  - name: orders
    description: Passenger orders (taxi, parcel, other delivery).
  - name: driver-registration
    description: Driver onboarding, documents and moderation corrections.
  - name: driver
    description: Driver profile, availability and location.
  - name: driver-orders
    description: Available orders, acceptance and the active trip.
  - name: wallet
    description: Driver commission wallet and ledger.
  - name: topups
    description: Driver wallet top-ups via Kaspi (manually verified by finance).
  - name: payments
    description: Payment provider callbacks.
  - name: admin-auth
    description: Admin sign-in, session and password.
  - name: admin-admins
    description: Admin accounts and roles.
  - name: admin-dashboard
    description: Operational metrics.
  - name: admin-reports
    description: CSV exports.
  - name: admin-orders
    description: Order oversight, manual cancel and assignment.
  - name: admin-disputes
    description: Order disputes.
  - name: admin-drivers
    description: Driver moderation, suspension, files and live locations.
  - name: admin-topups
    description: Top-up verification, rejection and refunds.
  - name: admin-ledger
    description: Wallet ledger, adjustments and reconciliation.
  - name: admin-cities
    description: Cities, service zones and curated places.
  - name: admin-tariffs
    description: Versioned tariffs per city and category.
  - name: admin-settings
    description: Runtime-editable settings.
  - name: admin-notifications
    description: Notification templates and the Telegram outbox.
  - name: admin-audit
    description: Admin audit log.
  - name: internal
    description: |
      Bot-to-API calls on the internal listener (`:8081`, never proxied). Authenticated with the
      shared service secret plus `X-Jantaxi-Bot`. The Telegram user id in a path comes from the
      update the bot received; the principal is the bot service.
x-tagGroups:
  - name: Mini Apps
    tags: [system, auth, me, config, realtime, geo, routes, orders, driver-registration, driver, driver-orders, wallet, topups, payments]
  - name: Admin panel
    tags: [admin-auth, admin-admins, admin-dashboard, admin-reports, admin-orders, admin-disputes, admin-drivers, admin-topups, admin-ledger, admin-cities, admin-tariffs, admin-settings, admin-notifications, admin-audit]
  - name: Internal
    tags: [internal]
paths:
  # ------------------------------------------------------------------ system
  /healthz:
    servers:
      - url: 'http://api:8080'
        description: Public listener, root path (not under `/api/v1`; not proxied by Caddy).
      - url: 'http://api:8081'
        description: Internal bot listener.
    get:
      operationId: getHealth
      tags: [system]
      summary: Liveness probe
      description: |
        The process is up and serving HTTP. Mounted at the root of both listeners (`:8080/healthz`
        and `:8081/healthz`), outside `/api/v1`; there is no `/api/v1/healthz`. Not rate limited.
      security: []
      responses:
        '200':
          description: Alive.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthStatus'}
              example: {status: ok}
  /readyz:
    servers:
      - url: 'http://api:8080'
        description: Public listener, root path (not under `/api/v1`; not proxied by Caddy).
    get:
      operationId: getReadiness
      tags: [system]
      summary: Readiness probe
      description: |
        Ready to serve traffic: the database answers within 3 seconds, its schema is at the
        migration version embedded in the binary, every registered check passes (`realtime`: the
        LISTEN connection is up while the hub runs) and the process is not shutting down.
        Mounted at the root of the public listener only, outside `/api/v1`. Failure causes are
        logged, never returned.
      security: []
      responses:
        '200':
          description: Ready.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReadinessStatus'}
              example: {status: ready, checks: {database: ok, migrations: ok, realtime: ok}, schema_version: 4}
        '503':
          description: Not ready, or draining during graceful shutdown (then only `status` is sent).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReadinessStatus'}
              examples:
                notReady:
                  value: {status: not_ready, checks: {database: ok, migrations: pending, realtime: ok}, schema_version: 3}
                draining:
                  value: {status: draining}
  /openapi.yaml:
    get:
      operationId: getOpenApiSpec
      tags: [system]
      summary: This contract
      description: 'The embedded document, served with a strong `ETag` and `Cache-Control: no-cache`.'
      security: []
      parameters:
        - name: If-None-Match
          in: header
          description: ETag from a previous response.
          schema: {type: string}
      responses:
        '200':
          description: OpenAPI 3.1 document.
          headers:
            ETag:
              description: Hash of the embedded document.
              schema: {type: string}
          content:
            application/yaml:
              schema: {type: string}
        '304':
          description: Not modified (the `If-None-Match` value equals the current `ETag`).
        '429': {$ref: '#/components/responses/TooManyRequests'}

  # -------------------------------------------------------------------- auth
  /auth/telegram/passenger:
    post:
      operationId: authTelegramPassenger
      tags: [auth]
      summary: Sign in to the passenger Mini App
      description: |
        Validates the raw `initData` string with the **passenger** bot token:
        `secret = HMAC_SHA256(key="WebAppData", msg=bot_token)`; the data-check-string is every
        field except `hash` (the `signature` field stays in), URL-decoded, sorted by key and joined
        as `key=value` lines with `\n`; constant-time comparison. Duplicate keys, a raw value over
        4096 bytes, a missing `user`/`auth_date`/`hash` are rejected (`401 invalid_init_data`).
        `auth_date` must be at most `TELEGRAM_INITDATA_MAX_AGE` old (24h by default) and at most
        60s in the future (`401 init_data_expired`). Upserts the user by Telegram user id (a new
        user gets language `kk`, never derived from the Telegram client language) and returns an
        app token with `app=passenger`, valid for `APP_TOKEN_TTL` (12h). A blocked user gets
        `403 user_blocked`. Rate limited per IP for this app (60/min, burst 20, `Retry-After: 10`)
        on top of the login-path limit (30/min, burst 10, `Retry-After: 60`).
      x-jantaxi-app: [passenger]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TelegramAuthRequest'}
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AppTokenResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/InitDataRejected'}
        '403': {$ref: '#/components/responses/SignInBlocked'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422':
          description: '`validation_failed` with `fields.init_data = required` (empty `init_data`).'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              example: {error: {code: validation_failed, message: validation failed, fields: {init_data: required}}}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /auth/telegram/driver:
    post:
      operationId: authTelegramDriver
      tags: [auth]
      summary: Sign in to the driver Mini App
      description: |
        Same as the passenger sign-in, validated with the **driver** bot token; the token carries
        `app=driver`. A driver profile is not required (registration starts afterwards). Has its
        own per-IP limiter (60/min, burst 20).
      x-jantaxi-app: [driver]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TelegramAuthRequest'}
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AppTokenResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/InitDataRejected'}
        '403': {$ref: '#/components/responses/SignInBlocked'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422':
          description: '`validation_failed` with `fields.init_data = required` (empty `init_data`).'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              example: {error: {code: validation_failed, message: validation failed, fields: {init_data: required}}}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  # ---------------------------------------------------------------------- me
  /me:
    get:
      operationId: getMe
      tags: [me]
      summary: Current user
      description: |
        The signed-in user, preferred language and masked phone. With a driver token `driver`
        summarises the driver profile (or is `null` before registration starts); with a passenger
        token it is always `null`. For driver tokens the phone falls back to the driver profile's
        verified phone when the user row has none. A valid token for a user that no longer
        exists returns `401 unauthorized` so the app signs in again.
      x-jantaxi-app: [passenger, driver]
      security: [{appToken: []}]
      responses:
        '200':
          description: Current user.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Me'}
        '401': {$ref: '#/components/responses/AppUnauthorized'}
        '403': {$ref: '#/components/responses/AppForbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /me/preferences:
    patch:
      operationId: updateMyPreferences
      tags: [me]
      summary: Change preferences
      description: |
        Sets the UI and bot language (shared by the Mini App and the matching bot). A missing
        `language` is `422` with `fields.language = required`, an unsupported one
        `fields.language = invalid`. Returns the updated `Me`.
      x-jantaxi-app: [passenger, driver]
      security: [{appToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PreferencesUpdateRequest'}
      responses:
        '200':
          description: Updated user.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Me'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/AppUnauthorized'}
        '403': {$ref: '#/components/responses/AppForbidden'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  # ------------------------------------------------------------------ config
  /public/config:
    get:
      operationId: getPublicConfig
      tags: [config]
      summary: Public runtime configuration
      description: |
        Non-secret configuration the SPA needs before sign-in: languages, the default map city,
        map style, route point limit, bot usernames and direct links, support contacts, the
        prohibited item codes and the 2GIS navigation base. `fare` (taxi fare range of the
        default city) is added for `app=passenger` when that city has an active taxi tariff;
        `kaspi` and `topup` are added for `app=driver` only. `city` is `null` when no active city
        exists. Served with `Cache-Control: public, max-age=60` (not `no-store`).
      security: []
      parameters:
        - name: app
          in: query
          required: true
          description: Which client is asking; missing or unknown is `422` with `fields.app = invalid`.
          schema:
            type: string
            enum: [passenger, driver, admin]
      responses:
        '200':
          description: Configuration.
          headers:
            Cache-Control:
              description: Always `public, max-age=60`.
              schema: {type: string, const: 'public, max-age=60'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicConfig'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  # ---------------------------------------------------------------- realtime
  /ws:
    get:
      operationId: openRealtimeSocket
      tags: [realtime]
      summary: WebSocket event stream
      description: |
        Upgrades to a WebSocket (`Connection: Upgrade`, `Upgrade: websocket`). Same origin as the
        API (`wss://APP_DOMAIN/api/v1/ws`, `wss://ADMIN_DOMAIN/api/v1/ws`). The `Origin` header
        must be one of the configured frontend origins: a missing `Origin` is
        `403 origin_required` (JSON, allowed only in development); a foreign `Origin` is rejected
        by the WebSocket library with a plain-text `403`.

        **Authentication.** Admin sessions are authenticated by the `jt_admin` cookie during the
        upgrade and skip the auth frame. Every other client sends the app token in the first text
        frame within 5 seconds: `{"type": "auth", "token": "<app token>"}`
        (`RealtimeAuthFrame`); tokens are never put in the URL.

        **Server frames** (JSON text frames, `RealtimeServerFrame`):
        * `{"type": "ready", "scopes": ["user:<id>", "driver:<id>"]}` once authenticated;
        * events `{"type": "order.accepted", "id": "<uuid>", "ts": "2026-10-16T09:31:05Z", "data": {...}}`
          (`RealtimeEvent`), delivered only after the business transaction commits;
        * `{"type": "pong"}` in reply to a client `{"type": "ping"}`;
        * `{"type": "resync"}` after the server's LISTEN connection reconnected (events may have
          been missed: re-fetch over REST).

        **Scopes** are implicit from the principal: a passenger receives `user:<user_id>`, a
        driver `user:<user_id>` plus `driver:<driver_id>` once a profile exists, an admin `admin`.
        Access and scopes are re-checked every 60 seconds (blocked users, revoked sessions and
        new driver profiles take effect within a minute).

        **Close codes.** `1008` (policy violation) with reason `auth_timeout` (no auth frame in
        5s), `unauthorized` (bad first frame or token), `token_expired` (at connect, or when the
        token's `exp` passes on an open socket), `user_blocked`, `slow_consumer` (the client did not
        keep up) or `rate_limited` (more than 5 client frames/s sustained, burst 20); `1009` for a
        client frame over 4 KiB; `1011` reason `internal` when authentication fails on the server;
        `1001` reason `server_shutdown` on graceful shutdown.

        **Keep-alive and recovery.** The server sends WebSocket pings every 25 seconds. Clients
        reconnect with exponential backoff 1s → 30s and re-sync over REST after a reconnect, on
        `resync`, on `visibilitychange` and on Telegram `activated`. Events are hints: always
        re-fetch the authoritative resource (`GET /orders/{id}`, `GET /driver/orders/active`,
        `GET /driver/wallet`, …).
      x-jantaxi-app: [passenger, driver, admin]
      x-jantaxi-websocket:
        client_messages:
          - $ref: '#/components/schemas/RealtimeAuthFrame'
          - $ref: '#/components/schemas/RealtimePingFrame'
        server_messages:
          - $ref: '#/components/schemas/RealtimeServerFrame'
      security:
        - {}
        - adminSession: []
      responses:
        '101':
          description: Switching Protocols; the WebSocket session starts.
        '400':
          description: Invalid WebSocket handshake (version or `Sec-WebSocket-Key`); plain text.
          content:
            text/plain:
              schema: {type: string}
        '403':
          description: |
            `origin_required` (JSON) when `Origin` is missing outside development, or a plain-text
            `403` for an origin that is not allowed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              example: {error: {code: origin_required, message: Origin header required}}
            text/plain:
              schema: {type: string}
        '426':
          description: Not a WebSocket upgrade request; plain text.
          content:
            text/plain:
              schema: {type: string}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  # --------------------------------------------------------------------- geo
  /geo/search:
    get:
      operationId: searchPlaces
      tags: [geo]
      summary: Search addresses and places
      description: |
        Admin-curated places first (bus station, akimat, bazaar…; names and aliases, Kazakh
        letters typed on a Russian keyboard also match), then the geocoding provider (1.2 s
        timeout, circuit breaker, 15-minute cache). Only results inside Kazakhstan are returned;
        near-duplicates are dropped; results are biased towards `lat`/`lon` when given. The
        language is `lang` or the user's saved preference. Returns a JSON array (possibly empty).
        Rate limited per user, shared with `/geo/reverse` (60/min, burst 20, `Retry-After: 10`).
        `fields`: `q` = `required | too_short | too_long`, `lat`/`lon` = `required | invalid`,
        `limit` = `invalid`, `lang` = `invalid`.
      x-jantaxi-app: [passenger, driver]
      security: [{appToken: []}]
      parameters:
        - name: q
          in: query
          required: true
          description: Search text (cleaned like free text; 2..100 code points).
          schema: {type: string, minLength: 2, maxLength: 100}
          example: вокзал
        - name: lat
          in: query
          description: Bias latitude (send together with `lon`).
          schema: {type: number, minimum: -90, maximum: 90}
          example: 48.8264
        - name: lon
          in: query
          description: Bias longitude (send together with `lat`).
          schema: {type: number, minimum: -180, maximum: 180}
          example: 58.1442
        - name: limit
          in: query
          description: Maximum number of results.
          schema: {type: integer, minimum: 1, maximum: 20, default: 10}
        - $ref: '#/components/parameters/LangQuery'
      responses:
        '200':
          description: Matches, best first.
          content:
            application/json:
              schema:
                type: array
                maxItems: 20
                items: {$ref: '#/components/schemas/GeoPlace'}
              example:
                - {title: Теміржол вокзалы, subtitle: Ембі, lat: 48.8291, lon: 58.1504, source: place}
                - {title: Орталық базар, subtitle: Ембі, lat: 48.8247, lon: 58.1418, source: place}
        '401': {$ref: '#/components/responses/AppUnauthorized'}
        '403': {$ref: '#/components/responses/AppForbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /geo/reverse:
    get:
      operationId: reverseGeocode
      tags: [geo]
      summary: Address for a point
      description: |
        Address for a map pin. Order: a curated place within 75 m, then the geocoding provider,
        then the formatted coordinates (`48.826400, 58.144200`) with `source: coordinates` and a
        localized subtitle. Never fails for a valid point. Points outside Kazakhstan get
        `in_service_area: false` (the provider is not called). `lat`/`lon` echo the pin, not the
        matched place. Rate limited per user, shared with `/geo/search`.
        `fields`: `lat`/`lon` = `required | invalid`, `lang` = `invalid`.
      x-jantaxi-app: [passenger, driver]
      security: [{appToken: []}]
      parameters:
        - name: lat
          in: query
          required: true
          schema: {type: number, minimum: -90, maximum: 90}
          example: 48.8264
        - name: lon
          in: query
          required: true
          schema: {type: number, minimum: -180, maximum: 180}
          example: 58.1442
        - $ref: '#/components/parameters/LangQuery'
      responses:
        '200':
          description: Best address.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GeoReverseResult'}
        '401': {$ref: '#/components/responses/AppUnauthorized'}
        '403': {$ref: '#/components/responses/AppForbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  # ------------------------------------------------------------------ routes
  /routes/preview:
    post:
      operationId: previewRoute
      tags: [routes]
      summary: Route and fare quote
      description: |
        Validates 2..N stops (N = the smaller of `MAX_ROUTE_POINTS` and the setting
        `routing.max_points`, at most 5; pickup first, destination last), checks every point is
        inside Kazakhstan, resolves the tariff region of the pickup (the city owning the smallest
        active zone that covers it, so a configured city wins inside its zone; otherwise the
        nationwide default region `KAZ`; never the nearest city), names the settlement of the
        pickup once by reverse geocoding (`locality`: the settlement whose outline covers the
        pickup by its own name, else the town or district of the nearest address; at most 1.5 s,
        `null` on failure), routes the
        stops in the given order with OSRM once and prices
        the trip for every active vehicle class (ARCHITECTURE §21) that can carry the request —
        taxi: passenger-capable and `seats_max ≥ passenger_count`; parcel/other: cargo-capable and
        default cargo volume ≥ the `cargo_size` volume — and has an active tariff for the
        category: the tariff of that region, or, for a class or category the region has no active
        tariff for, the nationwide `KAZ` tariff (so a city zone never switches a service off).
        Each option's `tariff_region` (and the region of its quote, which the order inherits)
        names the region whose tariff priced it. Coordinates are rounded to 6 decimals. Returns
        one quote per class in `options[]` (valid for 10 minutes); `POST /orders` references the
        chosen option's `quote_id`. The top-level quote fields (`city` and `tariff_region`
        included) repeat the first option for older clients.
        Rate limited per user (30/min, burst 10, `Retry-After: 10`).

        422 cases: `validation_failed` (`fields.category` = `required | invalid | not_allowed`
        — `not_allowed` when no class that could carry the request is priced in the region or
        nationwide;
        `fields.passenger_count` = `too_small | too_large | not_allowed` — `too_large` also when no
        active class seats that many; `fields.cargo_size` = `invalid | not_allowed | too_large` —
        `too_large` when no active class has that much cargo space;
        `fields.stops` = `required | too_few | too_many` with `details.max`;
        `fields["stops.N.lat"|"stops.N.lon"]` = `required | invalid`;
        `fields["stops.N.address"]` = `required | too_long | invalid`;
        `fields["stops.N.address_details"]` = `too_long | invalid`;
        `fields["stops.N"] = duplicate` for consecutive identical points),
        `outside_service_area` (`details: {field: stops, index}`), `no_active_city`, and
        `route_unavailable` with `details.reason` = `no_route` or `point_not_routable` (+ `index`,
        the stop that is more than 1000 m from a road).
      x-jantaxi-app: [passenger]
      security: [{appToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RoutePreviewRequest'}
      responses:
        '200':
          description: Quote.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RouteQuote'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/AppUnauthorized'}
        '403': {$ref: '#/components/responses/AppForbidden'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/UnprocessableRoute'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/RoutingUnavailable'}

  # ------------------------------------------------------------------ orders
  /orders:
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create an order from a quote
      description: |
        Creates a `searching` order from an unexpired, unused quote of the same user. `fare` must be
        one of the quote's `fare.options` (`422 fare_not_allowed` with `details {min, max, step}`).
        The category comes from the quote and decides the extra fields:
        `parcel` needs `cargo_description`, `recipient_phone` and `prohibited_items_ack=true`;
        `other` needs `cargo_description` and `prohibited_items_ack=true` and must not send
        `recipient_phone`; `taxi` must not send `cargo_description`, `recipient_phone` or
        `prohibited_items_ack=true` (`not_allowed`). For delivery categories `cargo_description`
        and `comment` are screened against `delivery.blocked_keywords`
        (`prohibited_content`). Commission is snapshotted from the quote. All eligible drivers
        receive an offer, a Telegram notification and an `order.available` event.

        A passenger may have one active ride and one active delivery at a time; a second one
        returns `409 conflict` with `details {reason: active_order_exists, active_order_id}`
        (`active_order_id` is omitted when the competing order finished meanwhile).
        Idempotent by `idempotency_key`: a replay with the same quote, fare and payment method
        returns the original order with `200`; the same key with a different payload is
        `409 conflict` with `details.reason = idempotency_key_reused`.
        A passenger who cancelled `orders.passenger_cancels_after_accept_per_day` (default 3,
        0 = no limit) orders after a driver had accepted them — each costs that driver the
        commission — within the last 24 hours gets `409 conflict` with
        `details {reason: too_many_cancellations, limit}`.

        `fields`: `quote_id` = `required | invalid`, `idempotency_key` = `required | invalid`,
        `fare` = `required | invalid`, `payment_method` = `required | invalid`,
        `comment` = `too_long | invalid | prohibited_content`,
        `cargo_description` = `required | too_long | invalid | not_allowed | prohibited_content`,
        `recipient_phone` = `required | invalid | not_allowed`,
        `prohibited_items_ack` = `must_be_true | not_allowed`.
        An unknown quote or another user's quote is `404 not_found`; an expired quote
        `422 quote_expired`, an already used one `422 quote_expired` with
        `details.reason = quote_used`.
      x-jantaxi-app: [passenger]
      security: [{appToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OrderCreateRequest'}
      responses:
        '201':
          description: Order created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
        '200':
          description: Idempotent replay; the order created earlier with this key.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/AppUnauthorized'}
        '403': {$ref: '#/components/responses/AppForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: '`conflict` with `details.reason` = `active_order_exists` (+ `active_order_id`), `idempotency_key_reused` or `too_many_cancellations` (+ `limit`).'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                activeOrder:
                  value:
                    error:
                      code: conflict
                      message: passenger already has an active order of this service type
                      details: {reason: active_order_exists, active_order_id: 0a6f4c4e-6f1b-4b8e-9a52-3c1d2e7f9b10}
                keyReused:
                  value:
                    error:
                      code: conflict
                      message: idempotency key already used for a different order
                      details: {reason: idempotency_key_reused}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/UnprocessableOrder'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
    get:
      operationId: listMyOrders
      tags: [orders]
      summary: My orders
      description: |
        `active` = `searching`, `accepted`, `driver_arriving`, `in_progress`; `history` (default)
        = `completed`, `cancelled`, `disputed`. Newest first (`created_at`, then id).
        `fields`: `scope` / `limit` / `before` = `invalid`.
      x-jantaxi-app: [passenger]
      security: [{appToken: []}]
      parameters:
        - name: scope
          in: query
          schema:
            type: string
            enum: [active, history]
            default: history
        - $ref: '#/components/parameters/CursorLimit'
        - $ref: '#/components/parameters/CursorBefore'
      responses:
        '200':
          description: Page of orders.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrderSummaryCursorList'}
        '401': {$ref: '#/components/responses/AppUnauthorized'}
        '403': {$ref: '#/components/responses/AppForbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /orders/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      operationId: getOrder
      tags: [orders]
      summary: Order detail
      description: |
        Stops, route snapshot, status history, the assigned driver and vehicle, and the driver's
        last location while the order is `accepted`, `driver_arriving` or `in_progress`. Only the
        passenger's own orders (`404` otherwise).
      x-jantaxi-app: [passenger]
      security: [{appToken: []}]
      responses:
        '200':
          description: Order.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
        '401': {$ref: '#/components/responses/AppUnauthorized'}
        '403': {$ref: '#/components/responses/AppForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /orders/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      operationId: cancelOrder
      tags: [orders]
      summary: Cancel my order
      description: |
        Only passengers cancel (ARCHITECTURE §22.3). Allowed while `searching`, `accepted` or
        `driver_arriving` (`409 invalid_transition` with `details {from, action: cancel}`
        otherwise). The reason is required: `reason_code` is one of `long_wait | driver_issue |
        vehicle_issue | changed_plans | other` and `comment` (free text, ≤ 120 code points) is
        required with `other`. `fields`: `reason_code` = `required | invalid`, `comment` =
        `required | too_long | invalid`. Stored as `cancel_reason_code` + `cancel_reason` (the
        comment). The commission the driver paid when taking the order is **not** refunded
        (§22.2; only an operator refunds it). The assigned driver is told the order was cancelled
        (without the passenger's reason); other drivers' offer messages are marked cancelled.

        `expected_status` is the status the passenger saw when confirming. When the order has
        moved on since (typically a driver accepted it while the passenger was cancelling a
        search), nothing changes and the answer is `409 conflict` with
        `details {reason: order_changed, status}`: the app shows the new state and the passenger
        decides again. `fields.expected_status` = `invalid` for an unknown status. Orders
        cancelled after acceptance count towards the passenger's daily limit (see `POST /orders`).
      x-jantaxi-app: [passenger]
      security: [{appToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OrderCancelRequest'}
      responses:
        '200':
          description: Cancelled order.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/AppUnauthorized'}
        '403': {$ref: '#/components/responses/AppForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: '`invalid_transition` with `details {from, action: cancel}`, or `conflict` with `details {reason: order_changed, status}` when `expected_status` no longer holds.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                invalidTransition:
                  value:
                    error:
                      code: invalid_transition
                      message: transition not allowed
                      details: {from: completed, action: cancel}
                orderChanged:
                  value:
                    error:
                      code: conflict
                      message: the order changed meanwhile
                      details: {reason: order_changed, status: accepted}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /orders/{id}/rating:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      operationId: rateOrder
      tags: [orders]
      summary: Rate the driver
      description: |
        Completed orders with a driver only (`409 invalid_transition` with
        `details {from, action: rate}` otherwise), once per order (`409 conflict` with
        `details.reason = already_rated`). Updates the driver's rating.
        `fields`: `rating` = `required | too_small | too_large`, `comment` = `too_long | invalid`.
      x-jantaxi-app: [passenger]
      security: [{appToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OrderRatingRequest'}
      responses:
        '200':
          description: Order with the rating.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/AppUnauthorized'}
        '403': {$ref: '#/components/responses/AppForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: '`invalid_transition` (not completed) or `conflict` with `details.reason = already_rated`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                notCompleted:
                  value: {error: {code: invalid_transition, message: transition not allowed, details: {from: in_progress, action: rate}}}
                alreadyRated:
                  value: {error: {code: conflict, message: order already rated, details: {reason: already_rated}}}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /orders/{id}/dispute:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      operationId: disputeOrder
      tags: [orders]
      summary: Open a dispute
      description: |
        Allowed while `in_progress` or within 72 hours after `completed_at`; moves the order to
        `disputed` and notifies operators. A passenger may dispute an order only once
        (`409 conflict` with `details.reason = dispute_exists`, also after resolution). After
        the 72-hour window: `409 invalid_transition` with
        `details {from: completed, action: dispute, reason: dispute_window_closed}`.
        `fields.reason` = `required | too_long | invalid` (1..500 code points).
      x-jantaxi-app: [passenger]
      security: [{appToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OrderDisputeRequest'}
      responses:
        '200':
          description: Disputed order.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/AppUnauthorized'}
        '403': {$ref: '#/components/responses/AppForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: '`invalid_transition` (wrong status or window closed) or `conflict` with `details.reason = dispute_exists`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                windowClosed:
                  value: {error: {code: invalid_transition, message: transition not allowed, details: {from: completed, action: dispute, reason: dispute_window_closed}}}
                exists:
                  value: {error: {code: conflict, message: order already disputed, details: {reason: dispute_exists}}}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /orders/{id}/driver-photo:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      operationId: getOrderDriverPhoto
      tags: [orders]
      summary: Assigned driver's avatar
      description: |
        JPEG avatar of the driver assigned to this order (any status, the caller's own orders
        only). `404` when the order is not the caller's, no driver is assigned or the driver has
        no avatar. Fetch with the `Authorization` header and display via an object URL.
      x-jantaxi-app: [passenger]
      security: [{appToken: []}]
      responses:
        '200': {$ref: '#/components/responses/JpegImage'}
        '401': {$ref: '#/components/responses/AppUnauthorized'}
        '403': {$ref: '#/components/responses/AppForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  # ----------------------------------------------------- driver-registration
  /driver/registration:
    get:
      operationId: getDriverRegistration
      tags: [driver-registration]
      summary: Registration state
      description: |
        Current registration data, uploaded files, moderation status, open corrections, missing
        fields, personal-data consent and moderation history. Before the first `PUT` there is no
        profile yet: the response has `status: draft`, `id: null` and `code: null`.
      x-jantaxi-app: [driver]
      security: [{appToken: []}]
      responses:
        '200':
          description: Registration.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DriverRegistration'}
        '401': {$ref: '#/components/responses/AppUnauthorized'}
        '403': {$ref: '#/components/responses/AppForbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
    put:
      operationId: saveDriverRegistration
      tags: [driver-registration]
      summary: Save registration data
      description: |
        Saves the text fields of the application. The first call creates the driver profile, an
        empty vehicle and the wallet, and assigns the driver code of the driver's city: with
        `location` (the device position) inside Kazakhstan, the city owning the smallest active
        zone that covers it, else the nationwide region `KAZ` (codes `KAZ001`…); without a
        location (or outside Kazakhstan) the default city (`DEFAULT_CITY`, else the oldest active
        city; `422 no_active_city` when none). Later saves never change the city or the code. Allowed while
        `draft` or `changes_requested`; otherwise `409 conflict` with
        `details {reason: registration_locked, status}`. In `changes_requested` only the flagged
        fields may change: other changes are `422 validation_failed` with
        `fields.<name> = not_editable` and `details {reason: field_locked, editable_fields}`
        (an unflagged plate is kept as stored). Empty strings are allowed while drafting;
        completeness is checked on submit. A non-empty plate must be a valid Kazakhstan plate
        (current format, or the legacy `L NNN LL(L)` format) and not claimed by another driver
        (`409 plate_taken`).
        `fields`: `first_name` / `last_name` = `required | too_long | invalid` (letters, spaces,
        `-`, `'`, `.` only), `vehicle` = `required`, `vehicle.make` / `vehicle.model` /
        `vehicle.color` = `required | too_long | invalid`, `vehicle.plate` =
        `required | too_long | invalid`, `location` = `invalid`.
      x-jantaxi-app: [driver]
      security: [{appToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DriverRegistrationUpdateRequest'}
      responses:
        '200':
          description: Saved registration.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DriverRegistration'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/AppUnauthorized'}
        '403': {$ref: '#/components/responses/AppForbidden'}
        '409': {$ref: '#/components/responses/RegistrationConflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /driver/registration/files:
    post:
      operationId: uploadDriverRegistrationFile
      tags: [driver-registration]
      summary: Upload a registration photo
      description: |
        Multipart upload of one image: form fields `kind` and `file` only (any other part, or a
        second file, is `400`). JPEG, PNG or WebP by magic bytes, file ≤ `MAX_UPLOAD_BYTES`
        (10 MiB; `413 file_too_large`), at most 40 megapixels (`422 image_too_large`); other or
        undecodable content is `422 unsupported_file_type`. The server decodes and re-encodes
        it to JPEG (EXIF and GPS stripped, longest side ≤ 2000 px). For every kind except
        `vehicle_extra` a new upload replaces the current file of that kind; up to 4
        `vehicle_extra` photos are kept (`422` with `fields.kind = too_many` and
        `details.max_extra_photos = 4`). Requires an existing profile
        (`403 driver_not_registered` before the first `PUT /driver/registration`) in `draft` or
        `changes_requested` (`409 conflict` with `details.reason = registration_locked`); in
        `changes_requested` only flagged fields (`422 fields.kind = not_editable`,
        `details.reason = field_locked`). `fields`: `kind` = `required | invalid | too_many |
        not_editable`, `file` = `required`.
      x-jantaxi-app: [driver]
      security: [{appToken: []}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {$ref: '#/components/schemas/DriverFileUpload'}
            encoding:
              file:
                contentType: image/jpeg, image/png, image/webp
      responses:
        '201':
          description: Stored file (`kind` is the upload kind).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FileRef'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/AppUnauthorized'}
        '403': {$ref: '#/components/responses/DriverForbidden'}
        '409': {$ref: '#/components/responses/RegistrationConflict'}
        '413': {$ref: '#/components/responses/FileTooLarge'}
        '415':
          description: '`unsupported_media_type`: not `multipart/form-data`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              example: {error: {code: unsupported_media_type, message: expected multipart/form-data}}
        '422': {$ref: '#/components/responses/UnprocessableUpload'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /driver/registration/files/{fileId}:
    parameters:
      - $ref: '#/components/parameters/FileIdPath'
    delete:
      operationId: deleteDriverRegistrationFile
      tags: [driver-registration]
      summary: Remove an extra vehicle photo
      description: |
        Only current `vehicle_extra` photos of the caller's vehicle can be removed (`404` for an
        unknown file); required photos are replaced by uploading a new one (`409 conflict` with
        `details.reason = not_removable`). Only while the registration is editable (`409
        conflict` with `details.reason = registration_locked`); in `changes_requested` only when
        `vehicle_photos` is flagged (`422 fields.vehicle_photos = not_editable`,
        `details.reason = field_locked`).
      x-jantaxi-app: [driver]
      security: [{appToken: []}]
      responses:
        '204':
          description: Removed.
        '401': {$ref: '#/components/responses/AppUnauthorized'}
        '403': {$ref: '#/components/responses/DriverForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/RegistrationConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /driver/registration/check:
    post:
      operationId: checkDriverRegistration
      tags: [driver-registration]
      summary: Check a plate before saving
      description: |
        Advisory check while typing: normalises the plate (Cyrillic look-alikes → Latin, spaces and
        dashes removed), validates the format and reports whether another driver already holds
        it. Works before a profile exists. Final checks happen on save and submit.
        `fields.plate = too_long` above 20 code points.
      x-jantaxi-app: [driver]
      security: [{appToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DriverRegistrationCheckRequest'}
      responses:
        '200':
          description: Check result.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DriverRegistrationCheckResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/AppUnauthorized'}
        '403': {$ref: '#/components/responses/AppForbidden'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /driver/register:
    post:
      operationId: submitDriverRegistration
      tags: [driver-registration]
      summary: Submit for moderation
      description: |
        Submits (`draft`) or resubmits (`changes_requested`) the application; status becomes
        `pending` and moderators are notified. Personal-data consent is required on the first
        submission (`fields.pd_consent = must_be_true`, `fields.pd_consent_version =
        required | invalid`); a resubmission may omit the body when consent is already recorded,
        and `pd_consent: false` is always refused. Requires every field and photo
        (`422 registration_incomplete` with `details.missing_fields`) and a Telegram-verified phone
        when the setting `driver.require_phone_verification` is on (`422 phone_not_verified`
        when the phone is the only missing item), and a plate and phone not held by another live
        driver (`409 plate_taken`, `409 phone_taken`). Any other status →
        `409 invalid_transition` with `details {from, action: submit}`. The body is optional.
      x-jantaxi-app: [driver]
      security: [{appToken: []}]
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DriverSubmitRequest'}
      responses:
        '200':
          description: 'Submitted registration (`status: pending`).'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DriverRegistration'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/AppUnauthorized'}
        '403': {$ref: '#/components/responses/DriverForbidden'}
        '409':
          description: '`invalid_transition`, `plate_taken` or `phone_taken`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                status:
                  value: {error: {code: invalid_transition, message: transition not allowed, details: {from: pending, action: submit}}}
                plate:
                  value: {error: {code: plate_taken, message: plate is registered to another driver}}
                phone:
                  value: {error: {code: phone_taken, message: phone is registered to another driver}}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/UnprocessableRegistration'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /driver/files/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      operationId: getDriverFile
      tags: [driver-registration]
      summary: Download one of my files
      description: |
        Any file the caller uploaded (avatar, ID photos, vehicle photos, top-up receipts);
        `404` for anything else, including deleted files. Works before a driver profile exists.
        Fetch with the `Authorization` header and display via an object URL.
      x-jantaxi-app: [driver]
      security: [{appToken: []}]
      responses:
        '200': {$ref: '#/components/responses/JpegImage'}
        '401': {$ref: '#/components/responses/AppUnauthorized'}
        '403': {$ref: '#/components/responses/AppForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  # ------------------------------------------------------------------ driver
  /driver/profile:
    get:
      operationId: getDriverProfile
      tags: [driver]
      summary: My driver profile
      description: Profile, vehicle, rating, completed trips and status. `403 driver_not_registered` before registration.
      x-jantaxi-app: [driver]
      security: [{appToken: []}]
      responses:
        '200':
          description: Profile.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DriverProfile'}
        '401': {$ref: '#/components/responses/AppUnauthorized'}
        '403': {$ref: '#/components/responses/DriverForbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
    patch:
      operationId: updateDriverProfile
      tags: [driver]
      summary: Update non-moderated profile fields
      description: |
        No profile field is self-editable in this version. An empty object is a no-op and returns
        the profile. The moderated keys `first_name`, `last_name`, `phone`, `avatar`,
        `avatar_file_id`, `vehicle`, `city`, `city_id`, `code`, `status`, `documents` and
        `language` return `422 validation_failed` with `fields.<name> = not_editable` and
        `details.reason = field_locked` (language is changed with `PATCH /me/preferences`); any
        other key is `400 bad_request`, as is a non-object body.
      x-jantaxi-app: [driver]
      security: [{appToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DriverProfileUpdateRequest'}
      responses:
        '200':
          description: Profile.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DriverProfile'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/AppUnauthorized'}
        '403': {$ref: '#/components/responses/DriverForbidden'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /driver/availability:
    patch:
      operationId: setDriverAvailability
      tags: [driver]
      summary: Go online or offline
      description: |
        Going online requires `status = approved` (`403 driver_not_approved` with
        `details {reason: not_approved | suspended, status}`), a user that is not blocked
        (`403 user_blocked`), `available >= driver.min_online_balance` (`402 insufficient_balance`
        with `details {required, available, currency, topup_min_amount}`) and, when the city
        requires a driver location, a fix newer than `driver_location_max_age_s`
        (`422 location_required` with `details.max_age_s`). Going offline is always allowed and
        does not affect an active order. Repeating the current state refreshes the heartbeat.
        Drivers are switched offline automatically after the idle timeout without heartbeat or
        location. `fields.online = required` when missing.
      x-jantaxi-app: [driver]
      security: [{appToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AvailabilityUpdateRequest'}
      responses:
        '200':
          description: New availability.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Availability'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/AppUnauthorized'}
        '402': {$ref: '#/components/responses/InsufficientBalance'}
        '403': {$ref: '#/components/responses/DriverActionForbidden'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/UnprocessableAvailability'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /driver/location:
    post:
      operationId: reportDriverLocation
      tags: [driver]
      summary: Report current location
      description: |
        Stores the driver's latest position (also the online heartbeat; coordinates rounded to 6
        decimals) and, during an active order, appends to the trip track. Publishes
        `driver.location_updated` (to admins, plus the passenger during an active order) at most
        every 3 seconds while online or on a trip. A fix older than the stored one is ignored
        (still `204`). Only approved drivers (`403 driver_not_approved` with `details.status`).
        The point must be inside Kazakhstan (`422 outside_service_area` with
        `details {field: location, index: 0}`). `fields`: `lat`/`lon` = `required | invalid`,
        `accuracy_m` (0..100000), `heading` (0..360), `speed_mps` (0..100) = `invalid`,
        `recorded_at` = `invalid` (not RFC 3339, or more than 60 s in the future). Rate limited
        per driver before the body is read (30/min, burst 3; `429` with `Retry-After: 2`).
      x-jantaxi-app: [driver]
      security: [{appToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LocationInput'}
      responses:
        '204':
          description: Stored (or ignored as older than the stored fix).
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/AppUnauthorized'}
        '403': {$ref: '#/components/responses/DriverActionForbidden'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/UnprocessableLocation'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  # ----------------------------------------------------------- driver-orders
  /driver/orders:
    get:
      operationId: listAvailableOrders
      tags: [driver-orders]
      summary: Available orders
      description: |
        `searching` orders in the driver's city that the driver may accept right now (approved,
        online, no active order, available balance ≥ the order's commission, not the driver's own
        passenger order, and — when the city requires it — a fresh location within the dispatch
        radius). Computed live, at most 50. Sorted by distance to the pickup when the driver has a
        fresh location, otherwise newest first. When the driver is not eligible `items` is empty
        and `eligibility.reason` says why; `insufficient_balance` is reported only when searching
        orders exist that the balance cannot cover. Requires a driver profile (any status).
      x-jantaxi-app: [driver]
      security: [{appToken: []}]
      responses:
        '200':
          description: Available orders.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AvailableOrders'}
        '401': {$ref: '#/components/responses/AppUnauthorized'}
        '403': {$ref: '#/components/responses/DriverForbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /driver/orders/active:
    get:
      operationId: getActiveDriverOrder
      tags: [driver-orders]
      summary: My active order
      description: The order in `accepted`, `driver_arriving` or `in_progress`, or `204` when there is none.
      x-jantaxi-app: [driver]
      security: [{appToken: []}]
      responses:
        '200':
          description: Active order.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DriverOrderDetail'}
        '204':
          description: No active order.
        '401': {$ref: '#/components/responses/AppUnauthorized'}
        '403': {$ref: '#/components/responses/DriverForbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /driver/orders/history:
    get:
      operationId: listDriverOrderHistory
      tags: [driver-orders]
      summary: My past orders
      description: |
        Orders assigned to the driver in `completed`, `cancelled` or `disputed`, newest first.
        `fields`: `limit` / `before` = `invalid`.
      x-jantaxi-app: [driver]
      security: [{appToken: []}]
      parameters:
        - $ref: '#/components/parameters/CursorLimit'
        - $ref: '#/components/parameters/CursorBefore'
      responses:
        '200':
          description: Page of orders.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DriverOrderSummaryCursorList'}
        '401': {$ref: '#/components/responses/AppUnauthorized'}
        '403': {$ref: '#/components/responses/DriverForbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /driver/orders/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      operationId: getDriverOrder
      tags: [driver-orders]
      summary: Order detail for the driver
      description: |
        The driver's own order (any status), or a `searching` order the driver may accept right
        now (`is_mine: false`, contact data and address details withheld). Anything else is `404`.
      x-jantaxi-app: [driver]
      security: [{appToken: []}]
      responses:
        '200':
          description: Order.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DriverOrderDetail'}
        '401': {$ref: '#/components/responses/AppUnauthorized'}
        '403': {$ref: '#/components/responses/DriverForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /driver/orders/{id}/accept:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      operationId: acceptOrder
      tags: [driver-orders]
      summary: Accept an order
      description: |
        Atomic: exactly one driver wins. In one transaction the driver must be approved
        (`403 driver_not_approved`), online (`409 driver_offline`) and without another active
        order (`409 driver_has_active_order`, with `details.active_order_id` when known); the
        wallet's available balance must cover the commission (`402 insufficient_balance` with
        `details {required, available, currency, topup_min_amount}`); the order must still be
        `searching` with no driver (`409 order_already_taken` once any driver holds it,
        `409 invalid_transition` when it was cancelled without a driver). The driver needs a fresh
        location (`422 location_required`, `details.reason` = `location_required | location_stale`)
        within the order's effective radius of the pickup; orders outside the radius, orders the
        driver's vehicle cannot take (its class does not serve `order.vehicle_class`, fewer seats
        than `passenger_count` or less cargo space than `cargo_volume_l`, ARCHITECTURE §21.4) and
        the driver's own passenger orders are `404`. Accepting an order the driver already
        holds returns `200` unchanged. On success the order's commission (`commission_amount`,
        snapshotted at creation: `commission.fixed_amount` in `fixed` mode) is **charged** in the
        same transaction (ledger `commission_charge`, key `charge:<order_id>`; no reservation;
        never refunded when the passenger cancels, §22.2); the winner's offer is accepted and the
        others lost, the other offered drivers get `order.taken` and their bot offer messages are
        edited to "taken"; the passenger gets the "driver found" push with the driver's photo and
        arrival estimate (`driver_eta_s`, refined from OSRM right after the commit, §22.6). When
        the charge leaves the available balance below the next commission the driver gets one
        `wallet_low_balance` message per day (with a top-up button); drivers in range whose
        available balance is below an order's commission are not offered it and get the same
        message, at most once per day. The city's location policy is not re-checked here.
      x-jantaxi-app: [driver]
      security: [{appToken: []}]
      responses:
        '200':
          description: Updated order.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DriverOrderDetail'}
        '401': {$ref: '#/components/responses/AppUnauthorized'}
        '403': {$ref: '#/components/responses/DriverActionForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '402': {$ref: '#/components/responses/InsufficientBalance'}
        '409': {$ref: '#/components/responses/AcceptConflict'}
        '422':
          description: '`location_required` with `details {reason: location_required | location_stale, max_age_s}`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /driver/orders/{id}/arriving:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      operationId: markDriverArriving
      tags: [driver-orders]
      summary: Driver is arriving
      description: |
        `accepted` → `driver_arriving`; notifies the passenger. Only the assigned, approved driver
        (`404` for other orders); `409 invalid_transition` with `details {from, action: arrive}`
        from any other status.
      x-jantaxi-app: [driver]
      security: [{appToken: []}]
      responses:
        '200':
          description: Updated order.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DriverOrderDetail'}
        '401': {$ref: '#/components/responses/AppUnauthorized'}
        '403': {$ref: '#/components/responses/DriverActionForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/InvalidTransition'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /driver/orders/{id}/start:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      operationId: startTrip
      tags: [driver-orders]
      summary: Start the trip
      description: |
        `accepted` or `driver_arriving` → `in_progress`; marks the pickup completed and notifies
        the passenger. `409 invalid_transition` with `details {from, action: start}` otherwise.
      x-jantaxi-app: [driver]
      security: [{appToken: []}]
      responses:
        '200':
          description: Updated order.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DriverOrderDetail'}
        '401': {$ref: '#/components/responses/AppUnauthorized'}
        '403': {$ref: '#/components/responses/DriverActionForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/InvalidTransition'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /driver/orders/{id}/stops/{stopId}/complete:
    parameters:
      - $ref: '#/components/parameters/IdPath'
      - $ref: '#/components/parameters/StopIdPath'
    post:
      operationId: completeOrderStop
      tags: [driver-orders]
      summary: Mark an intermediate stop reached
      description: |
        Only while `in_progress`, only `intermediate` stops, strictly in `seq` order
        (`409 invalid_transition` with `details {from, action: complete_stop}`, plus
        `next_stop_id` when another stop is due first; the destination is completed by
        `complete`). An unknown stop id is `404`. Idempotent for an already completed stop.
        Does not change `version`.
      x-jantaxi-app: [driver]
      security: [{appToken: []}]
      responses:
        '200':
          description: Updated order.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DriverOrderDetail'}
        '401': {$ref: '#/components/responses/AppUnauthorized'}
        '403': {$ref: '#/components/responses/DriverActionForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/InvalidTransition'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /driver/orders/{id}/complete:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      operationId: completeOrder
      tags: [driver-orders]
      summary: Complete the trip
      description: |
        `in_progress` → `completed` once every intermediate stop is completed
        (`409 invalid_transition` with `details {from, action: complete, pending_stop_ids}`
        otherwise). Marks the remaining stops completed, increments the driver's trip count and
        notifies both sides. The commission was charged when the driver took the order (§22.2),
        so completion charges nothing; only an order accepted before business rules v2 still holds
        a reservation, which is charged here exactly once (`charge:<order_id>`). Drivers cannot
        cancel (§22.3): there is no driver cancel endpoint; they contact support.
      x-jantaxi-app: [driver]
      security: [{appToken: []}]
      responses:
        '200':
          description: Updated order.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DriverOrderDetail'}
        '401': {$ref: '#/components/responses/AppUnauthorized'}
        '403': {$ref: '#/components/responses/DriverActionForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/InvalidTransition'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  # ------------------------------------------------------------------ wallet
  /driver/wallet:
    get:
      operationId: getWallet
      tags: [wallet]
      summary: My wallet
      description: |
        Balance held for commissions, the part reserved for the active order, and what is
        available (the wallet is created on first access). Requires a driver profile that is
        past `draft` (`403 driver_not_registered` otherwise).
      x-jantaxi-app: [driver]
      security: [{appToken: []}]
      responses:
        '200':
          description: Wallet.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Wallet'}
        '401': {$ref: '#/components/responses/AppUnauthorized'}
        '403': {$ref: '#/components/responses/WalletForbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /driver/wallet/transactions:
    get:
      operationId: listWalletTransactions
      tags: [wallet]
      summary: My ledger entries
      description: |
        Newest first. The cursor is the ledger entry id (`next_cursor` is a decimal string);
        `fields.limit` / `fields.before` = `invalid`.
      x-jantaxi-app: [driver]
      security: [{appToken: []}]
      parameters:
        - $ref: '#/components/parameters/CursorLimit'
        - $ref: '#/components/parameters/CursorBefore'
      responses:
        '200':
          description: Page of ledger entries, newest first.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LedgerEntryCursorList'}
        '401': {$ref: '#/components/responses/AppUnauthorized'}
        '403': {$ref: '#/components/responses/WalletForbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  # ------------------------------------------------------------------ topups
  /driver/wallet/topups:
    post:
      operationId: createTopUp
      tags: [topups]
      summary: Start a top-up
      description: |
        Creates a top-up in `created` with a unique reference (`EMB001-TOPUP-000123`), an expiry
        (`topup.expiry_hours`) and Kaspi payment instructions in the driver's language. Nothing is
        credited until a finance admin verifies the payment.
        Idempotent by `idempotency_key`: a replay with the same amount returns `200` with the
        original top-up; the same key with another amount is `409 conflict` with
        `details {reason: idempotency_key_reused, topup_id}`.
        Other errors: `403 forbidden` with `details.reason = driver_rejected` (only `pending`,
        `approved`, `changes_requested` and `suspended` drivers may top up);
        `422 validation_failed` with `fields.amount` = `required | too_small | too_large`
        (`details {min, max}` for the range) or `fields.idempotency_key` = `required | invalid`;
        `409 conflict` with `details.reason` = `payment_not_configured` (no Kaspi link and no
        recipient configured) or `too_many_open_topups` (`details.limit` = 5 open top-ups).
      x-jantaxi-app: [driver]
      security: [{appToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TopUpCreateRequest'}
      responses:
        '201':
          description: Top-up created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TopUp'}
        '200':
          description: Idempotent replay.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TopUp'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/AppUnauthorized'}
        '403': {$ref: '#/components/responses/WalletForbidden'}
        '409':
          description: '`conflict` with `details.reason` = `idempotency_key_reused`, `payment_not_configured` or `too_many_open_topups`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                keyReused:
                  value: {error: {code: conflict, message: idempotency key already used with different parameters, details: {reason: idempotency_key_reused, topup_id: 8e9f0a1b-2c3d-4e4f-9a5b-6c7d8e9f0a1b}}}
                tooMany:
                  value: {error: {code: conflict, message: too many open top-ups, details: {reason: too_many_open_topups, limit: 5}}}
                notConfigured:
                  value: {error: {code: conflict, message: payment details are not configured, details: {reason: payment_not_configured}}}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
    get:
      operationId: listTopUps
      tags: [topups]
      summary: My top-ups
      description: |
        Newest first. The cursor is the top-up number (`next_cursor` is a decimal string);
        `fields.limit` / `fields.before` = `invalid`.
      x-jantaxi-app: [driver]
      security: [{appToken: []}]
      parameters:
        - $ref: '#/components/parameters/CursorLimit'
        - $ref: '#/components/parameters/CursorBefore'
      responses:
        '200':
          description: Page of top-ups, newest first.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TopUpCursorList'}
        '401': {$ref: '#/components/responses/AppUnauthorized'}
        '403': {$ref: '#/components/responses/WalletForbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /driver/wallet/topups/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      operationId: getTopUp
      tags: [topups]
      summary: Top-up detail
      description: The caller's own top-ups only (`404` otherwise).
      x-jantaxi-app: [driver]
      security: [{appToken: []}]
      responses:
        '200':
          description: Top-up.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TopUp'}
        '401': {$ref: '#/components/responses/AppUnauthorized'}
        '403': {$ref: '#/components/responses/WalletForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /driver/wallet/topups/{id}/receipt:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      operationId: uploadTopUpReceipt
      tags: [topups]
      summary: Attach a payment receipt (Kaspi PDF or image)
      description: |
        Allowed while `created` or `pending_verification` (`409 invalid_transition` with
        `action: upload_receipt` otherwise). The first form part named `file` is used; other parts
        are ignored (`fields.file = required` when there is none). The file type is sniffed.

        * **Kaspi receipt PDF** (shared from the Kaspi app): stored byte for byte in private
          storage, parsed (receipt number "№ чека", amount, date-time, seller BIN/name, masked
          payer) and checked (ARCHITECTURE §6.1). When every check passes the wallet is credited at
          once through the same path as an admin confirmation (`status: confirmed`,
          `receipt.decision: auto_confirmed`). Otherwise the top-up becomes `pending_verification`
          with `receipt.reasons`. A receipt used before (same file, receipt number or QR payload)
          rejects this top-up (`409 receipt_already_used`, top-up `rejected` with
          `rejected_reason: duplicate_receipt`, the driver is notified). Re-sending the receipt the
          top-up already has is a no-op. Encrypted PDFs and PDFs with scripts, attachments or form
          submission are refused (`422 pdf_not_allowed`).
        * **Image** (JPEG, PNG, WebP): evidence for the finance review only; never credits
          (`receipt.kind: image`). Same image rules as registration uploads.
      x-jantaxi-app: [driver]
      security: [{appToken: []}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {$ref: '#/components/schemas/ReceiptUpload'}
            encoding:
              file:
                contentType: application/pdf, image/jpeg, image/png, image/webp
      responses:
        '200':
          description: 'Top-up with `has_receipt: true` and the `receipt` check (`status: confirmed` when credited).'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TopUp'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/AppUnauthorized'}
        '403': {$ref: '#/components/responses/WalletForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/ReceiptConflict'}
        '413': {$ref: '#/components/responses/FileTooLarge'}
        '415':
          description: '`unsupported_media_type`: not `multipart/form-data`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              example: {error: {code: unsupported_media_type, message: expected multipart/form-data}}
        '422': {$ref: '#/components/responses/UnprocessableReceipt'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /driver/wallet/topups/{id}/submit:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      operationId: submitTopUp
      tags: [topups]
      summary: I have paid
      description: |
        `created` → `pending_verification`; finance admins are notified. A repeated call on a
        `pending_verification` top-up is a no-op returning `200`; other statuses are
        `409 invalid_transition` with `action: submit`. The body is optional
        (`fields.payment_reference` = `too_long | invalid` (≤100), `fields.note` =
        `too_long | invalid` (≤300)). This never credits the wallet: credit happens only when an
        admin confirms the payment against Kaspi merchant records.
      x-jantaxi-app: [driver]
      security: [{appToken: []}]
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TopUpSubmitRequest'}
      responses:
        '200':
          description: Top-up awaiting verification.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TopUp'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/AppUnauthorized'}
        '403': {$ref: '#/components/responses/WalletForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/InvalidTransition'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /driver/wallet/topups/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      operationId: cancelTopUp
      tags: [topups]
      summary: Cancel an unpaid top-up
      description: |
        Only while `created` (`409 invalid_transition` with `action: cancel` otherwise). The
        top-up is closed with status `expired` (the top-up state machine has no separate
        cancelled state); its history records the driver as the actor with the note
        `cancelled_by_driver`. No request body is read.
      x-jantaxi-app: [driver]
      security: [{appToken: []}]
      responses:
        '200':
          description: Closed top-up.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TopUp'}
        '401': {$ref: '#/components/responses/AppUnauthorized'}
        '403': {$ref: '#/components/responses/WalletForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/InvalidTransition'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  # ---------------------------------------------------------------- payments
  /payments/webhooks/{provider}:
    parameters:
      - name: provider
        in: path
        required: true
        description: Payment provider id.
        schema: {type: string, pattern: '^[a-z0-9_]{1,32}$'}
        example: kaspi_manual
    post:
      operationId: receivePaymentWebhook
      tags: [payments]
      summary: Payment provider callback
      description: |
        Reserved for a provider with verifiable callbacks. Returns `404 not_found` for every
        provider until such a provider is configured (`kaspi_manual` has none). A configured
        provider authenticates the request by its own signature scheme (`401 unauthorized`
        when verification fails; body ≤ 64 KiB). A verified callback is only recorded as an
        unlinked payment transaction (idempotent by provider transaction id); nothing is ever
        credited automatically — a finance admin still confirms the top-up.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: Provider-specific payload.
      responses:
        '200':
          description: Accepted.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebhookAck'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401':
          description: '`unauthorized`: the provider signature did not verify.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              example: {error: {code: unauthorized, message: authentication required}}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  # -------------------------------------------------------------- admin-auth
  /admin/auth/login:
    post:
      operationId: adminLogin
      tags: [admin-auth]
      summary: Sign in
      description: |
        Email (trimmed, lower-cased) + password (argon2id). Sets the `jt_admin` session cookie
        (`HttpOnly; SameSite=Strict; Path=/api`, `Secure` when `ADMIN_COOKIE_SECURE`; 12h idle /
        7d absolute) and returns the CSRF token to send as `X-CSRF-Token` on every non-GET admin
        request. Wrong e-mail, wrong password and inactive accounts all return
        `401 invalid_credentials`. The fifth consecutive wrong password locks the account for
        15 minutes: that attempt and every attempt during the lock (even with the right password)
        return `423 account_locked` with `details.locked_until`. Rate limited per IP (20/min,
        burst 10) and per e-mail (10/min, burst 10), plus the login-path limit (30/min, burst 10);
        all answer `429 too_many_requests` with `Retry-After: 60`. Audit-logged.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminLoginRequest'}
      responses:
        '200':
          description: Signed in.
          headers:
            Set-Cookie:
              description: '`jt_admin=<token>; Path=/api; Expires=…; Max-Age=…; HttpOnly; Secure; SameSite=Strict`'
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminSession'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401':
          description: '`invalid_credentials`: unknown e-mail, wrong password or inactive account.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              example: {error: {code: invalid_credentials, message: invalid e-mail or password}}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422':
          description: '`validation_failed`: `fields.email` / `fields.password` = `required`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              example: {error: {code: validation_failed, message: validation failed, fields: {password: required}}}
        '423':
          description: '`account_locked` after five failed attempts; `details.locked_until` (RFC 3339).'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              example:
                error:
                  code: account_locked
                  message: too many failed sign-in attempts
                  details: {locked_until: '2026-10-16T09:45:00Z'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /admin/auth/logout:
    post:
      operationId: adminLogout
      tags: [admin-auth]
      summary: Sign out
      description: |
        Revokes the current session and clears the cookie (`Max-Age=-1`). Mounted without the
        session middleware: with no valid session it only clears the cookie and still answers
        `204`. With a valid session the `X-CSRF-Token` header is required (`403 csrf_failed`).
        Audit-logged.
      security: [{adminSession: [], csrfHeader: []}, {}]
      responses:
        '204':
          description: Signed out (or there was no valid session).
          headers:
            Set-Cookie:
              description: '`jt_admin=; Path=/api; Max-Age=0; HttpOnly; SameSite=Strict`'
              schema: {type: string}
        '403': {$ref: '#/components/responses/CsrfFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /admin/auth/me:
    get:
      operationId: getAdminMe
      tags: [admin-auth]
      summary: Current admin session
      description: |
        The signed-in admin, permissions, the CSRF token for this session (lets the SPA recover
        after a reload) and the session's absolute expiry. Any active admin may call it.
      security: [{adminSession: []}]
      responses:
        '200':
          description: Session.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminSession'}
        '401': {$ref: '#/components/responses/AdminUnauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /admin/auth/password:
    post:
      operationId: changeAdminPassword
      tags: [admin-auth]
      summary: Change my password
      description: |
        Requires the current password (`422` with `fields.current_password = required | invalid`).
        The new password must be 12..256 characters (at most 1024 bytes), not blank and different
        from the current one (`fields.new_password = required | invalid | too_short | too_long |
        same_as_current`). Other sessions of this admin are revoked. Limited to 10 changes per
        minute per admin (burst 5; `429` without `Retry-After`). Audit-logged.
      security: [{adminSession: [], csrfHeader: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminPasswordChangeRequest'}
      responses:
        '204':
          description: Changed.
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/AdminUnauthorized'}
        '403': {$ref: '#/components/responses/CsrfFailed'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  # ------------------------------------------------------------ admin-admins
  /admin/admins:
    get:
      operationId: adminListAdmins
      tags: [admin-admins]
      summary: List admins
      description: All administrators, oldest first.
      x-jantaxi-permission: admins.manage
      security: [{adminSession: []}]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Page of admins.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminUserPage'}
        '401': {$ref: '#/components/responses/AdminUnauthorized'}
        '403': {$ref: '#/components/responses/AdminForbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
    post:
      operationId: adminCreateAdmin
      tags: [admin-admins]
      summary: Create an admin
      description: |
        The e-mail is trimmed and lower-cased and must be unique (`409 email_taken`).
        `fields`: `email` = `required | too_long | invalid`, `full_name` = `required | too_long`,
        `role` = `invalid`, `password` = `required | invalid | too_short | too_long`.
        Audit-logged.
      x-jantaxi-permission: admins.manage
      security: [{adminSession: [], csrfHeader: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminCreateRequest'}
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminUser'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/AdminUnauthorized'}
        '403': {$ref: '#/components/responses/AdminForbidden'}
        '409':
          description: '`email_taken`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              example: {error: {code: email_taken, message: an administrator with this e-mail already exists}}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /admin/admins/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    patch:
      operationId: adminUpdateAdmin
      tags: [admin-admins]
      summary: Update an admin
      description: |
        Change name, role, active flag or reset the password; an empty object is
        `400 bad_request`. The e-mail cannot be changed. Deactivating or resetting the password
        revokes that admin's sessions (except the caller's current one). An admin cannot
        deactivate or demote themselves (`409 cannot_modify_self`), and the last active
        `super_admin` cannot be deactivated or demoted (`409 last_super_admin`). Audit-logged.
      x-jantaxi-permission: admins.manage
      security: [{adminSession: [], csrfHeader: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminUpdateRequest'}
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminUser'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/AdminUnauthorized'}
        '403': {$ref: '#/components/responses/AdminForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: '`cannot_modify_self` or `last_super_admin`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                self:
                  value: {error: {code: cannot_modify_self, message: you cannot deactivate yourself or change your own role}}
                lastSuperAdmin:
                  value: {error: {code: last_super_admin, message: at least one active super admin must remain}}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  # --------------------------------------------------------- admin-dashboard
  /admin/dashboard:
    get:
      operationId: adminGetDashboard
      tags: [admin-dashboard]
      summary: Dashboard metrics
      description: |
        Metrics for `[from, to)` in the city's time zone (`city_id`), or Asia/Aqtobe without a
        city. Without bounds the period is the current local day; with only `from` it ends at the
        end of today; with only `to` it is the one day ending at `to`. At most 92 days
        (`fields.to = too_large` with `details.max_days`). Point-in-time counters (`*_now`,
        wallets, notifications, cities, `today`) ignore the period. Read from one consistent
        snapshot. `fields`: `city_id` = `invalid` (also for an unknown city), `from` / `to` =
        `invalid`.
      x-jantaxi-permission: dashboard.view
      security: [{adminSession: []}]
      parameters:
        - name: from
          in: query
          description: Period start, inclusive — RFC 3339, or a `YYYY-MM-DD` day start in the period's time zone.
          schema: {type: string}
          example: '2026-10-01'
        - name: to
          in: query
          description: Period end, exclusive — RFC 3339, or a `YYYY-MM-DD` day (the whole day is included).
          schema: {type: string}
          example: '2026-10-31'
        - $ref: '#/components/parameters/CityIdQuery'
      responses:
        '200':
          description: Metrics.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DashboardMetrics'}
        '401': {$ref: '#/components/responses/AdminUnauthorized'}
        '403': {$ref: '#/components/responses/AdminForbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  # ----------------------------------------------------------- admin-reports
  /admin/reports/orders.csv:
    get:
      operationId: adminExportOrdersCsv
      tags: [admin-reports]
      summary: Export orders as CSV
      description: |
        One row per non-draft order created in `[from, to)`. Columns: `number, id, created_at,
        city, locality, category, status, fare, commission, currency, payment_method, distance_m,
        duration_s, stops, pickup_address, destination_address, driver_code, accepted_at,
        started_at, completed_at, cancelled_at, cancelled_by, cancel_reason` (`city` is the
        tariff region code, `locality` the settlement of the pickup, empty when unknown).
        Defaults to the last 30 local days; at most 366 days (`fields.to = too_large` with
        `details.max_days`). UTF-8 with BOM, CRLF line ends (RFC 4180), streamed; text cells
        starting with `=`, `+`, `-`, `@`, tab or CR are prefixed with `'` against formula
        injection. Times are local (the city's zone with `city_id`, else Asia/Aqtobe). Audit-logged (`report.export`) before streaming.
        `fields`: `city_id` / `status` / `from` / `to` = `invalid`.
      x-jantaxi-permission: reports.export
      security: [{adminSession: []}]
      parameters:
        - name: from
          in: query
          description: Period start, inclusive — RFC 3339, or a `YYYY-MM-DD` day start in the period's time zone.
          schema: {type: string}
          example: '2026-10-01'
        - name: to
          in: query
          description: Period end, exclusive — RFC 3339, or a `YYYY-MM-DD` day (the whole day is included).
          schema: {type: string}
          example: '2026-10-31'
        - $ref: '#/components/parameters/CityIdQuery'
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/OrderStatus'}
      responses:
        '200': {$ref: '#/components/responses/CsvFile'}
        '401': {$ref: '#/components/responses/AdminUnauthorized'}
        '403': {$ref: '#/components/responses/AdminForbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /admin/reports/ledger.csv:
    get:
      operationId: adminExportLedgerCsv
      tags: [admin-reports]
      summary: Export the wallet ledger as CSV
      description: |
        One row per ledger entry created in `[from, to)`. Columns: `id, created_at, driver_code,
        entry_type, balance_delta, reserved_delta, balance_after, reserved_after, currency,
        order_number, topup_reference, admin_email, idempotency_key, description`.
        Defaults to the last 30 local days; at most 366 days (`fields.to = too_large` with
        `details.max_days`). UTF-8 with BOM, CRLF line ends (RFC 4180), streamed; text cells
        starting with `=`, `+`, `-`, `@`, tab or CR are prefixed with `'` against formula
        injection. Times are local (Asia/Aqtobe). Audit-logged (`report.export`) before streaming.
        `fields`: `driver_id` / `type` / `from` / `to` = `invalid`.
      x-jantaxi-permission: reports.export
      security: [{adminSession: []}]
      parameters:
        - name: from
          in: query
          description: Period start, inclusive — RFC 3339, or a `YYYY-MM-DD` day start in the period's time zone.
          schema: {type: string}
          example: '2026-10-01'
        - name: to
          in: query
          description: Period end, exclusive — RFC 3339, or a `YYYY-MM-DD` day (the whole day is included).
          schema: {type: string}
          example: '2026-10-31'
        - $ref: '#/components/parameters/DriverIdQuery'
        - name: type
          in: query
          schema: {$ref: '#/components/schemas/LedgerEntryType'}
      responses:
        '200': {$ref: '#/components/responses/CsvFile'}
        '401': {$ref: '#/components/responses/AdminUnauthorized'}
        '403': {$ref: '#/components/responses/AdminForbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /admin/reports/topups.csv:
    get:
      operationId: adminExportTopUpsCsv
      tags: [admin-reports]
      summary: Export top-ups as CSV
      description: |
        One row per top-up created in `[from, to)`. Columns: `number, reference, created_at,
        driver_code, status, provider, requested_amount, verified_amount, currency,
        provider_transaction_id, paid_at, driver_payment_reference, driver_reported_paid_at,
        confirmed_at, confirmed_by, rejected_at, reject_reason, refunded_at, refund_reason,
        expires_at`.
        Defaults to the last 30 local days; at most 366 days (`fields.to = too_large` with
        `details.max_days`). UTF-8 with BOM, CRLF line ends (RFC 4180), streamed; text cells
        starting with `=`, `+`, `-`, `@`, tab or CR are prefixed with `'` against formula
        injection. Times are local (Asia/Aqtobe). Audit-logged (`report.export`) before streaming.
        `fields`: `status` / `from` / `to` = `invalid`.
      x-jantaxi-permission: reports.export
      security: [{adminSession: []}]
      parameters:
        - name: from
          in: query
          description: Period start, inclusive — RFC 3339, or a `YYYY-MM-DD` day start in the period's time zone.
          schema: {type: string}
          example: '2026-10-01'
        - name: to
          in: query
          description: Period end, exclusive — RFC 3339, or a `YYYY-MM-DD` day (the whole day is included).
          schema: {type: string}
          example: '2026-10-31'
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/TopUpStatus'}
      responses:
        '200': {$ref: '#/components/responses/CsvFile'}
        '401': {$ref: '#/components/responses/AdminUnauthorized'}
        '403': {$ref: '#/components/responses/AdminForbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  # ------------------------------------------------------------ admin-orders
  /admin/orders:
    get:
      operationId: adminListOrders
      tags: [admin-orders]
      summary: Search orders
      description: |
        Newest first. `q` (≤100 characters) matches the order number (`1042` or `#1042`), the order
        id, a passenger, recipient or driver phone in any Kazakhstan spelling, a driver code, or
        part of the pickup `locality` (case-insensitive, e.g. `алма` finds Алматы).
        `from`/`to` filter `created_at` (RFC 3339 only; `to` exclusive).
        `fields`: `status` / `category` / `city_id` / `driver_id` / `from` / `to` / `page` /
        `page_size` = `invalid`, `q` = `too_long`.
      x-jantaxi-permission: orders.view
      security: [{adminSession: []}]
      parameters:
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/OrderStatus'}
        - $ref: '#/components/parameters/CityIdQuery'
        - name: category
          in: query
          schema: {$ref: '#/components/schemas/OrderCategory'}
        - $ref: '#/components/parameters/DriverIdQuery'
        - name: from
          in: query
          description: '`created_at` lower bound, inclusive (RFC 3339).'
          schema: {type: string, format: date-time}
        - name: to
          in: query
          description: '`created_at` upper bound, exclusive (RFC 3339).'
          schema: {type: string, format: date-time}
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Page of orders.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminOrderPage'}
        '401': {$ref: '#/components/responses/AdminUnauthorized'}
        '403': {$ref: '#/components/responses/AdminForbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /admin/orders/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      operationId: adminGetOrder
      tags: [admin-orders]
      summary: Order detail
      description: Full order including passenger, driver, offers, status events, commission reservation, the order's ledger rows and the latest dispute.
      x-jantaxi-permission: orders.view
      security: [{adminSession: []}]
      responses:
        '200':
          description: Order.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminOrder'}
        '401': {$ref: '#/components/responses/AdminUnauthorized'}
        '403': {$ref: '#/components/responses/AdminForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /admin/orders/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      operationId: adminCancelOrder
      tags: [admin-orders]
      summary: Cancel an order
      description: |
        Allowed from `searching`, `accepted`, `driver_arriving` and `in_progress`
        (`cancelled_by: admin`; `409 invalid_transition` otherwise); both sides are notified.
        The commission the driver paid at acceptance is refunded only with
        `refund_commission: true` (ledger `commission_refund`, once; the driver's message then
        mentions the refund); a reservation left by an acceptance before business rules v2 is
        released. `fields.reason` = `required | too_long | invalid` (1..200 code points).
        Audit-logged (`refund_commission`, `refunded_commission`).
      x-jantaxi-permission: orders.manage
      security: [{adminSession: [], csrfHeader: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminOrderCancelRequest'}
      responses:
        '200':
          description: Cancelled order.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminOrder'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/AdminUnauthorized'}
        '403': {$ref: '#/components/responses/AdminForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/InvalidTransition'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /admin/orders/{id}/assign:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      operationId: adminAssignOrder
      tags: [admin-orders]
      summary: Assign or re-assign a driver
      description: |
        A `searching` order goes through the same checks as `POST /driver/orders/{id}/accept`
        except that the driver need not be online (the response then carries
        `warnings: ["offline"]`). An `accepted` or `driver_arriving` order is re-assigned and
        restarts at `accepted`: the new driver is charged the order's commission (§22.2); the
        previous driver's charge is refunded only with `refund_commission: true` (a legacy
        reservation is released). Errors: `402 insufficient_balance`,
        `403 driver_not_approved` (not approved or blocked), `404` (unknown order),
        `409 driver_has_active_order`, `409 order_already_taken` (a driver accepted the
        searching order meanwhile), `409 invalid_transition` (from `in_progress` or a final
        status), `409 conflict` with `details.reason = already_assigned`, and `422
        validation_failed` with `fields.driver_id` = `required | invalid` (`invalid` also for an
        unknown driver), or
        `fields.driver_id = not_allowed` with `details.reason` = `own_order`, or `vehicle_mismatch`
        when the driver's vehicle cannot take the order (class, seats or cargo space; §21.4 — unlike
        location, this cannot be overridden).
        Audit-logged (`order.assign` / `order.reassign`).
      x-jantaxi-permission: orders.manage
      security: [{adminSession: [], csrfHeader: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminOrderAssignRequest'}
      responses:
        '200':
          description: Assigned order (with `warnings` when the driver is offline).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminOrder'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/AdminUnauthorized'}
        '402': {$ref: '#/components/responses/InsufficientBalance'}
        '403':
          description: '`forbidden` / `csrf_failed` (session), or `driver_not_approved` for the chosen driver.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              example: {error: {code: driver_not_approved, message: driver is not approved}}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: '`order_already_taken`, `driver_has_active_order`, `invalid_transition` or `conflict` (`details.reason = already_assigned`).'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                taken:
                  value: {error: {code: order_already_taken, message: order already taken}}
                active:
                  value: {error: {code: driver_has_active_order, message: driver already has an active order, details: {active_order_id: 0a6f4c4e-6f1b-4b8e-9a52-3c1d2e7f9b10}}}
                assigned:
                  value: {error: {code: conflict, message: order is already assigned to this driver, details: {reason: already_assigned}}}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422':
          description: '`validation_failed` on `driver_id`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              example: {error: {code: validation_failed, message: validation failed, fields: {driver_id: not_allowed}, details: {reason: different_city}}}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /admin/orders/{id}/dispute:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      operationId: adminOpenDispute
      tags: [admin-orders]
      summary: Open a dispute
      description: |
        `in_progress` or `completed` → `disputed` (no 72-hour limit for operators;
        `409 invalid_transition` from other statuses). One open dispute per order
        (`409 conflict` with `details.reason = dispute_open`); a new dispute may be opened after
        the previous one is resolved. `fields.reason` = `required | too_long | invalid`
        (1..500 code points). Audit-logged.
      x-jantaxi-permission: orders.manage
      security: [{adminSession: [], csrfHeader: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminDisputeOpenRequest'}
      responses:
        '200':
          description: Disputed order.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminOrder'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/AdminUnauthorized'}
        '403': {$ref: '#/components/responses/AdminForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: '`invalid_transition` or `conflict` with `details.reason = dispute_open`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              example: {error: {code: conflict, message: order already has an open dispute, details: {reason: dispute_open}}}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  # ---------------------------------------------------------- admin-disputes
  /admin/disputes:
    get:
      operationId: adminListDisputes
      tags: [admin-disputes]
      summary: List disputes
      description: Newest first. `fields.status` / `page` / `page_size` = `invalid`.
      x-jantaxi-permission: orders.view
      security: [{adminSession: []}]
      parameters:
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/DisputeStatus'}
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Page of disputes, newest first.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DisputePage'}
        '401': {$ref: '#/components/responses/AdminUnauthorized'}
        '403': {$ref: '#/components/responses/AdminForbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /admin/disputes/{id}/resolve:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      operationId: adminResolveDispute
      tags: [admin-disputes]
      summary: Resolve a dispute
      description: |
        Moves the order to `completed` or `cancelled`. The commission was charged when the driver
        took the order (§22.2); resolved `cancelled` with `refund_commission: true` → it is
        refunded once (`commission_refund:<order_id>`) and the driver's trip count is reduced
        when the order had been completed. Orders accepted before business rules v2: disputed
        while `in_progress` and resolved `completed` → the reservation is settled; resolved
        `cancelled` → it is released.
        Open disputes only (`409 invalid_transition` with `details {from: resolved, action:
        resolve}`). `fields`: `outcome` = `required | invalid`, `resolution` =
        `required | too_long | invalid` (1..1000 code points), `refund_commission = not_allowed`
        with `outcome: completed`. Audit-logged.
      x-jantaxi-permission: orders.manage
      security: [{adminSession: [], csrfHeader: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DisputeResolveRequest'}
      responses:
        '200':
          description: Resolved dispute.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Dispute'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/AdminUnauthorized'}
        '403': {$ref: '#/components/responses/AdminForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/InvalidTransition'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  # ----------------------------------------------------------- admin-drivers
  /admin/drivers:
    get:
      operationId: adminListDrivers
      tags: [admin-drivers]
      summary: Search drivers
      description: |
        `q` (≤100 characters) matches the driver code prefix, first/last name (either order), a
        phone in any Kazakhstan spelling or a fragment of at least 4 digits, or a plate (Cyrillic
        or Latin, exact when valid, otherwise a fragment of at least 3 characters). Pending
        applications sort oldest submission first when `status=pending`, otherwise newest first.
        `fields`: `status` / `city_id` / `online` / `page` / `page_size` = `invalid`,
        `q` = `too_long`.
      x-jantaxi-permission: drivers.view
      security: [{adminSession: []}]
      parameters:
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/DriverStatus'}
        - $ref: '#/components/parameters/CityIdQuery'
        - name: online
          in: query
          description: Any value accepted by Go `strconv.ParseBool` (`true`, `false`, `1`, `0`, …).
          schema: {type: boolean}
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Page of drivers.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminDriverPage'}
        '401': {$ref: '#/components/responses/AdminUnauthorized'}
        '403': {$ref: '#/components/responses/AdminForbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /admin/drivers/locations:
    get:
      operationId: adminListDriverLocations
      tags: [admin-drivers]
      summary: Live driver map
      description: Last known location of drivers who are online or have an active order (and have a stored location), ordered by driver code. `fields.city_id = invalid`.
      x-jantaxi-permission: drivers.view
      security: [{adminSession: []}]
      parameters:
        - $ref: '#/components/parameters/CityIdQuery'
      responses:
        '200':
          description: Locations.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DriverLocationList'}
        '401': {$ref: '#/components/responses/AdminUnauthorized'}
        '403': {$ref: '#/components/responses/AdminForbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /admin/drivers/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      operationId: adminGetDriver
      tags: [admin-drivers]
      summary: Driver detail
      description: |
        Profile, documents, vehicle and photos, applications, moderation history, wallet, stats
        and last location. ID document references (`documents`) are `null` unless the admin has
        `documents.view`.
      x-jantaxi-permission: drivers.view
      security: [{adminSession: []}]
      responses:
        '200':
          description: Driver.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminDriverDetail'}
        '401': {$ref: '#/components/responses/AdminUnauthorized'}
        '403': {$ref: '#/components/responses/AdminForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
    patch:
      operationId: adminUpdateDriver
      tags: [admin-drivers]
      summary: Move a driver to another city
      description: |
        Sets the driver's city. `fields.city_id` = `required`, `invalid` (malformed or unknown
        city) or `not_allowed` (inactive city). The same city is a no-op. Not allowed while the
        driver has an active order (`409 conflict` with `details.reason = active_order_exists`).
        Audit-logged.
      x-jantaxi-permission: drivers.manage
      security: [{adminSession: [], csrfHeader: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminDriverUpdateRequest'}
      responses:
        '200':
          description: Updated driver.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminDriverDetail'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/AdminUnauthorized'}
        '403': {$ref: '#/components/responses/AdminForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: '`conflict` with `details {reason: active_order_exists, active_order_id}`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              example: {error: {code: conflict, message: the driver has an active order, details: {reason: active_order_exists, active_order_id: 0a6f4c4e-6f1b-4b8e-9a52-3c1d2e7f9b10}}}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /admin/drivers/{id}/orders:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      operationId: adminListDriverOrders
      tags: [admin-drivers]
      summary: Orders of a driver
      description: Orders assigned to the driver profile, newest first. `404` for an unknown driver. `fields.status` / `page` / `page_size` = `invalid`.
      x-jantaxi-permission: drivers.view
      security: [{adminSession: []}]
      parameters:
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/OrderStatus'}
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Page of orders, newest first.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminOrderPage'}
        '401': {$ref: '#/components/responses/AdminUnauthorized'}
        '403': {$ref: '#/components/responses/AdminForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /admin/drivers/{id}/ledger:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      operationId: adminListDriverLedger
      tags: [admin-drivers]
      summary: Ledger of a driver
      description: Newest first; `404` for an unknown driver. Accepts the same filters as `GET /admin/ledger` (`driver_id` is ignored).
      x-jantaxi-permission: finance.view
      security: [{adminSession: []}]
      parameters:
        - name: type
          in: query
          schema: {$ref: '#/components/schemas/LedgerEntryType'}
        - name: from
          in: query
          description: '`created_at` lower bound, inclusive: RFC 3339, or a `YYYY-MM-DD` day start in Asia/Aqtobe.'
          schema: {type: string}
          example: '2026-10-01'
        - name: to
          in: query
          description: '`created_at` upper bound, exclusive: RFC 3339, or a `YYYY-MM-DD` day in Asia/Aqtobe (the whole day is included). Must be after `from`.'
          schema: {type: string}
          example: '2026-10-31'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Page of ledger entries, newest first.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminLedgerPage'}
        '401': {$ref: '#/components/responses/AdminUnauthorized'}
        '403': {$ref: '#/components/responses/AdminForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /admin/drivers/{id}/approve:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      operationId: adminApproveDriver
      tags: [admin-drivers]
      summary: Approve an application
      description: |
        `pending` → `approved` (`409 invalid_transition` with `details {from, action: approve}`
        otherwise). Re-asserts the plate claim and the phone uniqueness (`409 plate_taken`,
        `409 phone_taken`), creates the wallet if missing and notifies the driver. The body is
        optional; `fields.comment` = `too_long | invalid` (≤500). Audit-logged.
      x-jantaxi-permission: drivers.moderate
      security: [{adminSession: [], csrfHeader: []}]
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DriverApproveRequest'}
      responses:
        '200':
          description: Updated driver.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminDriverDetail'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/AdminUnauthorized'}
        '403': {$ref: '#/components/responses/AdminForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: '`invalid_transition`, `plate_taken` or `phone_taken`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              example: {error: {code: invalid_transition, message: transition not allowed, details: {from: approved, action: approve}}}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /admin/drivers/{id}/reject:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      operationId: adminRejectDriver
      tags: [admin-drivers]
      summary: Reject an application
      description: |
        `pending` or `changes_requested` → `rejected` (final; `409 invalid_transition`
        otherwise). Releases the plate and phone claims and notifies the driver with the reason.
        `fields`: `reason` = `required | too_long | invalid` (1..500, shown to the driver),
        `comment` = `too_long | invalid` (≤500, internal). Audit-logged.
      x-jantaxi-permission: drivers.moderate
      security: [{adminSession: [], csrfHeader: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DriverRejectRequest'}
      responses:
        '200':
          description: Updated driver.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminDriverDetail'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/AdminUnauthorized'}
        '403': {$ref: '#/components/responses/AdminForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/InvalidTransition'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /admin/drivers/{id}/request-corrections:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      operationId: adminRequestDriverCorrections
      tags: [admin-drivers]
      summary: Request corrections
      description: |
        `pending` → `changes_requested` with per-field items (`409 invalid_transition`
        otherwise). The driver sees the items in the Mini App (`corrections`), may change only
        the flagged fields, and gets a notification with a `register` deep link.
        `fields`: `items` = `required | too_few | too_many` (1..10),
        `items.N.field` = `required | invalid | duplicate`, `items.N.reason` = `required | invalid`,
        `items.N.comment` = `required` (when the reason is `other`) `| too_long | invalid` (≤200),
        `comment` = `too_long | invalid` (≤500). Audit-logged.
      x-jantaxi-permission: drivers.moderate
      security: [{adminSession: [], csrfHeader: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DriverCorrectionsRequest'}
      responses:
        '200':
          description: Updated driver.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminDriverDetail'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/AdminUnauthorized'}
        '403': {$ref: '#/components/responses/AdminForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/InvalidTransition'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /admin/drivers/{id}/suspend:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      operationId: adminSuspendDriver
      tags: [admin-drivers]
      summary: Suspend a driver
      description: |
        `approved` → `suspended` (`409 invalid_transition` otherwise); the driver goes offline
        immediately. Not allowed while the driver has an active order (`409 conflict` with
        `details {reason: active_order_exists, active_order_id}`; cancel or finish it first).
        `fields.reason` = `required | too_long | invalid` (1..300). Audit-logged.
      x-jantaxi-permission: drivers.manage
      security: [{adminSession: [], csrfHeader: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DriverSuspendRequest'}
      responses:
        '200':
          description: Updated driver.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminDriverDetail'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/AdminUnauthorized'}
        '403': {$ref: '#/components/responses/AdminForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: '`invalid_transition`, or `conflict` with `details.reason = active_order_exists`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              example: {error: {code: conflict, message: the driver has an active order, details: {reason: active_order_exists, active_order_id: 0a6f4c4e-6f1b-4b8e-9a52-3c1d2e7f9b10}}}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /admin/drivers/{id}/restore:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      operationId: adminRestoreDriver
      tags: [admin-drivers]
      summary: Restore a suspended driver
      description: |
        `suspended` → `approved` (`409 invalid_transition` otherwise); the driver stays offline
        until they go online. The body is optional and must be an empty object when sent.
        Audit-logged.
      x-jantaxi-permission: drivers.manage
      security: [{adminSession: [], csrfHeader: []}]
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmptyObject'}
      responses:
        '200':
          description: Updated driver.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminDriverDetail'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/AdminUnauthorized'}
        '403': {$ref: '#/components/responses/AdminForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/InvalidTransition'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /admin/drivers/{id}/bonus:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      operationId: adminGrantDriverBonus
      tags: [admin-ledger]
      summary: Credit a bonus to a driver
      description: |
        The company credits a driver a bonus (ARCHITECTURE §22.7; find the driver with
        `GET /admin/drivers?q=` by code such as `EMB001` or by phone in any format). Ledger
        `bonus_credit` with key `bonus:<idempotency_key>`; audited (`wallet.bonus`); realtime
        `wallet.updated` to the driver and admins; the driver bot sends `driver_bonus_granted`
        (kk «Jan Taxi компаниясынан сізге {amount} бонус есептелді», ru «Компания Jan Taxi
        начислила вам бонус {amount}», en «Jan Taxi has credited you a bonus of {amount}», plus the
        comment when given and a wallet button). Idempotent: a replay with the same key and amount
        returns `200` with the stored entry and sends nothing; the same key with another amount or
        driver is `409 conflict`. `fields`: `amount` = `required | too_small | too_large`
        (1..1000000, `details.max`), `comment` = `too_long | invalid` (≤ 200 code points),
        `idempotency_key` = `required | invalid` (a UUID, optionally prefixed `bonus:`). `404` for
        an unknown driver. The history is on the driver detail (`bonuses`) and in the ledger
        (`type=bonus_credit`).
      x-jantaxi-permission: finance.manage
      security: [{adminSession: [], csrfHeader: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DriverBonusRequest'}
      responses:
        '201':
          description: Bonus credited.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DriverBonusResult'}
        '200':
          description: Idempotent replay.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DriverBonusResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/AdminUnauthorized'}
        '403': {$ref: '#/components/responses/AdminForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: '`conflict`: the idempotency key was already used with different parameters.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /admin/drivers/{id}/wallet/adjustments:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      operationId: adminAdjustDriverWallet
      tags: [admin-ledger]
      summary: Manual wallet adjustment
      description: |
        Signed amount (credit > 0, debit < 0) with a mandatory reason. A debit may not take the
        available balance below zero (`402 insufficient_balance` with `details {required,
        available, currency, topup_min_amount}`). Idempotent by `idempotency_key` (ledger key
        `adjust:<key>`; a replay returns `200` with the stored entry; the same key with different
        parameters is `409 conflict`). `fields`: `amount` = `required | invalid` (zero) `|
        too_small | too_large` (±10000000), `reason` = `required | too_long | invalid` (1..300),
        `idempotency_key` = `required | invalid`. `404` for an unknown driver. Audit-logged.
      x-jantaxi-permission: finance.manage
      security: [{adminSession: [], csrfHeader: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WalletAdjustmentRequest'}
      responses:
        '201':
          description: Adjustment applied.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WalletAdjustmentResult'}
        '200':
          description: Idempotent replay.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WalletAdjustmentResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/AdminUnauthorized'}
        '402': {$ref: '#/components/responses/InsufficientBalance'}
        '403': {$ref: '#/components/responses/AdminForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: '`conflict`: the idempotency key was already used with different parameters.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              example: {error: {code: conflict, message: idempotency key already used with different parameters}}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /admin/files/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      operationId: adminGetFile
      tags: [admin-drivers]
      summary: Download a private file
      description: |
        Any active admin session may call it; the permission depends on the file's purpose:
        ID documents (`id_front`, `id_back`) need `documents.view` and every view is
        audit-logged (`document.view`) before the image is sent; avatars and vehicle photos need
        `drivers.view`; top-up receipts need `finance.view` (`403 forbidden` otherwise).
        Unknown or deleted files are `404`. Usable directly in `<img src>` (cookie session).
      x-jantaxi-permission: documents.view | drivers.view | finance.view (by file purpose)
      security: [{adminSession: []}]
      responses:
        '200': {$ref: '#/components/responses/JpegImage'}
        '401': {$ref: '#/components/responses/AdminUnauthorized'}
        '403': {$ref: '#/components/responses/AdminForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  # ------------------------------------------------------------ admin-topups
  /admin/topups:
    get:
      operationId: adminListTopUps
      tags: [admin-topups]
      summary: Search top-ups
      description: |
        `q` (≤100 characters) matches a reference substring, the exact driver code, the Kaspi
        transaction id (spaces ignored, case-insensitive) or a driver phone in any Kazakhstan
        spelling. Newest first; `status=pending_verification` sorts oldest first. `fields`:
        `status` / `driver_id` / `from` / `to` / `page` / `page_size` = `invalid`, `q` = `too_long`.
      x-jantaxi-permission: finance.view
      security: [{adminSession: []}]
      parameters:
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/TopUpStatus'}
        - $ref: '#/components/parameters/DriverIdQuery'
        - name: from
          in: query
          description: '`created_at` lower bound, inclusive: RFC 3339, or a `YYYY-MM-DD` day start in Asia/Aqtobe.'
          schema: {type: string}
          example: '2026-10-01'
        - name: to
          in: query
          description: '`created_at` upper bound, exclusive: RFC 3339, or a `YYYY-MM-DD` day in Asia/Aqtobe (the whole day is included). Must be after `from`.'
          schema: {type: string}
          example: '2026-10-31'
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Page of top-ups (list items carry no `events`, `payment_transaction` or `duplicate_warnings`).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminTopUpPage'}
        '401': {$ref: '#/components/responses/AdminUnauthorized'}
        '403': {$ref: '#/components/responses/AdminForbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /admin/topups/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      operationId: adminGetTopUp
      tags: [admin-topups]
      summary: Top-up detail
      description: Includes the status history, the recorded payment transaction and duplicate warnings.
      x-jantaxi-permission: finance.view
      security: [{adminSession: []}]
      responses:
        '200':
          description: Top-up.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminTopUpDetail'}
        '401': {$ref: '#/components/responses/AdminUnauthorized'}
        '403': {$ref: '#/components/responses/AdminForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /admin/topups/{id}/receipt:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      operationId: adminGetTopUpReceipt
      tags: [admin-topups]
      summary: Latest receipt file uploaded by the driver
      description: |
        The latest uploaded receipt: the original Kaspi PDF (`application/pdf`, inline) or the
        sanitised JPEG. Older receipts are listed in `AdminTopUpDetail.receipts` and served by
        `GET /admin/files/{file_id}`. `404` when the top-up has no receipt.
      x-jantaxi-permission: finance.view
      security: [{adminSession: []}]
      responses:
        '200': {$ref: '#/components/responses/ReceiptFile'}
        '401': {$ref: '#/components/responses/AdminUnauthorized'}
        '403': {$ref: '#/components/responses/AdminForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /admin/topups/{id}/confirm:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      operationId: adminConfirmTopUp
      tags: [admin-topups]
      summary: Confirm a verified payment
      description: |
        The only way money reaches a wallet. The admin enters the amount and the Kaspi transaction
        / receipt number from trusted merchant records (Kaspi Pay → History). Allowed from
        `pending_verification` or `created` (`409 invalid_transition` with `action: confirm`
        otherwise). The transaction id is normalised (whitespace removed, upper-cased) and
        recorded as a payment transaction (`UNIQUE(provider, provider_transaction_id)` →
        `409 payment_reference_used` with `details {topup_id, reference}` when the holder is
        known); a matching unlinked webhook record is linked when the amounts agree. Credits
        `verified_amount` once (`topup:<topup_id>`), notifies the driver. `fields`:
        `verified_amount` = `required | too_small | too_large` (1..10000000),
        `provider_transaction_id` = `required | too_long | invalid`, `paid_at` = `required |
        invalid` (more than 10 minutes in the future), `payer_info` / `note` =
        `too_long | invalid`. Audit-logged.
      x-jantaxi-permission: finance.manage
      security: [{adminSession: [], csrfHeader: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PaymentConfirmRequest'}
      responses:
        '200':
          description: Updated top-up.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminTopUpDetail'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/AdminUnauthorized'}
        '403': {$ref: '#/components/responses/AdminForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/ConfirmConflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /admin/topups/{id}/reject:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      operationId: adminRejectTopUp
      tags: [admin-topups]
      summary: Reject a top-up
      description: |
        `created` or `pending_verification` → `rejected` (`409 invalid_transition` otherwise); the
        driver is notified with the reason. `fields.reason` = `required | too_long | invalid`
        (1..300). Audit-logged.
      x-jantaxi-permission: finance.manage
      security: [{adminSession: [], csrfHeader: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TopUpRejectRequest'}
      responses:
        '200':
          description: Updated top-up.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminTopUpDetail'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/AdminUnauthorized'}
        '403': {$ref: '#/components/responses/AdminForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/InvalidTransition'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /admin/topups/{id}/refund:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      operationId: adminRefundTopUp
      tags: [admin-topups]
      summary: Refund a confirmed top-up
      description: |
        `confirmed` → `refunded` (`409 invalid_transition` otherwise); debits the credited amount
        once (`topup_refund:<topup_id>`). The available balance must cover it
        (`402 insufficient_balance` with `details {required, available, currency,
        topup_min_amount}`). The money itself is returned outside the system (Kaspi).
        `fields.reason` = `required | too_long | invalid` (1..300). Audit-logged.
      x-jantaxi-permission: finance.manage
      security: [{adminSession: [], csrfHeader: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TopUpRefundRequest'}
      responses:
        '200':
          description: Updated top-up.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminTopUpDetail'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/AdminUnauthorized'}
        '402': {$ref: '#/components/responses/InsufficientBalance'}
        '403': {$ref: '#/components/responses/AdminForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/InvalidTransition'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  # ------------------------------------------------------------ admin-ledger
  /admin/ledger:
    get:
      operationId: adminListLedger
      tags: [admin-ledger]
      summary: Search ledger entries
      description: 'Newest first. `fields`: `driver_id` / `type` / `from` / `to` / `page` / `page_size` = `invalid`.'
      x-jantaxi-permission: finance.view
      security: [{adminSession: []}]
      parameters:
        - $ref: '#/components/parameters/DriverIdQuery'
        - name: type
          in: query
          schema: {$ref: '#/components/schemas/LedgerEntryType'}
        - name: from
          in: query
          description: '`created_at` lower bound, inclusive: RFC 3339, or a `YYYY-MM-DD` day start in Asia/Aqtobe.'
          schema: {type: string}
          example: '2026-10-01'
        - name: to
          in: query
          description: '`created_at` upper bound, exclusive: RFC 3339, or a `YYYY-MM-DD` day in Asia/Aqtobe (the whole day is included). Must be after `from`.'
          schema: {type: string}
          example: '2026-10-31'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Page of ledger entries, newest first.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminLedgerPage'}
        '401': {$ref: '#/components/responses/AdminUnauthorized'}
        '403': {$ref: '#/components/responses/AdminForbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /admin/wallets/reconciliation:
    get:
      operationId: adminReconcileWallets
      tags: [admin-ledger]
      summary: Reconcile wallets with the ledger
      description: |
        Recomputes every wallet from its ledger (`sum(balance_delta)`, `sum(reserved_delta)`),
        compares `reserved` with the active reservations and with the last entry's
        `*_after` values, and lists mismatches; an empty list (`ok: true`) means the books balance.
      x-jantaxi-permission: finance.view
      security: [{adminSession: []}]
      responses:
        '200':
          description: Reconciliation result.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReconciliationResult'}
        '401': {$ref: '#/components/responses/AdminUnauthorized'}
        '403': {$ref: '#/components/responses/AdminForbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  # ------------------------------------------------------------ admin-cities
  /admin/cities:
    get:
      operationId: adminListCities
      tags: [admin-cities]
      summary: List cities
      description: All cities (active and inactive), ordered by code. `fields.page` / `fields.page_size` = `invalid`.
      x-jantaxi-permission: dashboard.view
      security: [{adminSession: []}]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Page of cities.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CityPage'}
        '401': {$ref: '#/components/responses/AdminUnauthorized'}
        '403': {$ref: '#/components/responses/AdminForbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
    post:
      operationId: adminCreateCity
      tags: [admin-cities]
      summary: Create a city
      description: |
        `code` is trimmed and upper-cased and must be unique (`409 city_code_taken`). The centre
        must be inside Kazakhstan (`fields.center = outside_service_area`). Omitted settings get
        the defaults shown in the schema. Tariffs are not created (add them with
        `POST /admin/tariffs`). `fields`: `code` = `required | invalid`, `name` = `required`,
        `name.kk` / `name.ru` / `name.en` = `required | too_long | invalid`, `center` =
        `invalid | outside_service_area`, `default_zoom` / `dispatch_radius_m` /
        `driver_location_max_age_s` / `search_timeout_s` = `out_of_range`, `timezone` =
        `invalid`. Audit-logged.
      x-jantaxi-permission: config.manage
      security: [{adminSession: [], csrfHeader: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CityCreateRequest'}
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/City'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/AdminUnauthorized'}
        '403': {$ref: '#/components/responses/AdminForbidden'}
        '409':
          description: '`city_code_taken`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              example: {error: {code: city_code_taken, message: a city with this code already exists}}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /admin/cities/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    patch:
      operationId: adminUpdateCity
      tags: [admin-cities]
      summary: Update a city
      description: |
        Partial update; the same rules as creation. `code` is immutable: sending a different code
        is `422` with `fields.code = immutable` (the same code is accepted), because driver codes
        derive from it. The nationwide default region (`is_default_region`) cannot be switched
        off: `is_active: false` is `409 default_region_locked`; its other fields stay editable.
        Audit-logged.
      x-jantaxi-permission: config.manage
      security: [{adminSession: [], csrfHeader: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CityUpdateRequest'}
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/City'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/AdminUnauthorized'}
        '403': {$ref: '#/components/responses/AdminForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/DefaultRegionLocked'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /admin/cities/{id}/zones:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      operationId: adminListZones
      tags: [admin-cities]
      summary: Service zones of a city
      description: All zones of the city (not paged), active first, then by name. `404` for an unknown city.
      x-jantaxi-permission: config.manage
      security: [{adminSession: []}]
      responses:
        '200':
          description: Zones.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ZoneList'}
        '401': {$ref: '#/components/responses/AdminUnauthorized'}
        '403': {$ref: '#/components/responses/AdminForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
    post:
      operationId: adminCreateZone
      tags: [admin-cities]
      summary: Add a service zone
      description: |
        GeoJSON `Polygon` or `MultiPolygon` in WGS84 (stored as MultiPolygon, returned with 6
        decimals). `fields.name` = `required | too_long | invalid` (≤120); `fields.geometry` =
        `required | invalid` (malformed, unknown members such as `crs`) `| unsupported_type |
        empty | out_of_range` (coordinates outside ±180/±90) `| too_complex` (more than 20000
        points) `| invalid_geometry` (self-intersecting etc.) `| outside_service_area` (does not
        intersect Kazakhstan). `404` for an unknown city; `409 default_region_locked` for the
        nationwide default region. Audit-logged.
      x-jantaxi-permission: config.manage
      security: [{adminSession: [], csrfHeader: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ZoneCreateRequest'}
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Zone'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/AdminUnauthorized'}
        '403': {$ref: '#/components/responses/AdminForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/DefaultRegionLocked'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /admin/zones/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    patch:
      operationId: adminUpdateZone
      tags: [admin-cities]
      summary: Update a service zone
      description: |
        Partial update with the same name and geometry rules as creation. The zone of the
        nationwide default region cannot be changed (`409 default_region_locked`). Audit-logged.
      x-jantaxi-permission: config.manage
      security: [{adminSession: [], csrfHeader: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ZoneUpdateRequest'}
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Zone'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/AdminUnauthorized'}
        '403': {$ref: '#/components/responses/AdminForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/DefaultRegionLocked'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
    delete:
      operationId: adminDeleteZone
      tags: [admin-cities]
      summary: Delete a service zone
      description: |
        Existing orders keep their city. The zone of the nationwide default region cannot be
        deleted (`409 default_region_locked`). Audit-logged.
      x-jantaxi-permission: config.manage
      security: [{adminSession: [], csrfHeader: []}]
      responses:
        '204':
          description: Deleted.
        '401': {$ref: '#/components/responses/AdminUnauthorized'}
        '403': {$ref: '#/components/responses/AdminForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/DefaultRegionLocked'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /admin/places:
    get:
      operationId: adminListPlaces
      tags: [admin-cities]
      summary: List curated places
      description: |
        Ordered by Kazakh name. `q` (≤120 characters) matches names and aliases
        case-insensitively. `fields`: `city_id` / `page` / `page_size` = `invalid`, `q` = `too_long`.
      x-jantaxi-permission: config.manage
      security: [{adminSession: []}]
      parameters:
        - $ref: '#/components/parameters/CityIdQuery'
        - name: q
          in: query
          description: Name or alias fragment.
          schema: {type: string, maxLength: 120}
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Page of places.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlacePage'}
        '401': {$ref: '#/components/responses/AdminUnauthorized'}
        '403': {$ref: '#/components/responses/AdminForbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
    post:
      operationId: adminCreatePlace
      tags: [admin-cities]
      summary: Add a curated place
      description: |
        Searched before the external geocoder. `fields`: `city_id` = `invalid | not_found`,
        `name` = `required`, `name.kk` / `name.ru` / `name.en` = `required | too_long | invalid`
        (≤120), `aliases` = `too_many` (more than 20) `| required | too_long | invalid |
        duplicate`, `location` = `required | invalid | outside_service_area` (the `lat`/`lon`
        pair, which must be inside Kazakhstan). Audit-logged.
      x-jantaxi-permission: config.manage
      security: [{adminSession: [], csrfHeader: []}]
      requestBody:
        required: true
        content:
          application/json:
