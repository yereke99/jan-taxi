          oneOf:
            - $ref: '#/components/schemas/DriverRef'
            - type: 'null'
        vehicle:
          oneOf:
            - $ref: '#/components/schemas/Vehicle'
            - type: 'null'
        driver_location:
          oneOf:
            - $ref: '#/components/schemas/DriverLocation'
            - type: 'null'
        offers:
          type: array
          description: Dispatch offers, oldest first.
          items: {$ref: '#/components/schemas/OrderOffer'}
        events:
          type: array
          description: Status history, oldest first.
          items: {$ref: '#/components/schemas/AdminOrderEvent'}
        reservation:
          description: Latest commission reservation.
          oneOf:
            - $ref: '#/components/schemas/WalletReservation'
            - type: 'null'
        ledger:
          type: array
          description: Every wallet ledger row of this order (any driver), oldest first.
          items: {$ref: '#/components/schemas/OrderLedgerEntry'}
        dispute:
          description: Latest dispute.
          oneOf:
            - $ref: '#/components/schemas/Dispute'
            - type: 'null'
        rating:
          oneOf:
            - $ref: '#/components/schemas/OrderRating'
            - type: 'null'
        cancel_reason: {type: [string, 'null']}
        cancelled_by:
          oneOf:
            - $ref: '#/components/schemas/ActorType'
            - type: 'null'
        version: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        search_expires_at: {type: [string, 'null'], format: date-time}
        accepted_at: {type: [string, 'null'], format: date-time}
        arrived_at: {type: [string, 'null'], format: date-time}
        started_at: {type: [string, 'null'], format: date-time}
        completed_at: {type: [string, 'null'], format: date-time}
        cancelled_at: {type: [string, 'null'], format: date-time}
        warnings:
          type: array
          description: Only on the assign response; `offline` when the assigned driver was offline. Omitted otherwise.
          items: {type: string, enum: [offline]}
    AdminOrderAssignRequest:
      type: object
      additionalProperties: false
      required: [driver_id]
      properties:
        driver_id: {type: string, format: uuid, description: Driver profile id.}
    AdminOrderCancelRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: {type: string, minLength: 1, maxLength: 200}
    AdminOrderEvent:
      allOf:
        - $ref: '#/components/schemas/OrderEvent'
        - type: object
          required: [id, actor_id, meta]
          properties:
            id: {type: integer, format: int64}
            actor_id: {type: [string, 'null'], format: uuid, description: 'User, driver profile or admin id by `actor_type`.'}
            meta:
              type: object
              additionalProperties: true
    AdminOrderListItem:
      type: object
      required: [id, number, status, category, service_type, city, fare, currency, commission_amount, payment_method, passenger, driver, pickup, destination, stop_count, distance_m, has_open_dispute, created_at, accepted_at, completed_at, cancelled_at, cancelled_by]
      properties:
        id: {type: string, format: uuid}
        number: {type: integer, format: int64, example: 1042}
        status: {$ref: '#/components/schemas/OrderStatus'}
        category: {$ref: '#/components/schemas/OrderCategory'}
        service_type: {$ref: '#/components/schemas/ServiceType'}
        city: {$ref: '#/components/schemas/CityRef'}
        fare: {type: integer, format: int64}
        currency: {$ref: '#/components/schemas/Currency'}
        commission_amount: {type: integer, format: int64}
        payment_method: {$ref: '#/components/schemas/PaymentMethod'}
        passenger: {$ref: '#/components/schemas/AdminPassengerRef'}
        driver:
          oneOf:
            - $ref: '#/components/schemas/DriverRef'
            - type: 'null'
        pickup: {$ref: '#/components/schemas/StopSummary'}
        destination: {$ref: '#/components/schemas/StopSummary'}
        stop_count: {type: integer, minimum: 2, maximum: 5}
        distance_m: {type: integer, minimum: 0}
        has_open_dispute: {type: boolean}
        created_at: {type: string, format: date-time}
        accepted_at: {type: [string, 'null'], format: date-time}
        completed_at: {type: [string, 'null'], format: date-time}
        cancelled_at: {type: [string, 'null'], format: date-time}
        cancelled_by:
          oneOf:
            - $ref: '#/components/schemas/ActorType'
            - type: 'null'
    AdminOrderPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: {$ref: '#/components/schemas/AdminOrderListItem'}
    AdminPassengerRef:
      type: object
      required: [id, telegram_user_id, first_name, last_name, username, phone, is_blocked]
      properties:
        id: {type: string, format: uuid}
        telegram_user_id: {type: integer, format: int64, example: 784512369}
        first_name: {type: string, example: Айгүл}
        last_name: {type: string, example: Серікқызы}
        username: {type: [string, 'null']}
        phone: {type: [string, 'null'], description: Full E.164 phone when known.}
        is_blocked: {type: boolean}
    AdminPasswordChangeRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password: {type: string, minLength: 1, writeOnly: true}
        new_password: {type: string, minLength: 12, maxLength: 256, writeOnly: true, description: 12..256 characters, at most 1024 bytes, different from the current one.}
    AdminPermission:
      type: string
      enum: [dashboard.view, orders.view, orders.manage, drivers.view, drivers.moderate, drivers.manage, documents.view, finance.view, finance.manage, config.manage, admins.manage, audit.view, reports.export]
    AdminRef:
      type: object
      required: [id, email, full_name]
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        full_name: {type: string}
    AdminRole:
      type: string
      description: |
        | Role | Permissions |
        |---|---|
        | `super_admin` | all |
        | `operator` | dashboard.view, orders.view, orders.manage, drivers.view, drivers.manage, audit.view, reports.export |
        | `driver_moderator` | dashboard.view, orders.view, drivers.view, drivers.moderate, drivers.manage, documents.view |
        | `finance_manager` | dashboard.view, orders.view, drivers.view, finance.view, finance.manage, audit.view, reports.export |
        | `auditor` | dashboard.view, orders.view, drivers.view, finance.view, audit.view, reports.export |
      enum: [super_admin, operator, driver_moderator, finance_manager, auditor]
    AdminSession:
      type: object
      required: [admin, csrf_token, expires_at]
      properties:
        admin: {$ref: '#/components/schemas/AdminSessionUser'}
        csrf_token:
          type: string
          description: Send as `X-CSRF-Token` on every non-GET admin request.
        expires_at:
          type: string
          format: date-time
          description: Absolute session expiry (7 days after sign-in); the session also ends after 12 hours idle.
    AdminSessionUser:
      type: object
      description: The signed-in administrator as returned by the session endpoints.
      required: [id, email, full_name, role, permissions]
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email, example: operator@jantaxi.kz}
        full_name: {type: string, example: Динара Әлібекова}
        role: {$ref: '#/components/schemas/AdminRole'}
        permissions:
          type: array
          items: {$ref: '#/components/schemas/AdminPermission'}
    AdminTopUp:
      type: object
      required: [id, number, reference, status, provider, amount, verified_amount, currency, driver, payment_url, driver_payment_reference, driver_note, has_receipt, receipt_url, driver_reported_paid_at, provider_transaction_id, paid_at, confirmed_by, confirmed_at, rejected_by, rejected_at, rejected_reason, refunded_by, refunded_at, refund_reason, expires_at, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        number: {type: integer, format: int64}
        reference: {type: string, example: EMB001-TOPUP-000123}
        status: {$ref: '#/components/schemas/TopUpStatus'}
        provider: {$ref: '#/components/schemas/PaymentProvider'}
        amount: {type: integer, format: int64, description: Requested amount.}
        verified_amount: {type: [integer, 'null'], format: int64, description: Credited amount.}
        currency: {$ref: '#/components/schemas/Currency'}
        driver: {$ref: '#/components/schemas/DriverRef'}
        payment_url: {type: [string, 'null'], description: Kaspi link stored when the top-up was created.}
        driver_payment_reference: {type: [string, 'null']}
        driver_note: {type: [string, 'null']}
        has_receipt: {type: boolean}
        receipt_url: {type: [string, 'null'], description: '`/api/v1/admin/topups/{id}/receipt` when a receipt exists.'}
        driver_reported_paid_at: {type: [string, 'null'], format: date-time}
        provider_transaction_id: {type: [string, 'null'], description: Normalised Kaspi transaction / receipt number.}
        paid_at: {type: [string, 'null'], format: date-time}
        confirmed_by:
          oneOf:
            - $ref: '#/components/schemas/AdminRef'
            - type: 'null'
        confirmed_at: {type: [string, 'null'], format: date-time}
        rejected_by:
          oneOf:
            - $ref: '#/components/schemas/AdminRef'
            - type: 'null'
        rejected_at: {type: [string, 'null'], format: date-time}
        rejected_reason: {type: [string, 'null']}
        refunded_by:
          oneOf:
            - $ref: '#/components/schemas/AdminRef'
            - type: 'null'
        refunded_at: {type: [string, 'null'], format: date-time}
        refund_reason: {type: [string, 'null']}
        expires_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    AdminTopUpDetail:
      description: Top-up detail for finance (`GET /admin/topups/{id}` and the confirm / reject / refund responses).
      allOf:
        - $ref: '#/components/schemas/AdminTopUp'
        - type: object
          required: [events, payment_transaction, duplicate_warnings]
          properties:
            events:
              type: array
              description: Status history, oldest first (receipt uploads appear with `from_status = to_status`).
              items: {$ref: '#/components/schemas/TopUpEvent'}
            payment_transaction:
              description: Recorded payment, once confirmed.
              oneOf:
                - $ref: '#/components/schemas/PaymentTransaction'
                - type: 'null'
            duplicate_warnings:
              type: array
              description: Possible double payments to check before confirming (empty when none).
              items: {$ref: '#/components/schemas/DuplicateWarning'}
    AdminTopUpPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: {$ref: '#/components/schemas/AdminTopUp'}
    AdminUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        full_name: {type: string, minLength: 1, maxLength: 120}
        role: {$ref: '#/components/schemas/AdminRole'}
        is_active: {type: boolean}
        password: {type: string, minLength: 12, maxLength: 256, writeOnly: true, description: Password reset (12..256 characters).}
    AdminUser:
      type: object
      required: [id, email, full_name, role, permissions, is_active, last_login_at, locked_until, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email, example: operator@jantaxi.kz}
        full_name: {type: string, example: Динара Әлібекова}
        role: {$ref: '#/components/schemas/AdminRole'}
        permissions:
          type: array
          items: {$ref: '#/components/schemas/AdminPermission'}
        is_active: {type: boolean}
        last_login_at: {type: [string, 'null'], format: date-time}
        locked_until: {type: [string, 'null'], format: date-time, description: Set while (or after) a sign-in lock.}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    AdminUserPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: {$ref: '#/components/schemas/AdminUser'}
    AppTokenResponse:
      type: object
      required: [token, expires_at, user_id]
      properties:
        token:
          type: string
          description: 'Opaque app token; send as `Authorization: Bearer <token>`. Never log it.'
          example: eyJ2IjoxLCJ1aWQiOiIuLi4ifQ.c2lnbmF0dXJl
        expires_at: {type: string, format: date-time, example: '2026-10-16T21:30:00Z'}
        user_id: {type: string, format: uuid, description: The signed-in user (`users.id`).}
    AuditLog:
      type: object
      required: [id, admin_id, admin_email, admin_name, action, entity_type, entity_id, before, after, ip, user_agent, created_at]
      properties:
        id: {type: integer, format: int64}
        admin_id: {type: [string, 'null'], format: uuid, description: '`null` for system actions.'}
        admin_email: {type: [string, 'null']}
        admin_name: {type: [string, 'null']}
        action: {type: string, example: driver.approve}
        entity_type: {type: string, example: driver}
        entity_id: {type: [string, 'null']}
        before: {description: State before the change (secrets redacted); `null` when not recorded.}
        after: {description: State after the change (secrets redacted); `null` when not recorded.}
        ip: {type: [string, 'null']}
        user_agent: {type: [string, 'null']}
        created_at: {type: string, format: date-time}
    AuditLogPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: {$ref: '#/components/schemas/AuditLog'}
    Availability:
      type: object
      required: [is_online, online_since, can_go_online, blocked_reason, available, min_online_balance, currency]
      properties:
        is_online: {type: boolean}
        online_since: {type: [string, 'null'], format: date-time}
        can_go_online: {type: boolean}
        blocked_reason:
          type: [string, 'null']
          description: Why the driver cannot go online now (first match in this order); `null` when they can.
          enum: [suspended, not_approved, insufficient_balance, location_required, null]
        available: {type: integer, format: int64, description: Wallet balance minus reserved (0 without a wallet)., example: 1450}
        min_online_balance: {type: integer, format: int64, example: 50}
        currency: {$ref: '#/components/schemas/Currency'}
    AvailabilityUpdateRequest:
      type: object
      additionalProperties: false
      required: [online]
      properties:
        online: {type: boolean}
    AvailableOrders:
      type: object
      required: [items, eligibility]
      properties:
        items:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/DriverOrderCard'}
        eligibility:
          type: object
          description: Whether the driver can take orders right now and, if not, the first blocking reason.
          required: [eligible, reason]
          properties:
            eligible: {type: boolean}
            reason:
              type: [string, 'null']
              enum: [not_approved, offline, insufficient_balance, has_active_order, location_required, location_stale, null]
    BBox:
      type: array
      description: '`[min_lon, min_lat, max_lon, max_lat]` in WGS84.'
      minItems: 4
      maxItems: 4
      items: {type: number}
      example: [58.1381, 48.8231, 58.1532, 48.8297]
    BotClaimResponse:
      type: object
      required: [claimed]
      properties:
        claimed: {type: boolean, description: True only for the first claim of this update id.}
    BotConfig:
      type: object
      required: [passenger_miniapp_url, driver_miniapp_url, passenger_bot_username, driver_bot_username, support, default_language]
      properties:
        passenger_miniapp_url:
          type: string
          format: uri
          description: Base URL for inline `web_app` buttons; append `?startapp=<param>`.
          example: 'https://app.jantaxi.kz/passenger/'
        driver_miniapp_url: {type: string, format: uri, example: 'https://app.jantaxi.kz/driver/'}
        passenger_bot_username: {type: string, example: jantaxi_bot}
        driver_bot_username: {type: string, example: jantaxi_driver_bot}
        support:
          type: object
          required: [telegram_username, phone, hours]
          properties:
            telegram_username: {type: [string, 'null']}
            phone: {type: [string, 'null']}
            hours: {$ref: '#/components/schemas/LocalizedText'}
        default_language: {$ref: '#/components/schemas/Language'}
    BotContactRequest:
      type: object
      additionalProperties: false
      required: [phone, contact_user_id]
      properties:
        phone:
          type: string
          maxLength: 32
          description: '`contact.phone_number` as received (with or without `+`).'
          example: '77071234567'
        contact_user_id:
          type: integer
          format: int64
          description: '`contact.user_id`; must equal `tg_id`.'
          example: 784512369
    BotContactResponse:
      type: object
      required: [phone, phone_verified, driver_id]
      properties:
        phone: {type: string, description: Normalised E.164., example: '+77071234567'}
        phone_verified: {type: boolean, const: true}
        driver_id: {type: [string, 'null'], format: uuid, description: Driver profile updated as well; `null` before registration.}
    BotDriverSummary:
      type: object
      required: [registered, driver_id, code, status, is_online, phone_verified, language, wallet, active_order, corrections, available_orders]
      properties:
        registered: {type: boolean, description: The user has a driver profile.}
        driver_id: {type: [string, 'null'], format: uuid}
        code: {type: [string, 'null'], example: EMB001}
        status:
          oneOf:
            - $ref: '#/components/schemas/DriverStatus'
            - type: 'null'
        is_online: {type: boolean}
        phone_verified: {type: boolean}
        language: {$ref: '#/components/schemas/Language'}
        wallet:
          oneOf:
            - $ref: '#/components/schemas/Wallet'
            - type: 'null'
        active_order:
          oneOf:
            - $ref: '#/components/schemas/BotOrderSummary'
            - type: 'null'
        corrections:
          type: array
          items: {$ref: '#/components/schemas/CorrectionItem'}
        available_orders: {type: integer, minimum: 0, description: Number of orders the driver could accept now.}
    BotLanguage:
      type: object
      additionalProperties: false
      required: [language]
      properties:
        language: {$ref: '#/components/schemas/Language'}
    BotLeaseRequest:
      type: object
      additionalProperties: false
      required: [instance_id, ttl_s]
      properties:
        instance_id:
          type: string
          minLength: 1
          maxLength: 128
          description: Stable id of the bot process (hostname + random suffix).
          example: driver-bot-7f9c2a
        ttl_s: {type: integer, minimum: 10, maximum: 120, example: 30}
    BotLeaseResponse:
      type: object
      required: [acquired, last_update_id, lease_expires_at]
      properties:
        acquired: {type: boolean, description: This instance holds the lease and may poll.}
        last_update_id: {type: integer, format: int64, description: Poll with `offset = last_update_id + 1`.}
        lease_expires_at: {type: [string, 'null'], format: date-time}
    BotLocationRequest:
      type: object
      additionalProperties: false
      required: [lat, lon, live]
      properties:
        lat: {type: number, minimum: -90, maximum: 90}
        lon: {type: number, minimum: -180, maximum: 180}
        accuracy_m: {type: number, minimum: 0, description: '`location.horizontal_accuracy`.'}
        heading: {type: number, minimum: 0, maximum: 360}
        live: {type: boolean, description: Live location (`live_period` set) rather than a one-off pin.}
    BotName:
      type: string
      enum: [passenger, driver]
    BotOffsetRequest:
      type: object
      additionalProperties: false
      required: [instance_id, last_update_id]
      properties:
        instance_id: {type: string, minLength: 1, maxLength: 128}
        last_update_id: {type: integer, format: int64, minimum: 0}
    BotOffsetResponse:
      type: object
      required: [last_update_id]
      properties:
        last_update_id: {type: integer, format: int64}
    BotOrderList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/BotOrderSummary'}
    BotOrderSummary:
      type: object
      required: [id, number, status, category, fare, currency, pickup_address, destination_address, created_at]
      properties:
        id: {type: string, format: uuid}
        number: {type: integer, format: int64, example: 1042}
        status: {$ref: '#/components/schemas/OrderStatus'}
        category: {$ref: '#/components/schemas/OrderCategory'}
        fare: {type: integer, format: int64}
        currency: {$ref: '#/components/schemas/Currency'}
        pickup_address: {type: string}
        destination_address: {type: string}
        created_at: {type: string, format: date-time}
    BotUserSyncRequest:
      type: object
      additionalProperties: false
      required: [telegram_user_id, first_name]
      properties:
        telegram_user_id: {type: integer, format: int64, minimum: 1, example: 784512369}
        first_name: {type: string, maxLength: 128}
        last_name: {type: string, maxLength: 128}
        username: {type: string, maxLength: 64}
        language_code: {type: string, maxLength: 16, description: Telegram `language_code` (hint only).}
        started: {type: boolean, description: The user sent `/start` to this bot.}
        blocked: {type: boolean, description: The user blocked this bot (`my_chat_member` → `kicked`); `false` clears it.}
    BotUserSyncResponse:
      type: object
      required: [user_id, language, language_chosen, is_new, is_blocked]
      properties:
        user_id: {type: string, format: uuid}
        language: {$ref: '#/components/schemas/Language'}
        language_chosen: {type: boolean, description: The user picked a language explicitly (otherwise offer the picker).}
        is_new: {type: boolean}
        is_blocked: {type: boolean, description: Blocked by an admin; the bot should only show the support contact.}
    CargoType:
      type: string
      description: Derived from the category (`taxi` → `none`, `parcel` → `parcel`, `other` → `other`).
      enum: [none, parcel, other]
    City:
      type: object
      required: [id, code, name, center, default_zoom, timezone, is_active, dispatch_radius_m, require_driver_location, driver_location_max_age_s, search_timeout_s, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        code: {type: string, pattern: '^[A-Z]{3}$', description: Prefix of driver codes; immutable., example: EMB}
        name: {$ref: '#/components/schemas/LocalizedText'}
        center: {$ref: '#/components/schemas/LatLon'}
        default_zoom: {type: number, minimum: 3, maximum: 20, example: 14}
        timezone: {type: string, description: IANA time zone (one of the Kazakhstan zones)., example: Asia/Aqtobe}
        is_active: {type: boolean}
        dispatch_radius_m: {type: integer, minimum: 500, maximum: 1000000, example: 50000}
        require_driver_location: {type: boolean, description: Dispatch only to drivers with a fresh location within the radius.}
        driver_location_max_age_s: {type: integer, minimum: 30, maximum: 86400, example: 900}
        search_timeout_s: {type: integer, minimum: 60, maximum: 86400, description: Searching orders are cancelled with `no_driver_found` after this., example: 900}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    CityCreateRequest:
      type: object
      additionalProperties: false
      required: [code, name, center]
      properties:
        code: {type: string, pattern: '^\\s*[A-Za-z]{3}\\s*$', description: Three letters; trimmed and upper-cased., example: AKT}
        name: {$ref: '#/components/schemas/LocalizedNameInput'}
        center: {$ref: '#/components/schemas/LatLon'}
        default_zoom: {type: number, minimum: 3, maximum: 20, description: Rounded to 2 decimals., default: 13}
        timezone:
          type: string
          enum: [Asia/Almaty, Asia/Aqtau, Asia/Aqtobe, Asia/Atyrau, Asia/Oral, Asia/Qostanay, Asia/Qyzylorda]
          default: Asia/Aqtobe
        is_active: {type: boolean, default: true}
        dispatch_radius_m: {type: integer, minimum: 500, maximum: 1000000, default: 50000}
        require_driver_location: {type: boolean, default: false}
        driver_location_max_age_s: {type: integer, minimum: 30, maximum: 86400, default: 900}
        search_timeout_s: {type: integer, minimum: 60, maximum: 86400, default: 900}
    CityPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: {$ref: '#/components/schemas/City'}
    CityRef:
      type: object
      description: Short city reference; clients pick the name for the UI language.
      required: [id, code, name]
      properties:
        id: {type: string, format: uuid}
        code: {type: string, pattern: '^[A-Z]{3}$', example: EMB}
        name: {$ref: '#/components/schemas/LocalizedText'}
    CityUpdateRequest:
      type: object
      additionalProperties: false
      description: Partial update; omitted fields keep their value.
      properties:
        code: {type: string, description: Must equal the current code (`fields.code = immutable` otherwise).}
        name: {$ref: '#/components/schemas/LocalizedNameInput'}
        center: {$ref: '#/components/schemas/LatLon'}
        default_zoom: {type: number, minimum: 3, maximum: 20, description: Rounded to 2 decimals.}
        timezone:
          type: string
          enum: [Asia/Almaty, Asia/Aqtau, Asia/Aqtobe, Asia/Atyrau, Asia/Oral, Asia/Qostanay, Asia/Qyzylorda]
        is_active: {type: boolean}
        dispatch_radius_m: {type: integer, minimum: 500, maximum: 1000000}
        require_driver_location: {type: boolean}
        driver_location_max_age_s: {type: integer, minimum: 30, maximum: 86400}
        search_timeout_s: {type: integer, minimum: 60, maximum: 86400}
    CorrectionItem:
      type: object
      description: One moderator remark on a registration field. `comment` is required when `reason` is `other`.
      required: [field, reason]
      properties:
        field: {$ref: '#/components/schemas/RegistrationField'}
        reason: {$ref: '#/components/schemas/CorrectionReason'}
        comment:
          type: [string, 'null']
          maxLength: 200
          description: Shown to the driver as written.
          example: Мемлекеттік нөмір анық көрінбейді
    CorrectionReason:
      type: string
      enum: [invalid_plate, plate_mismatch, duplicate_plate, duplicate_phone, id_unreadable, vehicle_photo_unclear, missing_info, other]
    Currency:
      type: string
      const: KZT
      description: Kazakhstani tenge; every amount is a whole number of tenge.
    CursorMeta:
      type: object
      required: [next_cursor]
      properties:
        next_cursor:
          type: [string, 'null']
          description: Pass as `before` for the next page; `null` on the last page.
          example: MjAyNi0xMC0xNlQwOTozMDowMFp8MTA0Mg
    DashboardMetrics:
      type: object
      required: [from, to, city_id, timezone, orders, revenue, drivers, topups, wallets, performance, notifications, cities, today, daily]
      properties:
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        city_id: {type: [string, 'null'], format: uuid}
        timezone: {type: string, description: Zone used for days and defaults., example: Asia/Aqtobe}
        orders:
          type: object
          required: [created, completed, cancelled, cancelled_by_passenger, cancelled_by_driver, cancelled_by_admin, no_driver_found, disputed, searching_now, active_now, by_category]
          properties:
            created: {type: integer}
            completed: {type: integer}
            cancelled: {type: integer}
            cancelled_by_passenger: {type: integer}
            cancelled_by_driver: {type: integer}
            cancelled_by_admin: {type: integer}
            no_driver_found: {type: integer, description: Cancelled by the search timeout.}
            disputed: {type: integer}
            searching_now: {type: integer}
            active_now: {type: integer, description: accepted + driver_arriving + in_progress right now.}
            by_category:
              type: object
              required: [taxi, parcel, other]
              properties:
                taxi: {type: integer}
                parcel: {type: integer}
                other: {type: integer}
        revenue:
          type: object
          required: [gmv, commission_charged, commission_refunded, commission_net, currency]
          properties:
            gmv: {type: integer, format: int64, description: Sum of fares of completed orders.}
            commission_charged: {type: integer, format: int64}
            commission_refunded: {type: integer, format: int64}
            commission_net: {type: integer, format: int64, description: '`commission_charged - commission_refunded`.'}
            currency: {$ref: '#/components/schemas/Currency'}
        drivers:
          type: object
          required: [total, approved, online_now, offline_now, pending_review, pending_applications, changes_requested, suspended, registered_in_period]
          properties:
            total: {type: integer}
            approved: {type: integer}
            online_now: {type: integer}
            offline_now: {type: integer, description: Approved drivers who are offline.}
            pending_review: {type: integer}
            pending_applications: {type: integer}
            changes_requested: {type: integer}
            suspended: {type: integer}
            registered_in_period: {type: integer}
        topups:
          type: object
          required: [pending_verification_count, pending_verification_amount, confirmed_count, confirmed_amount, refunded_count, refunded_amount]
          properties:
            pending_verification_count: {type: integer}
            pending_verification_amount: {type: integer, format: int64}
            confirmed_count: {type: integer}
            confirmed_amount: {type: integer, format: int64}
            refunded_count: {type: integer}
            refunded_amount: {type: integer, format: int64}
        wallets:
          type: object
          required: [total_balance, total_reserved]
          properties:
            total_balance: {type: integer, format: int64}
            total_reserved: {type: integer, format: int64}
        performance:
          type: object
          required: [avg_accept_time_s, avg_trip_duration_s, completion_rate_bps]
          properties:
            avg_accept_time_s: {type: [integer, 'null'], description: Creation → acceptance.}
            avg_trip_duration_s: {type: [integer, 'null'], description: Start → completion.}
            completion_rate_bps: {type: [integer, 'null'], minimum: 0, maximum: 10000, description: Completed / created in basis points.}
        notifications:
          type: object
          required: [pending, dead]
          properties:
            pending: {type: integer}
            dead: {type: integer}
        cities:
          type: object
          required: [total, active]
          properties:
            total: {type: integer}
            active: {type: integer}
        today:
          type: object
          description: Figures for the current local day, independent of `from`/`to`.
          required: [from, to, orders_created, orders_completed, orders_cancelled, orders_disputed, gmv, commission_charged, commission_refunded, commission_net, topups_confirmed_count, topups_confirmed_amount]
          properties:
            from: {type: string, format: date-time}
            to: {type: string, format: date-time}
            orders_created: {type: integer}
            orders_completed: {type: integer}
            orders_cancelled: {type: integer}
            orders_disputed: {type: integer}
            gmv: {type: integer, format: int64}
            commission_charged: {type: integer, format: int64}
            commission_refunded: {type: integer, format: int64}
            commission_net: {type: integer, format: int64}
            topups_confirmed_count: {type: integer}
            topups_confirmed_amount: {type: integer, format: int64}
        daily:
          type: array
          description: One row per local day of the period.
          items:
            type: object
            required: [date, orders_created, orders_completed, gmv, commission, topups_confirmed_count, topups_confirmed_amount]
            properties:
              date: {type: string, format: date, example: '2026-10-16'}
              orders_created: {type: integer}
              orders_completed: {type: integer}
              gmv: {type: integer, format: int64}
              commission: {type: integer, format: int64, description: Charged minus refunded; may be negative.}
              topups_confirmed_count: {type: integer}
              topups_confirmed_amount: {type: integer, format: int64}
    Dispute:
      type: object
      required: [id, order_id, order_number, status, opened_by_type, opened_by_id, reason, previous_status, outcome, resolution, resolved_by, created_at, resolved_at]
      properties:
        id: {type: string, format: uuid}
        order_id: {type: string, format: uuid}
        order_number: {type: integer, format: int64, example: 1042}
        status: {$ref: '#/components/schemas/DisputeStatus'}
        opened_by_type: {type: string, enum: [passenger, driver, admin]}
        opened_by_id: {type: [string, 'null'], format: uuid}
        reason: {type: string, maxLength: 500}
        previous_status: {$ref: '#/components/schemas/OrderStatus'}
        outcome:
          oneOf:
            - $ref: '#/components/schemas/DisputeOutcome'
            - type: 'null'
        resolution: {type: [string, 'null'], maxLength: 1000}
        resolved_by:
          oneOf:
            - $ref: '#/components/schemas/AdminRef'
            - type: 'null'
        created_at: {type: string, format: date-time}
        resolved_at: {type: [string, 'null'], format: date-time}
    DisputeOutcome:
      type: string
      description: Final order status chosen when resolving.
      enum: [completed, cancelled]
    DisputePage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: {$ref: '#/components/schemas/Dispute'}
    DisputeResolveRequest:
      type: object
      additionalProperties: false
      required: [outcome, resolution]
      properties:
        outcome: {$ref: '#/components/schemas/DisputeOutcome'}
        resolution: {type: string, minLength: 1, maxLength: 1000}
        refund_commission:
          type: [boolean, 'null']
          default: false
          description: With `outcome = cancelled`, refund a commission that was already charged.
    DisputeStatus:
      type: string
      enum: [open, resolved]
    DriverApplication:
      type: object
      required: [id, round, status, submitted_at, reviewed_at, reviewed_by, decision_comment, corrections, snapshot]
      properties:
        id: {type: string, format: uuid}
        round: {type: integer, minimum: 1}
        status: {type: string, enum: [pending, approved, changes_requested, rejected]}
        submitted_at: {type: string, format: date-time}
        reviewed_at: {type: [string, 'null'], format: date-time}
        reviewed_by:
          oneOf:
            - $ref: '#/components/schemas/AdminRef'
            - type: 'null'
        decision_comment: {type: [string, 'null']}
        corrections:
          type: array
          items: {$ref: '#/components/schemas/CorrectionItem'}
        snapshot:
          type: object
          description: Registration data and file ids as submitted in this round.
          additionalProperties: true
    DriverApproveRequest:
      type: object
      additionalProperties: false
      properties:
        comment: {type: [string, 'null'], maxLength: 500}
    DriverCorrectionsRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 10
          items: {$ref: '#/components/schemas/CorrectionItem'}
        comment: {type: [string, 'null'], maxLength: 500, example: Көліктің артқы жағын қайта суретке түсіріңіз}
    DriverFileUpload:
      type: object
      required: [kind, file]
      properties:
        kind: {$ref: '#/components/schemas/UploadKind'}
        file:
          type: string
          contentMediaType: application/octet-stream
          description: JPEG, PNG or WebP image, at most 10 MiB.
    DriverLastLocation:
      type: object
      required: [lat, lon, accuracy_m, heading, speed_mps, source, recorded_at, received_at, age_s]
      properties:
        lat: {type: number}
        lon: {type: number}
        accuracy_m: {type: [number, 'null']}
        heading: {type: [number, 'null']}
        speed_mps: {type: [number, 'null']}
        source: {$ref: '#/components/schemas/LocationSource'}
        recorded_at: {type: string, format: date-time}
        received_at: {type: string, format: date-time}
        age_s: {type: integer, format: int64, minimum: 0, description: Seconds since `recorded_at`.}
    DriverLocation:
      type: object
      description: Assigned driver's last reported position.
      required: [lat, lon, accuracy_m, heading, recorded_at]
      properties:
        lat: {type: number, example: 48.827}
        lon: {type: number, example: 58.145}
        accuracy_m: {type: [number, 'null'], minimum: 0, example: 8}
        heading: {type: [number, 'null'], minimum: 0, maximum: 360, example: 210}
        recorded_at: {type: string, format: date-time, example: '2026-10-16T09:33:40Z'}
    DriverLocationItem:
      type: object
      required: [driver, status, is_online, active_order, location]
      properties:
        driver: {$ref: '#/components/schemas/DriverRef'}
        status: {$ref: '#/components/schemas/DriverStatus'}
        is_online: {type: boolean}
        active_order:
          oneOf:
            - $ref: '#/components/schemas/OrderRef'
            - type: 'null'
        location: {$ref: '#/components/schemas/DriverLastLocation'}
    DriverLocationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/DriverLocationItem'}
    DriverOrderCancelRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          description: Shown to the passenger and operators. Free-text rules apply.
          minLength: 1
          maxLength: 120
          example: Көлік бұзылды
    DriverOrderCard:
      type: object
      description: Available order as listed to an eligible driver (no passenger contact data).
      required: [id, number, category, service_type, cargo_type, stops, stop_count, comment, cargo_description, fare, currency, commission_amount, payment_method, distance_m, duration_s, distance_to_pickup_m, created_at, search_expires_at]
      properties:
        id: {type: string, format: uuid}
        number: {type: integer, format: int64, example: 1042}
        category: {$ref: '#/components/schemas/OrderCategory'}
        service_type: {$ref: '#/components/schemas/ServiceType'}
        cargo_type: {$ref: '#/components/schemas/CargoType'}
        stops:
          type: array
          minItems: 2
          maxItems: 5
          items: {$ref: '#/components/schemas/StopSummary'}
        stop_count: {type: integer, minimum: 2, maximum: 5, example: 2}
        comment: {type: [string, 'null'], maxLength: 120, example: Кіреберіс алдында күтемін}
        cargo_description: {type: [string, 'null'], maxLength: 120}
        fare: {type: integer, format: int64, example: 800}
        currency: {$ref: '#/components/schemas/Currency'}
        commission_amount:
          type: integer
          format: int64
          description: Commission reserved from the driver's wallet on acceptance.
          example: 80
        payment_method: {$ref: '#/components/schemas/PaymentMethod'}
        distance_m: {type: integer, minimum: 0, example: 1840}
        duration_s: {type: integer, minimum: 0, example: 260}
        distance_to_pickup_m:
          type: [integer, 'null']
          description: Straight-line distance from the driver's last known location; `null` without a location.
          example: 650
        created_at: {type: string, format: date-time}
        search_expires_at: {type: [string, 'null'], format: date-time}
    DriverOrderDetail:
      type: object
      description: |
        Order as seen by a driver. For an available order `is_mine` is `false`, and `passenger`,
        `recipient_phone`, `address_details` and `events` are withheld (`null` / empty) until the
        driver accepts it. Contact data is shown only while the order is active.
      required: [id, number, status, is_mine, category, service_type, cargo_type, cargo_description, recipient_phone, comment, fare, currency, commission_bps, commission_amount, payment_method, distance_m, duration_s, distance_to_pickup_m, stop_count, stops, route, passenger, next_stop_id, events, rating, cancel_reason, cancelled_by, can_accept, can_arrive, can_start, can_complete, can_cancel, version, created_at, search_expires_at, accepted_at, arrived_at, started_at, completed_at, cancelled_at]
      properties:
        id: {type: string, format: uuid}
        number: {type: integer, format: int64, example: 1042}
        status: {$ref: '#/components/schemas/OrderStatus'}
        is_mine: {type: boolean, description: The order is assigned to this driver.}
        category: {$ref: '#/components/schemas/OrderCategory'}
        service_type: {$ref: '#/components/schemas/ServiceType'}
        cargo_type: {$ref: '#/components/schemas/CargoType'}
        cargo_description: {type: [string, 'null'], maxLength: 120, example: Құжаттар салынған конверт}
        recipient_phone:
          type: [string, 'null']
          description: Parcel recipient (E.164); only for the assigned driver while the order is active.
          example: '+77011234567'
        comment: {type: [string, 'null'], maxLength: 120}
        fare: {type: integer, format: int64, example: 800}
        currency: {$ref: '#/components/schemas/Currency'}
        commission_bps: {type: integer, minimum: 0, maximum: 5000, example: 1000}
        commission_amount: {type: integer, format: int64, example: 80}
        payment_method: {$ref: '#/components/schemas/PaymentMethod'}
        distance_m: {type: integer, minimum: 0, example: 1840}
        duration_s: {type: integer, minimum: 0, example: 260}
        distance_to_pickup_m: {type: [integer, 'null'], example: 650}
        stop_count: {type: integer, minimum: 2, maximum: 5}
        stops:
          type: array
          minItems: 2
          maxItems: 5
          items: {$ref: '#/components/schemas/Stop'}
        route: {$ref: '#/components/schemas/RouteSnapshot'}
        passenger:
          oneOf:
            - $ref: '#/components/schemas/OrderPassenger'
            - type: 'null'
        next_stop_id:
          type: [string, 'null']
          format: uuid
          description: Next stop to drive to (pickup before start, then the first uncompleted stop).
        events:
          type: array
          items: {$ref: '#/components/schemas/OrderEvent'}
        rating:
          description: Passenger's rating of this trip, once given.
          oneOf:
            - $ref: '#/components/schemas/OrderRating'
            - type: 'null'
        cancel_reason: {type: [string, 'null']}
        cancelled_by:
          oneOf:
            - $ref: '#/components/schemas/ActorType'
            - type: 'null'
        can_accept: {type: boolean}
        can_arrive: {type: boolean}
        can_start: {type: boolean}
        can_complete: {type: boolean, description: False while intermediate stops are pending.}
        can_cancel: {type: boolean}
        version: {type: integer, minimum: 1, description: Increments on every status change.}
        created_at: {type: string, format: date-time}
        search_expires_at: {type: [string, 'null'], format: date-time}
        accepted_at: {type: [string, 'null'], format: date-time}
        arrived_at: {type: [string, 'null'], format: date-time}
        started_at: {type: [string, 'null'], format: date-time}
        completed_at: {type: [string, 'null'], format: date-time}
        cancelled_at: {type: [string, 'null'], format: date-time}
    DriverOrderSummary:
      type: object
      required: [id, number, status, category, fare, currency, commission_amount, payment_method, pickup, destination, stop_count, distance_m, created_at, completed_at, cancelled_at, cancelled_by]
      properties:
        id: {type: string, format: uuid}
        number: {type: integer, format: int64, example: 1042}
        status: {$ref: '#/components/schemas/OrderStatus'}
        category: {$ref: '#/components/schemas/OrderCategory'}
        fare: {type: integer, format: int64, example: 800}
        currency: {$ref: '#/components/schemas/Currency'}
        commission_amount: {type: integer, format: int64, example: 80}
        payment_method: {$ref: '#/components/schemas/PaymentMethod'}
        pickup: {$ref: '#/components/schemas/StopSummary'}
        destination: {$ref: '#/components/schemas/StopSummary'}
        stop_count: {type: integer, minimum: 2, maximum: 5}
        distance_m: {type: integer, minimum: 0}
        created_at: {type: string, format: date-time}
        completed_at: {type: [string, 'null'], format: date-time}
        cancelled_at: {type: [string, 'null'], format: date-time}
        cancelled_by:
          oneOf:
            - $ref: '#/components/schemas/ActorType'
            - type: 'null'
    DriverOrderSummaryCursorList:
      allOf:
        - $ref: '#/components/schemas/CursorMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: {$ref: '#/components/schemas/DriverOrderSummary'}
    DriverProfile:
      type: object
      required: [id, code, status, first_name, last_name, phone, phone_verified, avatar, city, vehicle, rating, rating_count, completed_trips, is_online, online_since, approved_at, suspended_reason, created_at]
      properties:
        id: {type: string, format: uuid}
        code: {type: string, pattern: '^[A-Z]{3}[0-9]{3,}$', example: EMB001}
        status: {$ref: '#/components/schemas/DriverStatus'}
        first_name: {type: string, example: Ерлан}
        last_name: {type: string, example: Бекенов}
        phone: {type: [string, 'null'], description: Own phone (E.164)., example: '+77071234567'}
        phone_verified: {type: boolean}
        avatar:
          oneOf:
            - $ref: '#/components/schemas/FileRef'
            - type: 'null'
        city: {$ref: '#/components/schemas/CityRef'}
        vehicle:
          oneOf:
            - $ref: '#/components/schemas/Vehicle'
            - type: 'null'
        rating: {type: [number, 'null'], minimum: 1, maximum: 5, example: 4.9}
        rating_count: {type: integer, minimum: 0, example: 37}
        completed_trips: {type: integer, minimum: 0, example: 112}
        is_online: {type: boolean}
        online_since: {type: [string, 'null'], format: date-time}
        approved_at: {type: [string, 'null'], format: date-time}
        suspended_reason: {type: [string, 'null']}
        created_at: {type: string, format: date-time}
    DriverProfileUpdateRequest:
      type: object
      description: |
        No field is self-editable in this version: send `{}`. Moderated keys (`first_name`,
        `last_name`, `phone`, `avatar`, `avatar_file_id`, `vehicle`, `city`, `city_id`, `code`,
        `status`, `documents`, `language`) are rejected with `422` and
        `fields.<name> = not_editable`; other keys with `400`.
      maxProperties: 0
    DriverRef:
      type: object
      required: [id, code, first_name, last_name, phone]
      properties:
        id: {type: string, format: uuid}
        code: {type: string, example: EMB001}
        first_name: {type: string, example: Ерлан}
        last_name: {type: string, example: Бекенов}
        phone: {type: [string, 'null'], example: '+77071234567'}
    DriverRegistration:
      type: object
      required: [id, status, code, city, first_name, last_name, phone, phone_verified, avatar, documents, vehicle, corrections, correction_comment, rejection_reason, missing_fields, editable, can_submit, submitted_at, history, pd_consent_at, pd_consent_version]
      properties:
        id:
          type: [string, 'null']
          format: uuid
          description: Driver profile id; `null` before the first save.
        status: {$ref: '#/components/schemas/DriverStatus'}
        code: {type: [string, 'null'], pattern: '^[A-Z]{3}[0-9]{3,}$', example: EMB001}
        city:
          oneOf:
            - $ref: '#/components/schemas/CityRef'
            - type: 'null'
        first_name: {type: string, maxLength: 60}
        last_name: {type: string, maxLength: 60}
        phone:
          type: [string, 'null']
          description: Telegram-verified phone (E.164), shared through the driver bot.
        phone_verified: {type: boolean}
        avatar:
          oneOf:
            - $ref: '#/components/schemas/FileRef'
            - type: 'null'
        documents:
          type: object
          description: Identity card photos.
          required: [id_front, id_back]
          properties:
            id_front:
              oneOf:
                - $ref: '#/components/schemas/FileRef'
                - type: 'null'
            id_back:
              oneOf:
                - $ref: '#/components/schemas/FileRef'
                - type: 'null'
        vehicle: {$ref: '#/components/schemas/RegistrationVehicle'}
        corrections:
          type: array
          description: Open moderator remarks (status `changes_requested`); empty otherwise.
          items: {$ref: '#/components/schemas/CorrectionItem'}
        correction_comment: {type: [string, 'null'], description: Moderator's overall comment on the corrections.}
        rejection_reason: {type: [string, 'null'], description: Set when `status` is `rejected`.}
        missing_fields:
          type: array
          description: What is still needed before `POST /driver/register` succeeds.
          items: {$ref: '#/components/schemas/RegistrationField'}
        editable: {type: boolean, description: True while `draft` (including before the first save) or `changes_requested`.}
        can_submit: {type: boolean, description: 'Editable, nothing missing and (when required) the phone verified.'}
        submitted_at: {type: [string, 'null'], format: date-time}
        history:
          type: array
          description: Moderation history, newest first (moderator identity is not shown).
          items: {$ref: '#/components/schemas/RegistrationHistoryItem'}
        pd_consent_at: {type: [string, 'null'], format: date-time, description: When personal-data consent was given on submit.}
        pd_consent_version: {type: [string, 'null'], description: Consent text version accepted., example: '2026-10'}
      example:
