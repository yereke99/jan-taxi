      required: [id, number, status, category, service_type, cargo_type, cargo_description, recipient_phone, prohibited_items_ack, comment, fare, currency, commission_bps, commission_amount, payment_method, tariff_id, quote_id, distance_m, duration_s, stop_count, city, stops, route, passenger, driver, vehicle, driver_location, offers, events, reservation, ledger, dispute, rating, cancel_reason, cancelled_by, version, created_at, updated_at, search_expires_at, accepted_at, arrived_at, started_at, completed_at, cancelled_at]
      properties:
