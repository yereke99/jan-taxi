        avatar: {id: 4a5b6c7d-8e9f-4a0b-9c1d-2e3f4a5b6c7d, kind: avatar, url: /api/v1/driver/files/4a5b6c7d-8e9f-4a0b-9c1d-2e3f4a5b6c7d, width: 1200, height: 1600, created_at: '2026-10-15T08:00:00Z'}
        documents:
          id_front: {id: 5b6c7d8e-9f0a-4b1c-8d2e-3f4a5b6c7d8e, kind: id_front, url: /api/v1/driver/files/5b6c7d8e-9f0a-4b1c-8d2e-3f4a5b6c7d8e, width: 2000, height: 1260, created_at: '2026-10-15T08:01:00Z'}
          id_back: {id: 6c7d8e9f-0a1b-4c2d-9e3f-4a5b6c7d8e9f, kind: id_back, url: /api/v1/driver/files/6c7d8e9f-0a1b-4c2d-9e3f-4a5b6c7d8e9f, width: 2000, height: 1260, created_at: '2026-10-15T08:01:30Z'}
        vehicle:
          make: Toyota
          model: Camry
          color: Ақ
          plate: 123 ABC 04
          plate_normalized: 123ABC04
          photos:
            - {id: 7d8e9f0a-1b2c-4d3e-8f4a-5b6c7d8e9f0a, kind: main, url: /api/v1/driver/files/7d8e9f0a-1b2c-4d3e-8f4a-5b6c7d8e9f0a, width: 2000, height: 1500, created_at: '2026-10-15T08:02:00Z'}
        corrections:
          - {field: vehicle_photos, reason: vehicle_photo_unclear, comment: Мемлекеттік нөмір анық көрінбейді}
        correction_comment: Көліктің артқы жағын қайта суретке түсіріңіз
        rejection_reason: null
        missing_fields: [vehicle_photos]
        editable: true
        can_submit: false
        submitted_at: '2026-10-15T08:05:00Z'
        history:
          - {action: changes_requested, from_status: pending, to_status: changes_requested, comment: Көліктің артқы жағын қайта суретке түсіріңіз, corrections: [{field: vehicle_photos, reason: vehicle_photo_unclear, comment: Мемлекеттік нөмір анық көрінбейді}], created_at: '2026-10-15T10:20:00Z'}
          - {action: submitted, from_status: draft, to_status: pending, comment: null, corrections: [], created_at: '2026-10-15T08:05:00Z'}
        pd_consent_at: '2026-10-15T08:05:00Z'
        pd_consent_version: '2026-10'
    DriverRegistrationCheckRequest:
      type: object
      additionalProperties: false
      properties:
        plate: {type: [string, 'null'], maxLength: 20, description: Omitted or `null` → `plate` is `null` in the result., example: 123 АВС 04}
    DriverRegistrationCheckResult:
      type: object
      required: [plate]
      properties:
        plate:
          description: '`null` when no plate was sent.'
          oneOf:
            - type: object
              required: [input, normalized, display, valid, available]
              properties:
                input: {type: string, example: 123 АВС 04}
                normalized: {type: [string, 'null'], example: 123ABC04}
                display: {type: [string, 'null'], example: 123 ABC 04}
                valid: {type: boolean, description: Matches a Kazakhstan plate format (current or legacy).}
                available:
                  type: [boolean, 'null']
                  description: Not held by another driver; `null` when the plate is invalid.
            - type: 'null'
    DriverRegistrationUpdateRequest:
      type: object
      additionalProperties: false
      description: Full replacement of the text fields; every key must be present, empty strings are allowed while drafting.
      required: [first_name, last_name, vehicle]
      properties:
        first_name: {type: string, maxLength: 60, description: 'Letters, spaces, `-`, `''`, `.`.', example: Ерлан}
        last_name: {type: string, maxLength: 60, example: Бекенов}
        vehicle: {$ref: '#/components/schemas/VehicleInput'}
        location:
          type: [object, 'null']
          additionalProperties: false
          required: [lat, lon]
          description: Optional device position; on the first save it decides the driver's city (and the code prefix). Ignored afterwards.
          properties:
            lat: {type: number, minimum: -90, maximum: 90, example: 43.2389}
            lon: {type: number, minimum: -180, maximum: 180, example: 76.8897}
    DriverRejectRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: {type: string, minLength: 1, maxLength: 500, description: Shown to the driver.}
        comment: {type: [string, 'null'], maxLength: 500, description: Internal note.}
    DriverStats:
      type: object
      required: [completed_trips, accepted_orders, cancelled_by_driver, total_fares, total_commission]
      properties:
        completed_trips: {type: integer}
        accepted_orders: {type: integer}
        cancelled_by_driver: {type: integer}
        total_fares: {type: integer, format: int64}
        total_commission: {type: integer, format: int64}
    DriverStatus:
      type: string
      description: |
        `draft` (filling in), `pending` (submitted, awaiting moderation), `approved` (can work),
        `changes_requested` (fix and resubmit), `rejected` (final), `suspended` (blocked by an admin).
      enum: [draft, pending, approved, changes_requested, rejected, suspended]
    DriverSubmitRequest:
      type: object
      additionalProperties: false
      description: Personal-data consent given on the review step. Required on the first submission; optional on resubmission when consent is already recorded.
      properties:
        pd_consent: {type: [boolean, 'null'], description: Must be `true` when sent.}
        pd_consent_version:
          type: [string, 'null']
          pattern: '^[A-Za-z0-9._-]{1,32}$'
          description: Version of the consent text the driver accepted; required with `pd_consent`.
          example: '2026-10'
    DriverSuspendRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: {type: string, minLength: 1, maxLength: 300}
    DuplicateWarning:
      type: object
      description: |
        `same_driver_payment_reference`: another top-up quotes the same driver payment reference
        (`topup_id`, `reference`, `status`, `driver_code` set). `provider_transaction_recorded`: a
        payment transaction with this Kaspi transaction id is already recorded
        (`payment_transaction_id`, `provider_transaction_id`, and the linked top-up if any).
      required: [kind, topup_id, reference, status, driver_code, payment_transaction_id, provider_transaction_id]
      properties:
        kind: {type: string, enum: [same_driver_payment_reference, provider_transaction_recorded, receipt_serial_used]}
        topup_id: {type: [string, 'null'], format: uuid}
        reference: {type: [string, 'null']}
        status:
          oneOf:
            - $ref: '#/components/schemas/TopUpStatus'
            - type: 'null'
        driver_code: {type: [string, 'null']}
        payment_transaction_id: {type: [string, 'null'], format: uuid}
        provider_transaction_id: {type: [string, 'null']}
    EmptyObject:
      type: object
      description: An empty JSON object; any property is rejected (`400 bad_request`).
      additionalProperties: false
      maxProperties: 0
    Error:
      type: object
      required: [code, message]
      properties:
        code: {$ref: '#/components/schemas/ErrorCode'}
        message:
          type: string
          description: English fallback for logs. Never shown to users and never contains secrets.
        fields: {$ref: '#/components/schemas/ValidationFields'}
        details:
          type: object
          description: |
            Machine-readable context for the code, e.g. `outside_service_area` →
            `{"field": "stops", "index": 1}`; `insufficient_balance` →
            `{"required": 100, "available": 40, "currency": "KZT", "topup_min_amount": 500}`;
            `fare_not_allowed` → `{"min": 500, "max": 1500, "step": 50}`;
            `invalid_transition` → `{"from": "completed", "action": "cancel"}`;
            `registration_incomplete` → `{"missing_fields": [...]}`;
            `conflict` → `{"reason": "active_order_exists", "active_order_id": "..."}`.
          additionalProperties: true
    ErrorCode:
      type: string
      description: |
        | Code | HTTP | Meaning |
        |---|---|---|
        | `bad_request` | 400 | Malformed JSON, unknown field, empty body, bad multipart. |
        | `unauthorized` | 401 | Missing/invalid/expired app token, initData, admin session or service secret; wrong admin credentials. |
        | `insufficient_balance` | 402 | Wallet `available` below the required amount (accept, go online, refund, debit). |
        | `forbidden` | 403 | Wrong app for the route, blocked user, missing admin permission, bad CSRF token, wrong bot. |
        | `driver_not_registered` | 403 | Driver route that needs a driver profile, before registration. |
        | `driver_not_approved` | 403 | Driver is not `approved` (or is suspended). |
        | `not_found` | 404 | Unknown or invisible resource, malformed id, unconfigured webhook provider. |
        | `conflict` | 409 | Generic state conflict (duplicate, already rated, not editable, active order exists, idempotency key reuse). |
        | `invalid_transition` | 409 | Status does not allow the action. |
        | `order_already_taken` | 409 | Another driver accepted first. |
        | `driver_has_active_order` | 409 | The driver already has an active order. |
        | `driver_offline` | 409 | The driver must be online to accept. |
        | `phone_taken` | 409 | Phone held by another live driver. |
        | `plate_taken` | 409 | Plate held by another live driver. |
        | `payment_reference_used` | 409 | Kaspi transaction id already recorded for another top-up. |
        | `default_region_locked` | 409 | The nationwide default region `KAZ` cannot be deactivated and its zone cannot be changed. |
        | `payload_too_large` | 413 | Body over 64 KiB (JSON) / 10 MiB (upload). |
        | `unsupported_media_type` | 415 | Wrong `Content-Type`. |
        | `validation_failed` | 422 | Field validation; see `fields`. |
        | `outside_service_area` | 422 | A point is outside Kazakhstan; see `details.field` / `details.index`. |
        | `route_unavailable` | 422 / 503 | No road route between the points (422) or routing engine down (503). |
        | `quote_expired` | 422 | Quote expired, already used or not found for this user. |
        | `fare_not_allowed` | 422 | Fare is not one of the quote's options. |
        | `phone_not_verified` | 422 | A Telegram-verified phone is required. |
        | `registration_incomplete` | 422 | Required registration data missing; see `details.missing_fields`. |
        | `location_required` | 422 | Going online or accepting needs a fresh GPS fix; `details.reason` = `location_required` or `location_stale`. |
        | `too_many_requests` | 429 | Rate limited; see `Retry-After`. |
        | `internal` | 500 | Unexpected server error (logged with the request id). |
      enum:
        - bad_request
        - validation_failed
        - unauthorized
        - forbidden
        - not_found
        - conflict
        - invalid_transition
        - order_already_taken
        - driver_has_active_order
        - insufficient_balance
        - driver_not_registered
        - driver_not_approved
        - driver_offline
        - outside_service_area
        - route_unavailable
        - quote_expired
        - fare_not_allowed
        - phone_taken
        - plate_taken
        - phone_not_verified
        - registration_incomplete
        - location_required
        - too_many_requests
        - payment_reference_used
        - default_region_locked
        - payload_too_large
        - unsupported_media_type
        - internal
      x-enumDescriptions:
        bad_request: Malformed JSON, unknown field, empty body or bad multipart.
        validation_failed: Field validation failed; see `fields`.
        unauthorized: Missing, invalid or expired credentials.
        forbidden: Authenticated but not allowed.
        not_found: Unknown or invisible resource.
        conflict: Generic state conflict; see `details`.
        invalid_transition: Current status does not allow the action.
        order_already_taken: Another driver accepted the order first.
        driver_has_active_order: The driver already has an active order.
        insufficient_balance: Available wallet balance too low.
        driver_not_registered: Driver profile required.
        driver_not_approved: Driver is not approved or is suspended.
        driver_offline: Driver must be online.
        outside_service_area: Point outside Kazakhstan.
        route_unavailable: No route, or routing engine unavailable.
        quote_expired: Quote expired, used or unknown.
        fare_not_allowed: Fare not among the quote's options.
        phone_taken: Phone held by another live driver.
        plate_taken: Plate held by another live driver.
        phone_not_verified: Telegram-verified phone required.
        registration_incomplete: Required registration data missing.
        location_required: A fresh GPS location is required.
        too_many_requests: Rate limited.
        payment_reference_used: Provider transaction already recorded.
        default_region_locked: The nationwide default region cannot be deactivated or changed.
        payload_too_large: Request body too large.
        unsupported_media_type: Wrong Content-Type.
        internal: Unexpected server error.
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: {$ref: '#/components/schemas/Error'}
    ExtraFee:
      type: object
      description: Named fixed surcharge added to every fare of the tariff.
      required: [code, name, amount]
      properties:
        code: {type: string, pattern: '^[a-z0-9_]{1,32}$', example: night}
        name: {$ref: '#/components/schemas/LocalizedText'}
        amount: {type: integer, minimum: 1, example: 200}
    ExtraFeeInput:
      type: object
      additionalProperties: false
      required: [code, name, amount]
      properties:
        code: {type: string, pattern: '^[a-z0-9_]{1,32}$', description: Unique within the tariff., example: night}
        name:
          type: object
          additionalProperties: false
          required: [kk, ru, en]
          properties:
            kk: {type: string, minLength: 1, maxLength: 60, example: Түнгі}
            ru: {type: string, minLength: 1, maxLength: 60, example: Ночной}
            en: {type: string, minLength: 1, maxLength: 60, example: Night}
        amount: {type: integer, format: int64, minimum: 1, maximum: 10000000, example: 200}
    FareOptions:
      type: object
      description: |
        Allowed fares for the quote; the passenger picks one of `options`. `min` is the computed
        trip price rounded up to `step` and clamped to the tariff's `[min_fare, max_fare]`;
        `recommended` equals `min`; `max` is the tariff's `max_fare`.
      required: [recommended, min, max, step, options]
      properties:
        recommended: {type: integer, minimum: 1, example: 800}
        min: {type: integer, minimum: 1, example: 800}
        max: {type: integer, minimum: 1, example: 1500}
        step: {type: integer, minimum: 1, example: 50}
        options:
          type: array
          description: Every value from `min` to `max` inclusive in steps of `step`.
          minItems: 1
          items: {type: integer}
          example: [800, 850, 900, 950, 1000, 1050, 1100, 1150, 1200, 1250, 1300, 1350, 1400, 1450, 1500]
    FieldReason:
      type: string
      description: Per-field validation reason; frontends translate it.
      enum:
        - required
        - invalid
        - too_short
        - too_long
        - too_small
        - too_large
        - too_few
        - too_many
        - not_allowed
        - not_editable
        - must_be_true
        - unsupported_type
        - duplicate
        - mismatch
        - prohibited_content
        - outside_service_area
    FileKind:
      type: string
      description: Upload kinds plus `topup_receipt`.
      enum: [avatar, id_front, id_back, vehicle_main, vehicle_back, vehicle_side, vehicle_plate, vehicle_extra, topup_receipt]
    FileRef:
      type: object
      description: |
        Private file. `url` is relative to the API host: `/api/v1/driver/files/{id}` for the driver,
        `/api/v1/admin/files/{id}` in admin responses. Mini Apps must fetch it with the
        `Authorization` header (plain `<img src>` does not work); the admin panel can use it
        directly (cookie session).
      required: [id, kind, url, width, height, created_at]
      properties:
        id: {type: string, format: uuid}
        kind: {$ref: '#/components/schemas/FileKind'}
        url: {type: string, example: /api/v1/driver/files/4a5b6c7d-8e9f-4a0b-9c1d-2e3f4a5b6c7d}
        width: {type: integer, minimum: 1, example: 1200}
        height: {type: integer, minimum: 1, example: 1600}
        created_at: {type: string, format: date-time}
    GeoJsonLineString:
      type: object
      description: GeoJSON LineString, positions `[lon, lat]`.
      required: [type, coordinates]
      properties:
        type: {type: string, const: LineString}
        coordinates:
          type: array
          minItems: 2
          items: {$ref: '#/components/schemas/GeoJsonPosition'}
      example:
        type: LineString
        coordinates: [[58.1442, 48.8264], [58.1461, 48.8272], [58.1504, 48.8291]]
    GeoJsonMultiPolygon:
      type: object
      description: GeoJSON MultiPolygon, positions `[lon, lat]`, rings closed.
      required: [type, coordinates]
      properties:
        type: {type: string, const: MultiPolygon}
        coordinates:
          type: array
          minItems: 1
          items:
            type: array
            minItems: 1
            items:
              type: array
              minItems: 4
              items: {$ref: '#/components/schemas/GeoJsonPosition'}
    GeoJsonPolygon:
      type: object
      description: GeoJSON Polygon, positions `[lon, lat]`, rings closed.
      required: [type, coordinates]
      properties:
        type: {type: string, const: Polygon}
        coordinates:
          type: array
          minItems: 1
          items:
            type: array
            minItems: 4
            items: {$ref: '#/components/schemas/GeoJsonPosition'}
      example:
        type: Polygon
        coordinates: [[[58.05, 48.76], [58.24, 48.76], [58.24, 48.89], [58.05, 48.89], [58.05, 48.76]]]
    GeoJsonPosition:
      type: array
      description: '`[lon, lat]`.'
      minItems: 2
      maxItems: 2
      items: {type: number}
      example: [58.1442, 48.8264]
    GeoPlace:
      type: object
      required: [title, subtitle, lat, lon, source]
      properties:
        title: {type: string, example: Теміржол вокзалы}
        subtitle:
          type: [string, 'null']
          description: Locality / region line (the city name for curated places).
          example: Ембі
        lat: {type: number, minimum: -90, maximum: 90, example: 48.8291}
        lon: {type: number, minimum: -180, maximum: 180, example: 58.1504}
        source:
          type: string
          description: '`place` for admin-curated places, otherwise the geocoder that produced the result.'
          enum: [place, photon, nominatim, twogis]
          example: place
    GeoReverseResult:
      type: object
      required: [title, subtitle, lat, lon, source, in_service_area]
      properties:
        title: {type: string, example: 'Жиенқали Тілепбергенов көшесі, 12'}
        subtitle: {type: [string, 'null'], example: 'Ембі, Ақтөбе облысы'}
        lat: {type: number, minimum: -90, maximum: 90, description: The requested pin (6 decimals)., example: 48.8264}
        lon: {type: number, minimum: -180, maximum: 180, example: 58.1442}
        source:
          type: string
          description: '`place`, the geocoder name, or `coordinates` when nothing was found.'
          enum: [place, photon, nominatim, twogis, coordinates]
          example: photon
        in_service_area:
          type: boolean
          description: Point is inside Kazakhstan and can be used as a stop.
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: {type: string, const: ok}
    Language:
      type: string
      description: UI and notification language; `kk` is the default.
      enum: [kk, ru, en]
      default: kk
    LatLon:
      type: object
      description: WGS84 point (6 decimals).
      required: [lat, lon]
      properties:
        lat: {type: number, minimum: -90, maximum: 90, example: 48.8264}
        lon: {type: number, minimum: -180, maximum: 180, example: 58.1442}
    LedgerEntry:
      type: object
      description: Append-only wallet journal row as seen by the driver.
      required: [id, entry_type, balance_delta, reserved_delta, balance_after, reserved_after, currency, order_id, order_number, topup_id, topup_reference, description, created_at]
      properties:
        id: {type: integer, format: int64, example: 5310}
        entry_type: {$ref: '#/components/schemas/LedgerEntryType'}
        balance_delta: {type: integer, format: int64, example: -80}
        reserved_delta: {type: integer, format: int64, example: -80}
        balance_after: {type: integer, format: int64, minimum: 0, example: 1920}
        reserved_after: {type: integer, format: int64, minimum: 0, example: 0}
        currency: {$ref: '#/components/schemas/Currency'}
        order_id: {type: [string, 'null'], format: uuid}
        order_number: {type: [integer, 'null'], format: int64, example: 1042}
        topup_id: {type: [string, 'null'], format: uuid}
        topup_reference: {type: [string, 'null'], example: EMB001-TOPUP-000123}
        description: {type: [string, 'null'], description: Adjustment reason or system note.}
        created_at: {type: string, format: date-time}
    LedgerEntryCursorList:
      allOf:
        - $ref: '#/components/schemas/CursorMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: {$ref: '#/components/schemas/LedgerEntry'}
    LedgerEntryType:
      type: string
      description: |
        `topup_credit` (+balance), `topup_refund` (−balance), `commission_reserve` (+reserved),
        `commission_release` (−reserved), `commission_charge` (−balance, −reserved),
        `commission_refund` (+balance), `adjustment_credit` (+balance), `adjustment_debit` (−balance),
        `bonus_credit` (+balance; the welcome bonus `welcome_bonus:<driver_id>` or an operator's
        bonus `bonus:<key>`). Since v2 `commission_charge` is written when the driver takes the order
        (−balance only); reserve/release remain for orders accepted before.
      enum: [topup_credit, topup_refund, commission_reserve, commission_release, commission_charge, commission_refund, adjustment_credit, adjustment_debit, bonus_credit]
    LocalizedNameInput:
      type: object
      additionalProperties: false
      description: A name in all three languages; each is cleaned like free text and must be 1..120 code points.
      required: [kk, ru, en]
      properties:
        kk: {type: string, minLength: 1, maxLength: 120, example: Ақтөбе}
        ru: {type: string, minLength: 1, maxLength: 120, example: Актобе}
        en: {type: string, minLength: 1, maxLength: 120, example: Aktobe}
    LocalizedText:
      type: object
      required: [kk, ru, en]
      properties:
        kk: {type: string, example: Ембі}
        ru: {type: string, example: Эмба}
        en: {type: string, example: Embi}
    LocationInput:
      type: object
      additionalProperties: false
      required: [lat, lon]
      properties:
        lat: {type: number, minimum: -90, maximum: 90, example: 48.827}
        lon: {type: number, minimum: -180, maximum: 180, example: 58.145}
        accuracy_m: {type: [number, 'null'], minimum: 0, maximum: 100000, example: 8}
        heading: {type: [number, 'null'], minimum: 0, maximum: 360, example: 210}
        speed_mps: {type: [number, 'null'], minimum: 0, maximum: 100, example: 9.5}
        recorded_at:
          type: [string, 'null']
          format: date-time
          description: Device time of the fix (RFC 3339); defaults to the server time, and a time in the future (up to 60 s) is replaced by the server time. Fixes more than 60 seconds in the future are rejected; fixes older than the stored one are ignored.
    LocationSource:
      type: string
      enum: [miniapp, bot_live, bot_static]
    Me:
      type: object
      required: [id, telegram_user_id, first_name, last_name, username, language, phone_masked, phone_verified, app, driver]
      properties:
        id: {type: string, format: uuid}
        telegram_user_id: {type: integer, format: int64, example: 784512369}
        first_name: {type: string, description: From Telegram (may be empty)., example: Айгүл}
        last_name: {type: string, description: From Telegram (may be empty)., example: Серікқызы}
        username: {type: [string, 'null'], example: aigul_s}
        language: {$ref: '#/components/schemas/Language'}
        phone_masked:
          type: [string, 'null']
          description: Masked phone (only the last two digits visible); `null` when unknown.
          example: '+7 707 *** ** 67'
        phone_verified:
          type: boolean
          description: The phone was verified through the Telegram contact flow (`false` when there is no phone).
        app: {type: string, enum: [passenger, driver], description: App the token was issued for.}
        driver:
          description: Driver profile summary for driver tokens with a profile; otherwise `null`.
          oneOf:
            - $ref: '#/components/schemas/MeDriverSummary'
            - type: 'null'
    MeDriverSummary:
      type: object
      required: [id, code, status, is_online, city]
      properties:
        id: {type: string, format: uuid}
        code: {type: string, pattern: '^[A-Z]{3}[0-9]{3,}$', example: EMB001}
        status: {$ref: '#/components/schemas/DriverStatus'}
        is_online: {type: boolean}
        city: {$ref: '#/components/schemas/CityRef'}
    ModerationAction:
      type: string
      enum: [submitted, resubmitted, approved, changes_requested, rejected, suspended, restored, city_changed]
    ModerationEvent:
      type: object
      required: [id, application_id, action, actor_type, admin, from_status, to_status, reasons, comment, created_at]
      properties:
        id: {type: integer, format: int64}
        application_id: {type: [string, 'null'], format: uuid}
        action: {$ref: '#/components/schemas/ModerationAction'}
        actor_type: {type: string, enum: [driver, admin, system]}
        admin:
          oneOf:
            - $ref: '#/components/schemas/AdminRef'
            - type: 'null'
        from_status: {type: [string, 'null']}
        to_status: {type: [string, 'null']}
        reasons:
          type: array
          items: {$ref: '#/components/schemas/CorrectionItem'}
        comment: {type: [string, 'null']}
        created_at: {type: string, format: date-time}
    NotificationTemplate:
      type: object
      required: [key, language, body, is_custom, default_body, placeholders, updated_at, updated_by, override_body, bots, params, button]
      properties:
        key: {$ref: '#/components/schemas/NotificationTemplateKey'}
        language: {$ref: '#/components/schemas/Language'}
        body:
          type: string
          description: Effective text (the override when it still validates, else the default); placeholders are written as `{{name}}`.
          example: '<b>№{{order_number}}</b> тапсырыс қабылданды. Жүргізуші: {{driver_name}}, {{vehicle}}.'
        is_custom: {type: boolean, description: An override is stored.}
        default_body: {type: string}
        placeholders:
          type: array
          description: Names of the template's parameters.
          items: {type: string}
          example: [order_number, driver_name, vehicle]
        updated_at: {type: [string, 'null'], format: date-time}
        updated_by:
          oneOf:
            - $ref: '#/components/schemas/AdminRef'
            - type: 'null'
        override_body: {type: [string, 'null'], description: 'The stored override as saved, even if it no longer validates.'}
        bots:
          type: array
          description: Bots that send this template.
          items: {$ref: '#/components/schemas/BotName'}
        params:
          type: array
          items:
            type: object
            required: [name, kind, optional, description]
            properties:
              name: {type: string, example: order_number}
              kind: {type: string, enum: [text, money, number, id, category], description: '`money` is formatted as `1 500 ₸`.'}
              optional: {type: boolean, description: Body lines that use an empty optional parameter are dropped.}
              description: {type: string}
        button:
          description: Inline `web_app` button in this language; `null` for templates without one.
          oneOf:
            - type: object
              required: [label, start_param]
              properties:
                label: {type: string}
                start_param: {type: string, description: 'Mini App start parameter; `{{name}}` placeholders are filled from the params.', example: 'order_{{order_id}}'}
            - type: 'null'
    NotificationTemplateKey:
      type: string
      enum:
        - order_created_passenger
        - order_available_driver
        - order_accepted_passenger
        - order_accepted_driver
        - order_driver_arriving
        - order_started
        - order_stop_completed
        - order_completed_passenger
        - order_completed_driver
        - order_cancelled_passenger
        - order_cancelled_driver
        - order_no_driver
        - moderation_submitted
        - moderation_approved
        - moderation_changes_requested
        - moderation_rejected
        - driver_suspended
        - driver_restored
        - topup_created
        - topup_confirmed
        - topup_rejected
        - wallet_low_balance
        - dispute_opened
        - dispute_resolved
        - phone_verified
        - driver_welcome_bonus
        - driver_bonus_granted
        - order_offer_won
        - order_offer_taken
        - order_offer_cancelled
    NotificationTemplateList:
      type: object
      required: [items, max_body_length]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/NotificationTemplate'}
        max_body_length: {type: integer, const: 3500, description: Maximum override length in characters.}
    NotificationTemplateUpdateRequest:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body: {type: string, minLength: 1, maxLength: 3500}
    Order:
      type: object
      description: |
        Order as seen by its passenger. The commission belongs to the driver and admin
        representations (`DriverOrderDetail`, `AdminOrder`) and is never included here.
        `driver` and `vehicle` are set once a driver is assigned (they stay after a cancellation);
        `driver_location` only while the order is `accepted`, `driver_arriving` or `in_progress`;
        `driver.phone` only in those statuses too. `driver_eta_s` is the driver's estimated time
        to pickup A (§22.6), recomputed at most every 30 s while `accepted`.
      required: [id, number, status, category, service_type, cargo_type, cargo_description, recipient_phone, comment, fare, currency, payment_method, distance_m, duration_s, stop_count, city, stops, route, driver, vehicle, driver_location, driver_eta_s, driver_eta_at, events, rating, dispute, cancel_reason, cancel_reason_code, cancelled_by, can_cancel, can_rate, can_dispute, version, created_at, updated_at, search_expires_at, accepted_at, arrived_at, started_at, completed_at, cancelled_at, vehicle_class, vehicle_class_name, passenger_count, cargo_size, cargo_volume_l, locality, tariff_region]
      properties:
        locality: {type: [string, 'null'], minLength: 1, maxLength: 120, description: 'Real settlement of pickup A from reverse geocoding (city, town or village, else the district); `null` when unknown. Never coordinates.', example: Алматы}
        tariff_region: {$ref: '#/components/schemas/TariffRegion'}
        id: {type: string, format: uuid}
        number: {type: integer, format: int64, description: Human order number., example: 1042}
        status: {$ref: '#/components/schemas/OrderStatus'}
        category: {$ref: '#/components/schemas/OrderCategory'}
        vehicle_class: {$ref: '#/components/schemas/VehicleClassCode'}
        vehicle_class_name: {$ref: '#/components/schemas/LocalizedText'}
        passenger_count: {type: [integer, 'null'], minimum: 1, maximum: 15, description: Passengers of a taxi order; `null` for parcel/other.}
        cargo_size:
          description: Cargo size of a parcel/other order; `null` for taxi.
          oneOf:
            - $ref: '#/components/schemas/CargoSize'
            - type: 'null'
        cargo_volume_l: {type: integer, minimum: 0, description: 'Cargo volume derived from `cargo_size` (s=10, m=60, l=400, xl=1500 L); 0 for taxi.'}
        service_type: {$ref: '#/components/schemas/ServiceType'}
        cargo_type: {$ref: '#/components/schemas/CargoType'}
        cargo_description: {type: [string, 'null'], maxLength: 120}
        recipient_phone: {type: [string, 'null'], description: E.164; parcel orders only.}
        comment: {type: [string, 'null'], maxLength: 120}
        fare: {type: integer, format: int64, description: 'Agreed fare in KZT, paid to the driver directly.', example: 800}
        currency: {$ref: '#/components/schemas/Currency'}
        payment_method: {$ref: '#/components/schemas/PaymentMethod'}
        distance_m: {type: integer, minimum: 0}
        duration_s: {type: integer, minimum: 0}
        stop_count: {type: integer, minimum: 2, maximum: 5}
        city: {$ref: '#/components/schemas/CityRef'}
        stops:
          type: array
          minItems: 2
          maxItems: 5
          items: {$ref: '#/components/schemas/Stop'}
        route: {$ref: '#/components/schemas/RouteSnapshot'}
        driver:
          oneOf:
            - $ref: '#/components/schemas/OrderDriver'
            - type: 'null'
        vehicle:
          oneOf:
            - $ref: '#/components/schemas/Vehicle'
            - type: 'null'
        driver_location:
          oneOf:
            - $ref: '#/components/schemas/DriverLocation'
            - type: 'null'
        events:
          type: array
          description: Status history, oldest first.
          items: {$ref: '#/components/schemas/OrderEvent'}
        rating:
          oneOf:
            - $ref: '#/components/schemas/OrderRating'
            - type: 'null'
        dispute:
          description: The order's latest dispute, if any.
          oneOf:
            - $ref: '#/components/schemas/OrderDisputeInfo'
            - type: 'null'
        cancel_reason: {type: [string, 'null'], description: 'The passenger''s comment, or the operator''s / system reason.', example: Басқа көлік таптым}
        cancel_reason_code:
          description: The passenger's reason (§22.3); `null` otherwise.
          oneOf:
            - $ref: '#/components/schemas/CancelReasonCode'
            - type: 'null'
        driver_eta_s: {type: [integer, 'null'], minimum: 0, description: 'Driver''s estimated seconds to pickup A (OSRM from the latest GPS fix; straight line at 30 km/h as fallback), set from acceptance; show "~N мин" while `accepted`.', example: 420}
        driver_eta_at: {type: [string, 'null'], format: date-time, description: When `driver_eta_s` was computed.}
        cancelled_by:
          oneOf:
            - $ref: '#/components/schemas/ActorType'
            - type: 'null'
        can_cancel: {type: boolean, description: 'True while searching, accepted or driver_arriving (cancelling needs a reason, §22.3).'}
        can_rate: {type: boolean, description: True when completed and not yet rated.}
        can_dispute: {type: boolean, description: True while in_progress or within 72h after completion with no open dispute.}
        version: {type: integer, minimum: 1, description: Increments on every status change.}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        search_expires_at: {type: [string, 'null'], format: date-time}
        accepted_at: {type: [string, 'null'], format: date-time}
        arrived_at: {type: [string, 'null'], format: date-time}
        started_at: {type: [string, 'null'], format: date-time}
        completed_at: {type: [string, 'null'], format: date-time}
        cancelled_at: {type: [string, 'null'], format: date-time}
      example:
        id: 0a6f4c4e-6f1b-4b8e-9a52-3c1d2e7f9b10
        number: 1042
        status: driver_arriving
        category: taxi
        service_type: passenger
        cargo_type: none
        cargo_description: null
        recipient_phone: null
        comment: Кіреберіс алдында күтемін
        fare: 800
        currency: KZT
        payment_method: cash
        distance_m: 1840
        duration_s: 260
        stop_count: 2
        city: {id: 5b1c7a2e-0d3f-4e8a-9b6c-1f2e3d4c5b6a, code: EMB, name: {kk: Ембі, ru: Эмба, en: Embi}}
        stops:
