    OrderCancelRequest:
      type: object
      additionalProperties: false
      description: |
        The passenger's cancellation reason (§22.3). Labels kk / ru / en: `long_wait` Ұзақ күттім /
        Долго ждать / Waited too long; `driver_issue` Жүргізуші ұнамады / Не понравился водитель /
        Didn't like the driver; `vehicle_issue` Көлік ұнамады / Не понравилась машина / Didn't like
        the car; `changed_plans` Жоспарым өзгерді / Планы изменились / My plans changed; `other`
        Басқа себеп / Другое / Other.
      required: [reason_code]
      properties:
        reason_code: {$ref: '#/components/schemas/CancelReasonCode'}
        comment:
          type: [string, 'null']
          maxLength: 120
          description: Free text (≤ 120 code points); required when `reason_code` is `other`.
          example: Басқа көлік таптым
        expected_status:
          allOf: [{$ref: '#/components/schemas/OrderStatus'}]
          description: |
            The status the passenger saw when confirming; the cancellation applies only while the order is
            still in it (`409 conflict` `order_changed` otherwise). Optional for older apps.
          example: searching
    OrderCategory:
      type: string
      description: What the passenger books (`taxi` ride, `parcel` delivery, `other` delivery).
      enum: [taxi, parcel, other]
    OrderCreateRequest:
      type: object
      additionalProperties: false
      description: |
        Category comes from the quote. Conditional fields: `parcel` → `cargo_description`,
        `recipient_phone`, `prohibited_items_ack: true`; `other` → `cargo_description`,
        `prohibited_items_ack: true`, no `recipient_phone`; `taxi` → no cargo fields
        (`422` with `not_allowed`). Free-text fields follow the 120-code-point rules; blank
        values count as absent.
      required: [quote_id, fare, payment_method, idempotency_key]
      properties:
        quote_id: {type: string, format: uuid}
        fare:
          type: integer
          minimum: 1
          maximum: 2147483647
          description: One of the quote's `fare.options`.
          example: 800
        payment_method: {$ref: '#/components/schemas/PaymentMethod'}
        comment: {type: [string, 'null'], maxLength: 120, example: Кіреберіс алдында күтемін}
        cargo_description: {type: [string, 'null'], maxLength: 120, example: Құжаттар салынған конверт}
        recipient_phone:
          type: [string, 'null']
          description: Kazakhstan mobile (`parcel` only); normalised to E.164.
          example: '+7 701 123 45 67'
        prohibited_items_ack: {type: [boolean, 'null'], description: Passenger confirms no prohibited items (delivery categories).}
        idempotency_key: {type: string, format: uuid, description: Client-generated per order attempt.}
    OrderDisputeInfo:
      type: object
      required: [status, reason, outcome, resolution, created_at, resolved_at]
      properties:
        status: {$ref: '#/components/schemas/DisputeStatus'}
        reason: {type: string}
        outcome:
          oneOf:
            - $ref: '#/components/schemas/DisputeOutcome'
            - type: 'null'
        resolution: {type: [string, 'null']}
        created_at: {type: string, format: date-time}
        resolved_at: {type: [string, 'null'], format: date-time}
    OrderDisputeRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: {type: string, minLength: 1, maxLength: 500, example: Жүргізуші мені межелі жерге жеткізбеді}
    OrderDriver:
      type: object
      description: Assigned driver as shown to the passenger.
      required: [id, code, first_name, last_name, phone, rating, rating_count, completed_trips, photo_url]
      properties:
        id: {type: string, format: uuid}
        code: {type: string, example: EMB001}
        first_name: {type: string, example: Ерлан}
        last_name: {type: string, description: Initial only (`Б.`)., example: Б.}
        phone:
          type: [string, 'null']
          description: Full E.164 phone while the order is `accepted`, `driver_arriving` or `in_progress` (so the passenger can call); `null` otherwise.
          example: '+77071234567'
        rating: {type: [number, 'null'], minimum: 1, maximum: 5, description: Average rating (one decimal); `null` before the first rating., example: 4.9}
        rating_count: {type: integer, minimum: 0, example: 37}
        completed_trips: {type: integer, minimum: 0, example: 112}
        photo_url:
          type: [string, 'null']
          description: '`/api/v1/orders/{id}/driver-photo` when the driver has an avatar.'
    OrderEvent:
      type: object
      required: [from_status, to_status, actor_type, reason, created_at]
      properties:
        from_status:
          oneOf:
            - $ref: '#/components/schemas/OrderStatus'
            - type: 'null'
        to_status: {$ref: '#/components/schemas/OrderStatus'}
        actor_type: {$ref: '#/components/schemas/ActorType'}
        reason: {type: [string, 'null'], description: 'Cancel or dispute reason; `no_driver_found` for the search timeout.'}
        created_at: {type: string, format: date-time}
    OrderLedgerEntry:
      description: Ledger row of an order, with the driver it belongs to.
      allOf:
        - $ref: '#/components/schemas/LedgerEntry'
        - type: object
          required: [driver_id]
          properties:
            driver_id: {type: string, format: uuid}
    OrderOffer:
      type: object
      required: [driver, status, distance_to_pickup_m, sent_at, closed_at]
      properties:
        driver: {$ref: '#/components/schemas/DriverRef'}
        status: {type: string, enum: [sent, accepted, lost, expired, cancelled]}
        distance_to_pickup_m: {type: [integer, 'null']}
        sent_at: {type: string, format: date-time}
        closed_at: {type: [string, 'null'], format: date-time}
    OrderPassenger:
      type: object
      description: |
        Passenger as shown to the assigned driver while the order is active (§22.4/§22.5): the
        first name, the phone when the passenger shared it through Telegram, and how to write to
        them in Telegram.
      required: [first_name, phone, phone_verified, telegram_username, telegram_url]
      properties:
        first_name: {type: string, example: Айгүл}
        phone: {type: [string, 'null'], description: E.164 when the passenger shared (verified) a phone; `null` otherwise., example: '+77021234567'}
        phone_verified: {type: boolean}
        telegram_username: {type: [string, 'null'], description: Public Telegram username without `@`., example: aigul_k}
        telegram_url:
          type: string
          description: '`https://t.me/<username>`, or `tg://user?id=<telegram_user_id>` (a mention link) when the passenger has no username.'
          example: https://t.me/aigul_k
    OrderRating:
      type: object
      required: [rating, comment, created_at]
      properties:
        rating: {type: integer, minimum: 1, maximum: 5, example: 5}
        comment: {type: [string, 'null'], maxLength: 120, example: 'Жүргізуші сыпайы, көлігі таза'}
        created_at: {type: string, format: date-time}
    OrderRatingRequest:
      type: object
      additionalProperties: false
      required: [rating]
      properties:
        rating: {type: integer, minimum: 1, maximum: 5, example: 5}
        comment: {type: [string, 'null'], maxLength: 120, example: 'Жүргізуші сыпайы, көлігі таза'}
    OrderRef:
      type: object
      required: [id, number, status]
      properties:
        id: {type: string, format: uuid}
        number: {type: integer, format: int64, example: 1042}
        status: {$ref: '#/components/schemas/OrderStatus'}
    OrderStatus:
      type: string
      description: '`draft` is reserved for future server-side drafts and is never returned today.'
      enum: [draft, searching, accepted, driver_arriving, in_progress, completed, cancelled, disputed]
    OrderSummary:
      type: object
      required: [id, number, status, category, service_type, fare, currency, payment_method, pickup, destination, stop_count, distance_m, driver_first_name, rating, can_rate, created_at, completed_at, cancelled_at, vehicle_class, vehicle_class_name, passenger_count, cargo_size, cargo_volume_l, locality, tariff_region]
      properties:
        locality: {type: [string, 'null'], minLength: 1, maxLength: 120, description: 'Real settlement of pickup A from reverse geocoding (city, town or village, else the district); `null` when unknown. Never coordinates.', example: Алматы}
        tariff_region: {$ref: '#/components/schemas/TariffRegion'}
        id: {type: string, format: uuid}
        number: {type: integer, format: int64, example: 1042}
        status: {$ref: '#/components/schemas/OrderStatus'}
        category: {$ref: '#/components/schemas/OrderCategory'}
        vehicle_class: {$ref: '#/components/schemas/VehicleClassCode'}
        vehicle_class_name: {$ref: '#/components/schemas/LocalizedText'}
        passenger_count: {type: [integer, 'null'], minimum: 1, maximum: 15, description: Passengers of a taxi order; `null` for parcel/other.}
        cargo_size:
          description: Cargo size of a parcel/other order; `null` for taxi.
          oneOf:
            - $ref: '#/components/schemas/CargoSize'
            - type: 'null'
        cargo_volume_l: {type: integer, minimum: 0, description: 'Cargo volume derived from `cargo_size` (s=10, m=60, l=400, xl=1500 L); 0 for taxi.'}
        service_type: {$ref: '#/components/schemas/ServiceType'}
        fare: {type: integer, format: int64, example: 800}
        currency: {$ref: '#/components/schemas/Currency'}
        payment_method: {$ref: '#/components/schemas/PaymentMethod'}
        pickup: {$ref: '#/components/schemas/StopSummary'}
        destination: {$ref: '#/components/schemas/StopSummary'}
        stop_count: {type: integer, minimum: 2, maximum: 5}
        distance_m: {type: integer, minimum: 0}
        driver_first_name: {type: [string, 'null'], example: Ерлан}
        rating: {type: [integer, 'null'], minimum: 1, maximum: 5}
        can_rate: {type: boolean}
        created_at: {type: string, format: date-time}
        completed_at: {type: [string, 'null'], format: date-time}
        cancelled_at: {type: [string, 'null'], format: date-time}
    OrderSummaryCursorList:
      allOf:
        - $ref: '#/components/schemas/CursorMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: {$ref: '#/components/schemas/OrderSummary'}
    OutboxItem:
      type: object
      required: [id, bot, user_id, user_name, username, chat_id, template, params, dedupe_key, status, attempts, max_attempts, next_attempt_at, locked_until, last_error, telegram_message_id, created_at, sent_at, attempts_summary]
      properties:
        id: {type: string, format: uuid}
        bot: {$ref: '#/components/schemas/BotName'}
        user_id: {type: [string, 'null'], format: uuid}
        user_name: {type: string, description: Recipient's first and last name (empty when unknown).}
        username: {type: [string, 'null'], description: Recipient's Telegram username.}
        chat_id: {type: integer, format: int64}
        template: {$ref: '#/components/schemas/NotificationTemplateKey'}
        params:
          type: object
          additionalProperties: true
        dedupe_key: {type: string, example: 'order_accepted_passenger:0a6f4c4e-6f1b-4b8e-9a52-3c1d2e7f9b10'}
        status: {$ref: '#/components/schemas/OutboxStatus'}
        attempts: {type: integer, minimum: 0}
        max_attempts: {type: integer, minimum: 1, example: 8}
        next_attempt_at: {type: string, format: date-time}
        locked_until: {type: [string, 'null'], format: date-time, description: Lease of the worker currently sending it.}
        last_error: {type: [string, 'null'], description: Last Telegram error (no tokens).}
        telegram_message_id: {type: [integer, 'null'], format: int64}
        created_at: {type: string, format: date-time}
        sent_at: {type: [string, 'null'], format: date-time}
        attempts_summary:
          type: object
          required: [total, sent, retry, fatal, last]
          properties:
            total: {type: integer, minimum: 0}
            sent: {type: integer, minimum: 0}
            retry: {type: integer, minimum: 0}
            fatal: {type: integer, minimum: 0}
            last:
              description: Most recent attempt, if any.
              oneOf:
                - type: object
                  required: [attempt, outcome, http_status, error, retry_after_s, finished_at]
                  properties:
                    attempt: {type: integer, minimum: 1}
                    outcome: {type: string, enum: [sent, retry, fatal]}
                    http_status: {type: [integer, 'null']}
                    error: {type: [string, 'null']}
                    retry_after_s: {type: [integer, 'null']}
                    finished_at: {type: string, format: date-time}
                - type: 'null'
    OutboxPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: {$ref: '#/components/schemas/OutboxItem'}
    OutboxStatus:
      type: string
      description: '`dead` after 8 failed attempts or a 403 (bot blocked by the user).'
      enum: [pending, sending, sent, dead, cancelled]
    PageMeta:
      type: object
      required: [page, page_size, total]
      properties:
        page: {type: integer, minimum: 1, example: 1}
        page_size: {type: integer, minimum: 1, maximum: 100, example: 25}
        total: {type: integer, minimum: 0, example: 123}
    PaymentConfirmRequest:
      type: object
      additionalProperties: false
      required: [verified_amount, provider_transaction_id, paid_at]
      properties:
        verified_amount:
          type: integer
          format: int64
          minimum: 1
          maximum: 10000000
          description: Amount actually received according to Kaspi Pay; this is what is credited.
          example: 2000
        provider_transaction_id:
          type: string
          minLength: 1
          description: Kaspi transaction / receipt number from merchant records; whitespace is removed and letters upper-cased, at most 100 characters after that; unique per provider.
          example: '4815162342'
        paid_at: {type: string, format: date-time, description: Payment time from Kaspi Pay (at most 10 minutes in the future).}
        payer_info: {type: [string, 'null'], maxLength: 200, description: Payer name as shown in Kaspi Pay., example: Ерлан Б.}
        note: {type: [string, 'null'], maxLength: 300}
    PaymentMethod:
      type: string
      description: How the passenger pays the driver (outside the platform).
      enum: [cash, bank_transfer]
    PaymentProvider:
      type: string
      description: |
        `kaspi_manual`: the driver pays via Kaspi (top-ups are created with it). `kaspi_pdf`: a
        payment proven by a Kaspi PDF receipt (payment transactions only); Kaspi numbers are unique
        across both.
      enum: [kaspi_manual, kaspi_pdf]
    PaymentTransaction:
      type: object
      required: [id, provider, provider_transaction_id, amount, currency, paid_at, payer_info, source, recorded_by, created_at]
      properties:
        id: {type: string, format: uuid}
        provider: {$ref: '#/components/schemas/PaymentProvider'}
        provider_transaction_id: {type: string}
        amount: {type: integer, format: int64}
        currency: {$ref: '#/components/schemas/Currency'}
        paid_at: {type: [string, 'null'], format: date-time}
        payer_info: {type: [string, 'null']}
        source:
          type: string
          enum: [manual_admin, webhook, receipt_auto]
          description: '`receipt_auto`: credited automatically from a Kaspi PDF receipt (`recorded_by` null).'
        recorded_by:
          oneOf:
            - $ref: '#/components/schemas/AdminRef'
            - type: 'null'
        created_at: {type: string, format: date-time}
    Place:
      type: object
      required: [id, city_id, name, aliases, lat, lon, is_active, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        city_id: {type: [string, 'null'], format: uuid}
        name: {$ref: '#/components/schemas/LocalizedText'}
        aliases:
          type: array
          items: {type: string}
          example: [вокзал, станция]
        lat: {type: number, example: 48.8291}
        lon: {type: number, example: 58.1504}
        is_active: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    PlaceCreateRequest:
      type: object
      additionalProperties: false
      required: [name, lat, lon]
      properties:
        city_id: {type: [string, 'null'], format: uuid, description: '`null` (or omitted) for a place without a city.'}
        name: {$ref: '#/components/schemas/LocalizedNameInput'}
        aliases:
          type: [array, 'null']
          maxItems: 20
          description: Unique (ignoring case and Kazakh letter folding); each 1..120 code points.
          items: {type: string, minLength: 1, maxLength: 120}
        lat: {type: number, minimum: -90, maximum: 90}
        lon: {type: number, minimum: -180, maximum: 180}
        is_active: {type: [boolean, 'null'], default: true}
    PlacePage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: {$ref: '#/components/schemas/Place'}
    PlaceUpdateRequest:
      type: object
      additionalProperties: false
      description: Partial update; omitted fields keep their value. `lat` and `lon` may be sent separately.
      properties:
        city_id: {type: [string, 'null'], format: uuid, description: '`null` (or omitted) for a place without a city.'}
        name: {$ref: '#/components/schemas/LocalizedNameInput'}
        aliases:
          type: [array, 'null']
          maxItems: 20
          description: Unique (ignoring case and Kazakh letter folding); each 1..120 code points.
          items: {type: string, minLength: 1, maxLength: 120}
        lat: {type: number, minimum: -90, maximum: 90}
        lon: {type: number, minimum: -180, maximum: 180}
        is_active: {type: [boolean, 'null']}
    PreferencesUpdateRequest:
      type: object
      additionalProperties: false
      required: [language]
      properties:
        language: {$ref: '#/components/schemas/Language'}
    PublicConfig:
      type: object
      required: [app, default_language, languages, city, map, routing, bots, support, delivery, navigation, vehicle_classes, cargo_sizes, max_passenger_count]
      properties:
        app: {type: string, enum: [passenger, driver, admin]}
        default_language: {$ref: '#/components/schemas/Language'}
        languages:
          type: array
          items: {$ref: '#/components/schemas/Language'}
          example: [kk, ru, en]
        city:
          description: Default map city (`DEFAULT_CITY`, else the oldest active city); `null` when no active city exists.
          oneOf:
            - type: object
              required: [code, name, center, zoom]
              properties:
                code: {type: string, example: EMB}
                name: {$ref: '#/components/schemas/LocalizedText'}
                center: {$ref: '#/components/schemas/LatLon'}
                zoom: {type: number, example: 14}
            - type: 'null'
        map:
          type: object
          required: [style_url]
          properties:
            style_url: {type: string, description: MapLibre style URL (`MAP_STYLE_URL`)., example: 'https://tiles.openfreemap.org/styles/positron'}
        routing:
          type: object
          required: [max_points]
          properties:
            max_points: {type: integer, minimum: 2, maximum: 5, example: 5}
        bots:
          type: object
          required: [passenger_username, driver_username, passenger_link, driver_link, driver_register_link]
          properties:
            passenger_username: {type: string, description: Without `@`., example: jantaxi_bot}
            driver_username: {type: string, example: jantaxi_driver_bot}
            passenger_link:
              type: string
              description: Direct link opening the passenger Mini App full screen; empty when the bot username is not configured.
              example: 'https://t.me/jantaxi_bot?startapp=home&mode=fullscreen'
            driver_link: {type: string, example: 'https://t.me/jantaxi_driver_bot?startapp=home&mode=fullscreen'}
            driver_register_link: {type: string, example: 'https://t.me/jantaxi_driver_bot?startapp=register&mode=fullscreen'}
        support:
          type: object
          required: [telegram_username, telegram_link, phone, hours]
          properties:
            telegram_username: {type: string, description: Empty when not configured., example: jantaxi_support}
            telegram_link: {type: string, description: '`https://t.me/<username>`, or empty.', example: 'https://t.me/jantaxi_support'}
            phone: {type: string, description: Empty when not configured., example: '+77001234567'}
            hours: {$ref: '#/components/schemas/LocalizedText'}
        delivery:
          type: object
          required: [prohibited_items]
          properties:
            prohibited_items:
              type: array
              description: Codes of prohibited item groups (`delivery.prohibited_items`); the Mini App translates them.
              items: {type: string}
              example: [weapons, explosives, drugs, alcohol_tobacco, money_valuables, animals, hazardous, illegal_goods]
        navigation:
          type: object
          required: [twogis_base_url]
          properties:
            twogis_base_url: {type: string, description: Base URL for 2GIS navigation links (setting `navigation.twogis_base_url`)., example: 'https://2gis.kz'}
        fare:
          type: object
          description: Taxi fare range of the default city's active taxi tariff (`app=passenger` only; omitted when there is none). The quote is authoritative.
          required: [min, max, step]
          properties:
            min: {type: integer, example: 500}
            max: {type: integer, example: 1500}
            step: {type: integer, example: 50}
        kaspi:
          type: object
          description: Kaspi payment details (`app=driver` only).
          required: [payment_url, recipient_name, instructions]
          properties:
            payment_url: {type: string, description: Empty when not configured.}
            recipient_name: {type: string, example: ЖШС «Jan Taxi»}
            recipient_bin: {type: string, example: '000809500289', description: 'Payee BIN (`company.bin`); omitted when not set.'}
            instructions: {$ref: '#/components/schemas/LocalizedText'}
        topup:
          type: object
          description: Top-up limits (`app=driver` only); presets outside `[min, max]` are dropped.
          required: [min, max, presets]
          properties:
            min: {type: integer, format: int64, example: 500}
            max: {type: integer, format: int64, example: 100000}
            presets:
              type: array
              items: {type: integer, format: int64}
              example: [1000, 2000, 5000, 10000]
        vehicle_classes:
          type: array
          description: Active vehicle classes in display order (driver registration, passenger class choice).
          items: {$ref: '#/components/schemas/PublicVehicleClass'}
        cargo_sizes:
          type: array
          items:
            type: object
            required: [code, volume_l]
            properties:
              code: {$ref: '#/components/schemas/CargoSize'}
              volume_l: {type: integer, example: 10}
          example: [{code: s, volume_l: 10}, {code: m, volume_l: 60}, {code: l, volume_l: 400}, {code: xl, volume_l: 1500}]
        max_passenger_count: {type: integer, example: 15}
        cancel_reasons:
          type: array
          description: Passenger cancellation reasons in display order (`app=passenger` only, §22.3); send `code` as `reason_code` to `POST /orders/{id}/cancel`.
          items:
            type: object
            required: [code, label, comment_required]
            properties:
              code: {$ref: '#/components/schemas/CancelReasonCode'}
              label: {$ref: '#/components/schemas/LocalizedText'}
              comment_required: {type: boolean, description: True for `other`.}
        commission:
          type: object
          description: The commission charged when a driver takes an order (`app=driver` only, §22.2).
          required: [mode, fixed_amount]
          properties:
            mode: {type: string, enum: [fixed, percent]}
            fixed_amount: {type: integer, format: int64, description: KZT per order in `fixed` mode (within 50..100)., example: 50}
        welcome_bonus: {type: integer, format: int64, description: 'Welcome balance a new driver gets on the first approval (`app=driver` only, §22.1; 0 when off).', example: 500}
    QuoteStop:
      type: object
      description: Normalised stop echoed in a quote.
      required: [seq, kind, lat, lon, address, address_details]
      properties:
        seq: {type: integer, minimum: 0, maximum: 4}
        kind: {$ref: '#/components/schemas/StopKind'}
        lat: {type: number}
        lon: {type: number}
        address: {type: string, maxLength: 200}
        address_details: {type: [string, 'null'], maxLength: 120}
    ReadinessStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ready, not_ready, draining]
          description: '`draining` is sent alone (no `checks`) while the process shuts down.'
        checks:
          type: object
          description: |
            Check name → state. `database`: `ok` | `unavailable`; `migrations`: `ok` | `pending`
            (absent when the database is unavailable); registered checks such as `realtime`:
            `ok` | `failing`.
          additionalProperties:
            type: string
            enum: [ok, unavailable, pending, failing]
        schema_version:
          type: integer
          format: int64
          minimum: 0
          description: Applied goose migration version (0 when the database is unavailable).
    RealtimeAuthFrame:
      type: object
      description: First client frame on `/ws` for Mini Apps (within 5 seconds). Unknown fields are ignored.
      required: [type, token]
      properties:
        type: {type: string, const: auth}
        token: {type: string, minLength: 1, description: App token.}
    RealtimeEvent:
      type: object
      description: Server → client event frame. A hint to re-fetch REST state; delivery scopes are not sent.
      required: [type, id, ts, data]
      properties:
        type: {$ref: '#/components/schemas/RealtimeEventType'}
        id: {type: string, format: uuid, description: Event id (for de-duplication).}
        ts: {type: string, format: date-time}
        data:
          type: object
          description: |
            Small ids and statuses only (e.g. `order_id`, `order_number`, `status`, `driver_id`,
            `topup_id`). `order.accepted` and `driver.location_updated` carry `driver_eta_s`
            (seconds to pickup A, or `null`) while the order is `accepted` (§22.6).
          additionalProperties: true
      example:
        type: order.accepted
        id: 7d1e2f3a-4b5c-4d6e-8f70-112233445566
        ts: '2026-10-16T09:31:05Z'
        data: {order_id: 0a6f4c4e-6f1b-4b8e-9a52-3c1d2e7f9b10, order_number: 1042, status: accepted}
    RealtimeEventType:
      type: string
      enum:
        - order.created
        - order.available
        - order.taken
        - order.accepted
        - order.cancelled
        - order.driver_arriving
        - order.started
        - order.stop_completed
        - order.completed
        - order.disputed
        - driver.location_updated
        - driver.status_changed
        - wallet.updated
        - topup.updated
        - topup.confirmed
        - moderation.submitted
        - moderation.changes_requested
        - moderation.approved
        - moderation.rejected
        - driver.phone_verified
        - user.phone_verified
    RealtimePingFrame:
      type: object
      description: 'Optional application-level ping; the server answers `{"type": "pong"}`. Other client frames are ignored.'
      required: [type]
      properties:
        type: {type: string, const: ping}
    RealtimeServerFrame:
      description: Any frame the server sends on `/ws`.
      oneOf:
        - $ref: '#/components/schemas/RealtimeEvent'
        - type: object
          description: Sent once after authentication.
          required: [type, scopes]
          properties:
            type: {type: string, const: ready}
            scopes:
              type: array
              items: {type: string}
              example: ['driver:5b0e8f2a-1c3d-4e5f-8a9b-0c1d2e3f4a5b', 'user:9f8e7d6c-5b4a-4321-8fed-cba987654321']
        - type: object
          description: '`pong` answers a client ping; `resync` asks the client to re-fetch everything over REST.'
          required: [type]
          properties:
            type: {type: string, enum: [pong, resync]}
    BotTopUpReceiptResult:
      type: object
      required: [outcome, reasons, topup, balance]
      properties:
        outcome: {type: string, enum: [credited, pending_verification]}
        reasons:
          type: array
          items: {$ref: '#/components/schemas/ReceiptReviewReason'}
        topup:
          type: object
          required: [id, reference, amount, verified_amount, status]
          properties:
            id: {type: string, format: uuid}
            reference: {type: string}
            amount: {type: integer, format: int64}
            verified_amount: {type: [integer, 'null'], format: int64}
            status: {$ref: '#/components/schemas/TopUpStatus'}
        balance: {type: [integer, 'null'], format: int64, description: Wallet balance after the credit.}
    ConfirmPrefill:
      type: object
      required: [verified_amount, provider_transaction_id, paid_at, payer_info]
      properties:
        verified_amount: {type: [integer, 'null'], format: int64}
        provider_transaction_id: {type: [string, 'null'], description: 'Receipt number, e.g. QR18149336524.'}
        paid_at: {type: [string, 'null'], format: date-time}
        payer_info: {type: [string, 'null'], description: Masked payer name.}
    DriverReceiptCheck:
      type: object
      required: [kind, decision, reasons, receipt_serial, amount, paid_at]
      properties:
        kind: {type: string, enum: [pdf, image]}
        decision: {type: [string, 'null'], enum: [auto_confirmed, manual_review, null]}
        reasons:
          type: array
          description: Why the receipt was not credited automatically (`image_receipt` for images, `duplicate_receipt` for a reused receipt).
          items: {type: string}
        receipt_serial: {type: [string, 'null']}
        amount: {type: [integer, 'null'], format: int64}
        paid_at: {type: [string, 'null'], format: date-time}
    PaymentReceipt:
      type: object
      description: A Kaspi PDF receipt as parsed (payment_receipts). Unique by file, receipt number and QR payload.
      required: [id, provider, file_id, file_url, file_sha256, receipt_serial, qr_payload_hash, amount, paid_at, recipient_name, recipient_bin, payer_masked, payment_method, producer, parse_status, flags, decision, reasons, created_at]
      properties:
        id: {type: string, format: uuid}
        provider: {type: string, enum: [kaspi_pdf]}
        file_id: {type: string, format: uuid}
        file_url: {type: string, description: '`/api/v1/admin/files/{file_id}` (original PDF, finance.view).'}
        file_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        receipt_serial: {type: [string, 'null'], example: QR18149336524}
        qr_payload_hash: {type: [string, 'null']}
        amount: {type: [integer, 'null'], format: int64}
        paid_at: {type: [string, 'null'], format: date-time}
        recipient_name: {type: [string, 'null'], example: ИП "JAN-TAXI"}
        recipient_bin: {type: [string, 'null'], example: '000809500289'}
        payer_masked: {type: [string, 'null'], example: Е*** Б.}
        payment_method: {type: [string, 'null'], example: с Kaspi Gold}
        producer: {type: [string, 'null'], example: WeasyPrint 70.0}
        parse_status: {type: string, enum: [parsed, partial, unreadable]}
        flags:
          type: array
          description: |
            Parser findings. Blocking (no automatic crediting): `pdf_unreadable`, `incremental_update`,
            `object_redefined`, `trailing_data`, `structure_unexpected`, `xref_inconsistent`,
            `header_unexpected`, `producer_unexpected`, `creator_present`, `moddate_present`,
            `xmp_metadata_present`, `page_count_unexpected`, `font_unexpected`, `text_undecodable`,
            `annotations_present`, `form_present`, `qr_mismatch`, `serial_ambiguous`,
            `serial_label_missing`, `serial_format_unexpected`, `amount_ambiguous`, `amount_fractional`,
            `status_missing`, `filename_serial_mismatch`. Informational: `qr_not_found`, `bin_missing`
            (the receipt still goes to review as `receipt_incomplete`), `status_kazakh`.
          items: {type: string}
        decision: {type: string, enum: [auto_confirmed, manual_review]}
        reasons:
          type: array
          items: {$ref: '#/components/schemas/ReceiptReviewReason'}
        created_at: {type: string, format: date-time}
    ReceiptReviewReason:
      type: string
      enum: [auto_confirm_disabled, receipt_unreadable, receipt_incomplete, receipt_inconsistent, tamper_suspected,
        recipient_mismatch, amount_mismatch, paid_before_topup, paid_in_future, receipt_too_old, daily_count_limit,
        daily_amount_limit]
    ReceiptUpload:
      type: object
      required: [file]
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          description: |
            A Kaspi receipt PDF (at most 5 MiB) or a JPEG, PNG or WebP image (at most
            `MAX_UPLOAD_BYTES`, 10 MiB). Other form parts are ignored. The file name of a Kaspi
            share ("receipt_QR….pdf") is cross-checked with the receipt number.
    ReconciliationMismatch:
      type: object
      required: [wallet_id, driver, balance, reserved, ledger_balance, ledger_reserved, balance_diff, reserved_diff, active_reservations, reasons]
      properties:
        wallet_id: {type: string, format: uuid}
        driver: {$ref: '#/components/schemas/DriverRef'}
        balance: {type: integer, format: int64, description: Stored wallet balance.}
        reserved: {type: integer, format: int64}
        ledger_balance: {type: integer, format: int64, description: Sum of `balance_delta`.}
        ledger_reserved: {type: integer, format: int64, description: Sum of `reserved_delta`.}
        balance_diff: {type: integer, format: int64, description: '`balance - ledger_balance`.'}
        reserved_diff: {type: integer, format: int64, description: '`reserved - ledger_reserved`.'}
        active_reservations: {type: integer, format: int64, description: Sum of the wallet's active commission reservations.}
        reasons:
          type: array
          items:
            type: string
            enum: [balance_ne_ledger_sum, reserved_ne_ledger_sum, reserved_ne_active_reservations, wallet_ne_last_ledger_after]
    ReconciliationResult:
      type: object
      required: [checked_at, wallets_checked, ok, mismatches]
      properties:
        checked_at: {type: string, format: date-time}
        wallets_checked: {type: integer}
        ok: {type: boolean}
        mismatches:
          type: array
          items: {$ref: '#/components/schemas/ReconciliationMismatch'}
    RegistrationField:
      type: string
      description: Registration field addressed by corrections and `missing_fields`.
      enum: [avatar, first_name, last_name, phone, id_front, id_back, vehicle_class, vehicle_make_model, vehicle_color, vehicle_plate, vehicle_photos]
    RegistrationHistoryItem:
      type: object
      required: [action, from_status, to_status, comment, corrections, created_at]
      properties:
        action: {$ref: '#/components/schemas/ModerationAction'}
        from_status:
          oneOf:
            - $ref: '#/components/schemas/DriverStatus'
            - type: 'null'
        to_status:
          oneOf:
            - $ref: '#/components/schemas/DriverStatus'
            - type: 'null'
        comment: {type: [string, 'null']}
        corrections:
          type: array
          items: {$ref: '#/components/schemas/CorrectionItem'}
        created_at: {type: string, format: date-time}
    RegistrationVehicle:
      type: object
      required: [make, model, color, plate, plate_normalized, photos, vehicle_class, vehicle_class_name, seats, cargo_volume_l]
      properties:
        make: {type: string, maxLength: 40, description: Empty until entered.}
        model: {type: string, maxLength: 40}
        color: {type: string, maxLength: 30}
        plate: {type: string, maxLength: 20, description: Display form of the normalised plate (or the raw input while invalid; empty until entered).}
        plate_normalized: {type: [string, 'null'], example: 123ABC04}
        plate_kind:
          type: string
          enum: [current, legacy]
          description: Admin responses only, when a plate is set; `legacy` is the pre-2012 `L NNN LL(L)` format.
        vehicle_class: {type: [string, 'null'], pattern: '^[a-z_]{2,20}$', description: 'Class of the vehicle (§21); `null` until the driver chose one.', example: sedan}
        vehicle_class_name:
          description: Localized name of the class; `null` without a class.
          oneOf:
            - $ref: '#/components/schemas/LocalizedText'
            - type: 'null'
        seats: {type: [integer, 'null'], minimum: 1, maximum: 60, description: Passenger seats (1..class seats_max)., example: 4}
        cargo_volume_l: {type: [integer, 'null'], minimum: 0, maximum: 100000, description: Cargo space in litres., example: 400}
        photos:
          type: array
          description: Current vehicle photos in display order (`main`, `back`, `side`, `plate`, then `extra`).
          items: {$ref: '#/components/schemas/VehiclePhoto'}
    RouteLeg:
      type: object
      description: Leg between two consecutive stops.
      required: [distance_m, duration_s]
      properties:
        distance_m: {type: integer, minimum: 0, example: 1840}
        duration_s: {type: integer, minimum: 0, example: 260}
    RoutePreviewRequest:
      type: object
      additionalProperties: false
      required: [category, stops]
      properties:
        category: {$ref: '#/components/schemas/OrderCategory'}
        stops:
          type: array
          description: Pickup first, destination last, up to 3 intermediate stops in between (`routing.max_points` total). Every point inside Kazakhstan.
          minItems: 2
          maxItems: 5
          items: {$ref: '#/components/schemas/StopInput'}
        passenger_count: {type: integer, minimum: 1, maximum: 15, default: 1, description: 'Taxi only (`422 not_allowed` otherwise). Only classes whose `seats_max` covers it are offered.'}
        cargo_size:
          description: 'Parcel/other only (`422 not_allowed` for taxi); default `s`. Only cargo-capable classes whose default volume covers it are offered.'
          allOf:
            - $ref: '#/components/schemas/CargoSize'
      example:
        category: taxi
        stops:
          - {lat: 48.8264, lon: 58.1442, address: 'Жиенқали Тілепбергенов көшесі, 12', address_details: 2-кіреберіс}
          - {lat: 48.8291, lon: 58.1504, address: Теміржол вокзалы}
    RouteQuote:
      type: object
      required: [quote_id, expires_at, category, city, stops, distance_m, duration_s, legs, geometry, bbox, fare, currency, commission_bps, payment_methods, vehicle_class, passenger_count, cargo_size, options, locality, tariff_region]
      properties:
        locality: {type: [string, 'null'], minLength: 1, maxLength: 120, description: 'Real settlement of pickup A from reverse geocoding (city, town or village, else the district); `null` when unknown. Never coordinates.', example: Алматы}
        tariff_region: {$ref: '#/components/schemas/TariffRegion'}
        quote_id: {type: string, format: uuid}
        expires_at: {type: string, format: date-time, description: The quote must be used by this time (`422 quote_expired` after).}
        category: {$ref: '#/components/schemas/OrderCategory'}
        city: {$ref: '#/components/schemas/CityRef'}
        stops:
          type: array
          items: {$ref: '#/components/schemas/QuoteStop'}
        distance_m: {type: integer, minimum: 0}
        duration_s: {type: integer, minimum: 0}
        legs:
          type: array
          description: One leg per pair of consecutive stops.
          items: {$ref: '#/components/schemas/RouteLeg'}
        geometry: {$ref: '#/components/schemas/GeoJsonLineString'}
        bbox: {$ref: '#/components/schemas/BBox'}
        fare: {$ref: '#/components/schemas/FareOptions'}
        currency: {$ref: '#/components/schemas/Currency'}
        commission_bps: {type: integer, minimum: 0, maximum: 5000, example: 1000}
        vehicle_class: {$ref: '#/components/schemas/VehicleClassCode'}
        passenger_count: {type: [integer, 'null'], minimum: 1, maximum: 15}
        cargo_size:
          oneOf:
            - $ref: '#/components/schemas/CargoSize'
            - type: 'null'
        options:
          type: array
          minItems: 1
          description: |
            One quote per active vehicle class able to carry the request and priced in the city, in class
            display order. The top-level `quote_id`, `expires_at`, `vehicle_class`, `fare` and `commission_bps`
            repeat the first option. Create the order with the chosen option's `quote_id`.
          items: {$ref: '#/components/schemas/RouteQuoteOption'}
        payment_methods:
          type: array
          items: {$ref: '#/components/schemas/PaymentMethod'}
      example:
        quote_id: 6b7c8d9e-0f1a-4b2c-8d3e-4f5a6b7c8d9e
        expires_at: '2026-10-16T09:40:00Z'
        category: taxi
        city: {id: 5b1c7a2e-0d3f-4e8a-9b6c-1f2e3d4c5b6a, code: EMB, name: {kk: Ембі, ru: Эмба, en: Embi}}
        stops:
          - {seq: 0, kind: pickup, lat: 48.8264, lon: 58.1442, address: 'Жиенқали Тілепбергенов көшесі, 12', address_details: 2-кіреберіс}
          - {seq: 1, kind: destination, lat: 48.8291, lon: 58.1504, address: Теміржол вокзалы, address_details: null}
        distance_m: 1840
        duration_s: 260
        legs: [{distance_m: 1840, duration_s: 260}]
        geometry: {type: LineString, coordinates: [[58.1442, 48.8264], [58.1461, 48.8272], [58.1504, 48.8291]]}
        bbox: [58.1442, 48.8264, 58.1504, 48.8291]
        fare: {recommended: 800, min: 800, max: 1500, step: 50, options: [800, 850, 900, 950, 1000, 1050, 1100, 1150, 1200, 1250, 1300, 1350, 1400, 1450, 1500]}
        currency: KZT
        commission_bps: 1000
        payment_methods: [cash, bank_transfer]
    RouteSnapshot:
      type: object
      description: Route stored with the order (immutable). `geometry` and `bbox` are `null` only if the snapshot row is missing.
      required: [geometry, legs, bbox, distance_m, duration_s]
      properties:
        geometry:
          oneOf:
            - $ref: '#/components/schemas/GeoJsonLineString'
            - type: 'null'
        legs:
          type: array
          items: {$ref: '#/components/schemas/RouteLeg'}
        bbox:
          oneOf:
            - $ref: '#/components/schemas/BBox'
            - type: 'null'
        distance_m: {type: integer, minimum: 0, example: 1840}
        duration_s: {type: integer, minimum: 0, example: 260}
    ServiceType:
      type: string
      description: Derived from the category (`taxi` → `passenger`, `parcel`/`other` → `delivery`).
      enum: [passenger, delivery]
    SettingItem:
      type: object
      description: |
        Registered keys: `support.telegram_username`, `support.phone`, `support.hours`,
        `routing.max_points`, `commission.default_bps`, `driver.min_online_balance`,
        `driver.require_phone_verification`, `driver.online_idle_hours`, `topup.min_amount`,
        `topup.max_amount`, `topup.expiry_hours`, `topup.presets`, `delivery.prohibited_items`,
        `delivery.blocked_keywords`, `kaspi.payment_url`, `kaspi.recipient_name`,
        `kaspi.instructions`, `navigation.twogis_base_url`, `dispatch.*`, `topup.auto_*`,
        `company.*`, and the business rules v2 keys (§22): `commission.mode` (`fixed` | `percent`,
        default `fixed`), `commission.fixed_amount` (default 50; its `constraints.min/max` are the
        effective `commission.fixed_min..commission.fixed_max`, 50..100), `commission.fixed_min`
        and `commission.fixed_max` (read-only), `driver.welcome_bonus` (default 500; 0 = off),
        `orders.passenger_cancels_after_accept_per_day` (default 3, 0..100; 0 = no limit: how many
        driver-accepted orders a passenger may cancel within 24 hours before new orders are refused).
      required: [key, type, value, default, source, has_env_default, overrides_env, description, constraints, read_only, updated_at, updated_by]
      properties:
        key: {type: string, pattern: '^[a-z0-9_.]+$', example: topup.min_amount}
        type:
          type: string
          description: '`code_list` holds machine codes the apps translate; `localized_text` is `{kk, ru, en}`.'
          enum: [int, bool, string, url, localized_text, int_list, code_list, string_list]
        value: {description: Effective value (JSON of `type`).}
        default: {description: 'Default when no database row exists (the environment value when configured, else built-in).'}
        source: {type: string, enum: [database, env, default], description: Where `value` comes from.}
        has_env_default: {type: boolean, description: An environment variable can supply the default.}
        overrides_env: {type: boolean, description: A database row overrides an environment-backed default.}
        description: {$ref: '#/components/schemas/LocalizedText'}
        constraints:
          type: object
          description: Validation limits; absent members do not apply.
          properties:
            min: {type: integer, format: int64, description: '`int` / `int_list` only.'}
            max: {type: integer, format: int64}
            min_length: {type: integer}
            max_length: {type: integer}
            max_items: {type: integer}
            required: {type: boolean}
        read_only: {type: boolean, description: 'Shown but not changeable through `PATCH /admin/settings` (`read_only`).'}
        updated_at: {type: [string, 'null'], format: date-time}
        updated_by: {type: [string, 'null'], format: uuid, description: Admin id of the last change; `null` for defaults and system writes.}
    SettingList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/SettingItem'}
    SettingsUpdateRequest:
      type: object
      description: Setting key → new value (JSON of the setting's `type`), or `null` to reset to the default.
      minProperties: 1
      additionalProperties: true
      example: {topup.min_amount: 1000, support.phone: '+77001234567', support.hours: null}
    Stop:
      type: object
      required: [id, seq, kind, lat, lon, address, address_details, completed_at]
      properties:
        id: {type: string, format: uuid}
        seq: {type: integer, minimum: 0, maximum: 4, description: 0 is the pickup.}
        kind: {$ref: '#/components/schemas/StopKind'}
        lat: {type: number, example: 48.8264}
        lon: {type: number, example: 58.1442}
        address: {type: string, maxLength: 200}
        address_details: {type: [string, 'null'], maxLength: 120, description: 'Entrance, floor, landmark.'}
        completed_at: {type: [string, 'null'], format: date-time}
    StopInput:
      type: object
      additionalProperties: false
      required: [lat, lon, address]
      properties:
        lat: {type: number, minimum: -90, maximum: 90, example: 48.8264}
        lon: {type: number, minimum: -180, maximum: 180, example: 58.1442}
        address:
          type: string
          description: Display address from search / reverse geocoding (or the formatted coordinates).
          minLength: 1
          maxLength: 200
          example: 'Жиенқали Тілепбергенов көшесі, 12'
        address_details: {type: [string, 'null'], maxLength: 120, description: 'Entrance, floor or landmark; free-text rules apply. Empty or `null` means none.', example: 2-кіреберіс}
    StopKind:
      type: string
      enum: [pickup, intermediate, destination]
    StopSummary:
      type: object
      required: [seq, kind, lat, lon, address]
      properties:
        seq: {type: integer, minimum: 0, maximum: 4}
        kind: {$ref: '#/components/schemas/StopKind'}
        lat: {type: number, example: 48.8264}
        lon: {type: number, example: 58.1442}
        address: {type: string, example: 'Жиенқали Тілепбергенов көшесі, 12'}
    Tariff:
      type: object
      description: |
        Immutable tariff version. A quote's minimum fare is `base_fare + ceil(per_km × km) +
        ceil(per_minute × minutes) + extra_stop_fee × intermediate stops + Σ extra_fees.amount`,
        rounded up to `fare_step` and clamped to `[min_fare, max_fare]`.
      required: [id, city_id, category, version, is_active, min_fare, max_fare, fare_step, base_fare, per_km, per_minute, extra_stop_fee, extra_fees, commission_bps, created_by, created_at, vehicle_class]
      properties:
        id: {type: string, format: uuid}
        city_id: {type: string, format: uuid}
        category: {$ref: '#/components/schemas/OrderCategory'}
        vehicle_class: {$ref: '#/components/schemas/VehicleClassCode'}
        version: {type: integer, minimum: 1}
        is_active: {type: boolean}
        min_fare: {type: integer, example: 500}
        max_fare: {type: integer, example: 1500}
        fare_step: {type: integer, example: 50}
        base_fare: {type: integer, example: 500}
        per_km: {type: integer, example: 0}
        per_minute: {type: integer, example: 0}
        extra_stop_fee: {type: integer, example: 0}
        extra_fees:
          type: array
          items: {$ref: '#/components/schemas/ExtraFee'}
        commission_bps: {type: integer, minimum: 0, maximum: 5000, example: 1000}
        created_by:
          oneOf:
            - $ref: '#/components/schemas/AdminRef'
            - type: 'null'
        created_at: {type: string, format: date-time}
    TariffCreateRequest:
      type: object
      additionalProperties: false
      required: [city_id, category, min_fare, max_fare, fare_step]
      properties:
        city_id: {type: string, format: uuid}
        category: {$ref: '#/components/schemas/OrderCategory'}
        vehicle_class: {type: string, pattern: '^[a-z_]{2,20}$', default: sedan, description: 'Vehicle class the tariff prices (default `sedan`). Must exist; taxi needs a passenger-capable class, parcel/other a cargo-capable one (`422 vehicle_class not_found / not_allowed`). Versions and the active version are per city × category × class.'}
        min_fare: {type: integer, format: int64, minimum: 1, maximum: 10000000, description: Multiple of `fare_step`.}
        max_fare: {type: integer, format: int64, minimum: 1, maximum: 10000000, description: 'Multiple of `fare_step`, ≥ `min_fare`.'}
        fare_step: {type: integer, format: int64, minimum: 1, maximum: 10000000, description: At most 500 options from `min_fare` to `max_fare`.}
        base_fare: {type: [integer, 'null'], format: int64, minimum: 0, maximum: 10000000, default: 0}
        per_km: {type: [integer, 'null'], format: int64, minimum: 0, maximum: 10000000, default: 0}
        per_minute: {type: [integer, 'null'], format: int64, minimum: 0, maximum: 10000000, default: 0}
        extra_stop_fee: {type: [integer, 'null'], format: int64, minimum: 0, maximum: 10000000, default: 0}
        extra_fees:
          type: [array, 'null']
          maxItems: 10
          items: {$ref: '#/components/schemas/ExtraFeeInput'}
        commission_bps: {type: [integer, 'null'], minimum: 0, maximum: 5000, description: Defaults to the setting `commission.default_bps`.}
    TariffList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Tariff'}
    TariffRegion:
      type: object
      description: |
        The city or region whose tariff priced the order (`cities.Resolve` on pickup A): the city
        owning the smallest active zone covering the pickup, else the nationwide default region
        `KAZ`. Shown separately from `locality` (the real settlement of the pickup).
      required: [code, name]
      properties:
        code: {type: string, pattern: '^[A-Z]{3}$', example: KAZ}
        name: {$ref: '#/components/schemas/LocalizedText'}
      example: {code: KAZ, name: {kk: Қазақстан, ru: Казахстан, en: Kazakhstan}}
    TelegramAuthRequest:
      type: object
      additionalProperties: false
      required: [init_data]
      properties:
        init_data:
          type: string
          description: Raw `Telegram.WebApp.initData` query string, unmodified.
          minLength: 1
          maxLength: 8192
          example: 'query_id=AAH...&user=%7B%22id%22%3A784512369%7D&auth_date=1760606400&signature=...&hash=...'
    TopUp:
      type: object
      required: [id, number, reference, amount, verified_amount, currency, status, provider, payment, driver_payment_reference, driver_note, has_receipt, can_upload_receipt, can_submit, can_cancel, created_at, driver_reported_paid_at, expires_at, confirmed_at, rejected_at, rejected_reason, refunded_at, receipt]
      properties:
        id: {type: string, format: uuid}
        number: {type: integer, format: int64, example: 123}
        reference:
          type: string
          description: '`<DRIVERCODE>-TOPUP-<6-digit number>`; the driver writes it in the Kaspi payment message.'
          pattern: '^[A-Z]{3}[0-9]{3,}-TOPUP-[0-9]{6,}$'
          example: EMB001-TOPUP-000123
        amount: {type: integer, format: int64, minimum: 1, description: Requested amount., example: 2000}
        verified_amount:
          type: [integer, 'null']
          format: int64
          description: Amount actually credited (set on confirmation; may differ from `amount`).
        currency: {$ref: '#/components/schemas/Currency'}
        status: {$ref: '#/components/schemas/TopUpStatus'}
        provider: {$ref: '#/components/schemas/PaymentProvider'}
        payment: {$ref: '#/components/schemas/TopUpPaymentInstructions'}
        driver_payment_reference: {type: [string, 'null'], maxLength: 100, description: Reference the driver entered when submitting.}
        driver_note: {type: [string, 'null'], maxLength: 300}
        has_receipt: {type: boolean}
        can_upload_receipt: {type: boolean}
        can_submit: {type: boolean}
        can_cancel: {type: boolean}
        created_at: {type: string, format: date-time}
        driver_reported_paid_at: {type: [string, 'null'], format: date-time, description: When the driver pressed "I paid".}
        expires_at: {type: string, format: date-time, description: Unpaid top-ups expire at this time.}
        confirmed_at: {type: [string, 'null'], format: date-time}
        rejected_at: {type: [string, 'null'], format: date-time}
        rejected_reason: {type: [string, 'null'], maxLength: 300, description: '`duplicate_receipt` when the receipt was used before.'}
        refunded_at: {type: [string, 'null'], format: date-time}
        receipt:
          description: Check of the latest uploaded receipt (null without one).
          oneOf:
            - $ref: '#/components/schemas/DriverReceiptCheck'
            - type: 'null'
      example:
        id: 8e9f0a1b-2c3d-4e4f-9a5b-6c7d8e9f0a1b
        number: 123
        reference: EMB001-TOPUP-000123
        amount: 2000
        verified_amount: null
        currency: KZT
        status: created
        provider: kaspi_manual
        payment:
          method: kaspi_manual
          url: null
          recipient_name: ЖШС «Jan Taxi»
          recipient_phone: null
          instructions: Kaspi арқылы 2 000 ₸ төлеңіз және хабарламаға EMB001-TOPUP-000123 кодын жазыңыз. Төлегеннен кейін «Төледім» батырмасын басыңыз.
          reference: EMB001-TOPUP-000123
          amount: 2000
          currency: KZT
        driver_payment_reference: null
        driver_note: null
        has_receipt: false
        can_upload_receipt: true
        can_submit: true
        can_cancel: true
        created_at: '2026-10-16T10:00:00Z'
        driver_reported_paid_at: null
        expires_at: '2026-10-18T10:00:00Z'
        confirmed_at: null
        rejected_at: null
        rejected_reason: null
        refunded_at: null
    TopUpCreateRequest:
      type: object
      additionalProperties: false
      required: [amount, idempotency_key]
      properties:
        amount:
          type: integer
          format: int64
          description: Whole tenge within `topup.min_amount`..`topup.max_amount` (`422` with `too_small` / `too_large` and `details {min, max}`).
          example: 2000
        idempotency_key: {type: string, format: uuid, description: Client-generated per attempt; the nil UUID is invalid.}
    TopUpCursorList:
      allOf:
        - $ref: '#/components/schemas/CursorMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: {$ref: '#/components/schemas/TopUp'}
    TopUpEvent:
      type: object
      required: [id, from_status, to_status, actor_type, actor_id, note, created_at]
      properties:
        id: {type: integer, format: int64}
        from_status:
          oneOf:
            - $ref: '#/components/schemas/TopUpStatus'
            - type: 'null'
        to_status: {$ref: '#/components/schemas/TopUpStatus'}
        actor_type: {type: string, enum: [driver, admin, system, provider]}
        actor_id: {type: [string, 'null'], format: uuid}
        note: {type: [string, 'null']}
        created_at: {type: string, format: date-time}
    TopUpPaymentInstructions:
      type: object
      description: How to pay; rendered in the driver's language.
      required: [method, url, recipient_name, recipient_phone, instructions, reference, amount, currency]
      properties:
        method: {$ref: '#/components/schemas/PaymentProvider'}
        url: {type: [string, 'null'], description: Kaspi payment link when configured.}
        recipient_name: {type: string}
        recipient_phone: {type: [string, 'null'], description: Always `null` for `kaspi_manual` (no setting holds a recipient phone).}
        instructions: {type: string, description: 'States the exact amount and the reference to paste into the payment message, plus any configured text.'}
        reference: {type: string, description: Text to put in the payment message.}
        amount: {type: integer, format: int64}
        currency: {$ref: '#/components/schemas/Currency'}
    TopUpRefundRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: {type: string, minLength: 1, maxLength: 300}
    TopUpRejectRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 300
          description: Shown to the driver.
          example: Kaspi-де бұл кодпен төлем табылмады
    TopUpStatus:
      type: string
      description: |
        `created` → `pending_verification` (driver says paid) → `confirmed` (credited) | `rejected`;
        `created` → `expired` (timeout or driver cancel); `confirmed` → `refunded`.
      enum: [created, pending_verification, confirmed, rejected, expired, refunded]
    TopUpSubmitRequest:
      type: object
      additionalProperties: false
      properties:
        payment_reference:
          type: [string, 'null']
          maxLength: 100
          description: Optional Kaspi receipt / transaction number as the driver sees it (a hint for finance, not trusted).
        note: {type: [string, 'null'], maxLength: 300, example: '10:05-те Kaspi Gold картасынан төледім'}
    UploadKind:
      type: string
      enum: [avatar, id_front, id_back, vehicle_main, vehicle_back, vehicle_side, vehicle_plate, vehicle_extra]
    ValidationFields:
      type: object
      description: |
        Field → reason. Keys are request field names; nested fields use dots and array indexes
        (`vehicle.plate`, `stops.1.address`).
      additionalProperties: {$ref: '#/components/schemas/FieldReason'}
      example: {comment: too_long, vehicle.plate: invalid}
    Vehicle:
      type: object
      required: [make, model, color, plate]
      properties:
        make: {type: string, example: Toyota}
        model: {type: string, example: Camry}
        color: {type: string, example: Ақ}
        plate: {type: string, description: Display form of the normalised plate., example: 123 ABC 04}
        vehicle_class: {type: [string, 'null'], pattern: '^[a-z_]{2,20}$', description: 'Class of the vehicle (§21); `null` until the driver chose one.', example: sedan}
        vehicle_class_name:
          description: Localized name of the class; `null` without a class.
          oneOf:
            - $ref: '#/components/schemas/LocalizedText'
            - type: 'null'
        seats: {type: [integer, 'null'], minimum: 1, maximum: 60, description: Passenger seats (1..class seats_max)., example: 4}
        cargo_volume_l: {type: [integer, 'null'], minimum: 0, maximum: 100000, description: Cargo space in litres., example: 400}
    VehicleInput:
      type: object
      additionalProperties: false
      required: [make, model, color, plate]
      properties:
        make: {type: string, maxLength: 40, example: Toyota}
        model: {type: string, maxLength: 40, example: Camry}
        color: {type: string, maxLength: 30, example: Ақ}
        plate:
          type: string
          maxLength: 20
          description: |
            Any common spelling; normalised (uppercase, spaces and dashes removed, Cyrillic
            look-alikes → Latin) and validated against the current format
            `^\d{3}[A-Z]{2,3}(0[1-9]|1\d|20)$` or the legacy format `^[A-Z]\d{3}[A-Z]{2,3}$`.
          example: 123 АВС 04
        vehicle_class:
          type: string
          pattern: '^[a-z_]{2,20}$'
          description: |
            Active vehicle class code from `GET /public/config` `vehicle_classes` (`422 vehicle.vehicle_class`
            `not_found` / `not_allowed` for an unknown or deactivated class). Omitted: the stored class is kept.
            Required before submission (`missing_fields` lists `vehicle_class`). In `changes_requested` the class,
            seats and cargo volume change only when `vehicle_class` was flagged.
          example: minivan
        seats:
          type: integer
          minimum: 1
          maximum: 60
          description: 'Passenger seats, 1..class `seats_max` (`422 vehicle.seats too_large` with `details.seats_max`). Omitted: kept, or the class default when the class changes.'
          example: 7
        cargo_volume_l:
          type: integer
          minimum: 0
          maximum: 100000
          description: 'Cargo space in litres. Omitted: kept, or the class default when the class changes.'
          example: 800
    VehiclePhoto:
      type: object
      description: '`id` is the file id (use it with `DELETE /driver/registration/files/{fileId}` for extra photos).'
      required: [id, kind, url, width, height, created_at]
      properties:
        id: {type: string, format: uuid}
        kind: {$ref: '#/components/schemas/VehiclePhotoKind'}
        url: {type: string}
        width: {type: integer, minimum: 1}
        height: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
    VehiclePhotoKind:
      type: string
      enum: [main, back, side, plate, extra]
    VehicleClassCode:
      type: string
      pattern: '^[a-z_]{2,20}$'
      description: 'Vehicle class code (§21). Seeded: `sedan`, `universal`, `minivan`, `microbus`, `cargo_van`, `truck`; admins may add more.'
      example: sedan
    CancelReasonCode:
      type: string
      description: Why the passenger cancelled (§22.3); `null` on orders cancelled by others or before v2.
      enum: [long_wait, driver_issue, vehicle_issue, changed_plans, other]
    CargoSize:
      type: string
      enum: [s, m, l, xl]
      description: 'Cargo size of a parcel/other order: s = 10 L, m = 60 L, l = 400 L, xl = 1500 L.'
    VehicleClassIcon:
      type: string
      enum: [sedan, universal, minivan, microbus, cargo_van, truck]
    VehicleClass:
      type: object
      description: Vehicle class (body type) as administered (§21.1).
      required: [code, name, examples, seats_default, seats_max, cargo_volume_l_default, passenger_capable, cargo_capable, serves, icon, sort, is_active, created_at, updated_at]
      properties:
        code: {$ref: '#/components/schemas/VehicleClassCode'}
        name: {$ref: '#/components/schemas/LocalizedText'}
        examples: {type: string, maxLength: 80, example: 'Toyota Alphard, Toyota Sienna'}
        seats_default: {type: integer, minimum: 1, example: 7}
        seats_max: {type: integer, minimum: 1, maximum: 60, example: 8}
        cargo_volume_l_default: {type: integer, minimum: 0, maximum: 100000, example: 800}
        passenger_capable: {type: boolean, description: May take taxi orders.}
        cargo_capable: {type: boolean, description: May take parcel/other orders.}
        serves:
          type: array
          description: Class codes whose orders vehicles of this class may take; always starts with the class itself.
          items: {$ref: '#/components/schemas/VehicleClassCode'}
          example: [universal, sedan]
        icon: {$ref: '#/components/schemas/VehicleClassIcon'}
        sort: {type: integer, minimum: 0, maximum: 1000}
        is_active: {type: boolean, description: Inactive classes are not offered to passengers nor selectable at registration; existing vehicles keep them.}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    VehicleClassList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/VehicleClass'}
    VehicleClassCreateRequest:
      type: object
      additionalProperties: false
      required: [code, name, seats_default, seats_max, cargo_volume_l_default, passenger_capable, cargo_capable, icon]
      properties:
        code: {$ref: '#/components/schemas/VehicleClassCode'}
        name: {$ref: '#/components/schemas/LocalizedNameInput'}
        examples: {type: string, maxLength: 80}
        seats_default: {type: integer, minimum: 1, maximum: 60, description: '≤ seats_max (`too_large`).'}
        seats_max: {type: integer, minimum: 1, maximum: 60}
        cargo_volume_l_default: {type: integer, minimum: 0, maximum: 100000}
        passenger_capable: {type: boolean}
        cargo_capable: {type: boolean, description: 'At least one capability is required (`one_required`).'}
        serves:
          type: array
          maxItems: 10
          description: 'Existing class codes (`serves.N not_found`); the class itself is always added.'
          items: {$ref: '#/components/schemas/VehicleClassCode'}
        icon: {$ref: '#/components/schemas/VehicleClassIcon'}
        sort: {type: integer, minimum: 0, maximum: 1000, default: 100}
        is_active: {type: boolean, default: true}
    VehicleClassUpdateRequest:
      type: object
      additionalProperties: false
      description: Partial update; omitted fields keep their value. `code` is immutable (`immutable`).
      properties:
        name: {$ref: '#/components/schemas/LocalizedNameInput'}
        examples: {type: string, maxLength: 80}
        seats_default: {type: integer, minimum: 1, maximum: 60}
        seats_max: {type: integer, minimum: 1, maximum: 60}
        cargo_volume_l_default: {type: integer, minimum: 0, maximum: 100000}
        passenger_capable: {type: boolean}
        cargo_capable: {type: boolean}
        serves:
          type: array
          maxItems: 10
          items: {$ref: '#/components/schemas/VehicleClassCode'}
        icon: {$ref: '#/components/schemas/VehicleClassIcon'}
        sort: {type: integer, minimum: 0, maximum: 1000}
        is_active: {type: boolean}
    PublicVehicleClass:
      type: object
      required: [code, name, examples, icon, seats_default, seats_max, cargo_volume_l_default, passenger_capable, cargo_capable]
      properties:
        code: {$ref: '#/components/schemas/VehicleClassCode'}
        name: {$ref: '#/components/schemas/LocalizedText'}
        examples: {type: string, example: 'Toyota Camry, Hyundai Sonata'}
        icon: {$ref: '#/components/schemas/VehicleClassIcon'}
        seats_default: {type: integer, example: 4}
        seats_max: {type: integer, example: 4}
        cargo_volume_l_default: {type: integer, example: 400}
        passenger_capable: {type: boolean}
        cargo_capable: {type: boolean}
    RouteQuoteOption:
      type: object
      description: The quote of one vehicle class for the previewed route.
      required: [vehicle_class, name, examples, icon, seats_max, cargo_volume_l, quote_id, expires_at, fare, commission_bps, tariff_region, eta_s]
      properties:
        vehicle_class: {$ref: '#/components/schemas/VehicleClassCode'}
        name: {$ref: '#/components/schemas/LocalizedText'}
        examples: {type: string}
        icon: {$ref: '#/components/schemas/VehicleClassIcon'}
        seats_max: {type: integer, example: 8}
        cargo_volume_l: {type: integer, description: The class default cargo volume in litres., example: 800}
        quote_id: {type: string, format: uuid}
        expires_at: {type: string, format: date-time}
        fare: {$ref: '#/components/schemas/FareOptions'}
        commission_bps: {type: integer, minimum: 0, maximum: 5000}
        tariff_region:
          allOf: [{$ref: '#/components/schemas/TariffRegion'}]
          description: The city or nationwide region (`KAZ`) whose tariff priced this class.
        eta_s:
          type: [integer, 'null']
          description: |
            Coarse pickup estimate from the nearest free online driver whose vehicle fits, in whole 5-minute steps
            (300, 600, …). It must not reveal where drivers are: the pickup is snapped to a ~500 m grid, each
            driver's position is shifted by a secret offset of up to 500 m that changes hourly, and only drivers
            whose shifted position is inside the base dispatch radius count (1 minute plus 2 minutes per km, then
            rounded up to 5 minutes). `null` when no such driver is near.
          example: 300
    Wallet:
      type: object
      required: [balance, reserved, available, currency, min_online_balance, updated_at]
      properties:
        balance: {type: integer, format: int64, minimum: 0, description: Money the platform holds for the driver., example: 2000}
        reserved: {type: integer, format: int64, minimum: 0, description: 'Part of the balance held for the commission of an order accepted before business rules v2 (since v2 the commission is charged at acceptance, so this is normally 0).', example: 0}
        available: {type: integer, format: int64, minimum: 0, description: '`balance - reserved`.', example: 1920}
        currency: {$ref: '#/components/schemas/Currency'}
        min_online_balance: {type: integer, format: int64, description: Minimum available balance to go online., example: 50}
        updated_at: {type: string, format: date-time}
    WelcomeBonus:
      type: object
      required: [amount, granted_at]
      properties:
        amount: {type: integer, format: int64, example: 500}
        granted_at: {type: string, format: date-time}
    WalletAdjustmentRequest:
      type: object
      additionalProperties: false
      required: [amount, reason, idempotency_key]
      properties:
        amount:
          type: integer
          format: int64
          minimum: -10000000
          maximum: 10000000
          not: {const: 0}
          description: Signed KZT; positive credits, negative debits.
          example: 500
        reason: {type: string, minLength: 1, maxLength: 300}
        idempotency_key: {type: string, format: uuid, description: The nil UUID is invalid.}
    WalletAdjustmentResult:
      type: object
      required: [wallet, entry]
      properties:
        wallet: {$ref: '#/components/schemas/Wallet'}
        entry: {$ref: '#/components/schemas/AdminLedgerEntry'}
    WalletReservation:
      type: object
      required: [id, amount, status, created_at, closed_at]
      properties:
        id: {type: string, format: uuid}
        amount: {type: integer, format: int64}
        status: {type: string, enum: [active, settled, released]}
        created_at: {type: string, format: date-time}
        closed_at: {type: [string, 'null'], format: date-time}
    WebhookAck:
      type: object
      required: [received]
      properties:
        received: {type: boolean, const: true}
    Zone:
      type: object
      required: [id, city_id, name, is_active, geometry, area_km2, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        city_id: {type: string, format: uuid}
        name: {type: string, example: Ембі — 15 км}
        is_active: {type: boolean}
        geometry: {$ref: '#/components/schemas/GeoJsonMultiPolygon'}
        area_km2: {type: number, minimum: 0, description: Geodesic area in square kilometres.}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ZoneCreateRequest:
      type: object
      additionalProperties: false
      required: [name, geometry]
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        geometry:
          oneOf:
            - $ref: '#/components/schemas/GeoJsonPolygon'
            - $ref: '#/components/schemas/GeoJsonMultiPolygon'
        is_active: {type: [boolean, 'null'], default: true}
    ZoneList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Zone'}
    ZoneUpdateRequest:
      type: object
      additionalProperties: false
      description: Partial update; omitted fields keep their value.
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        geometry:
          oneOf:
