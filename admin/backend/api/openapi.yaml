          items: {$ref: '#/components/schemas/DriverApplication'}
        moderation_events:
          type: array
          description: Newest first.
          items: {$ref: '#/components/schemas/ModerationEvent'}
        wallet:
          description: '`null` until the wallet exists (created with the profile on the first `PUT /driver/registration`; ensured again on approval).'
          oneOf:
            - $ref: '#/components/schemas/Wallet'
            - type: 'null'
        stats: {$ref: '#/components/schemas/DriverStats'}
        last_location:
          oneOf:
            - $ref: '#/components/schemas/DriverLastLocation'
            - type: 'null'
        active_order:
          oneOf:
            - $ref: '#/components/schemas/OrderRef'
            - type: 'null'
        rating: {type: [number, 'null'], minimum: 1, maximum: 5}
        rating_count: {type: integer, minimum: 0}
        completed_trips: {type: integer, minimum: 0}
        submitted_at: {type: [string, 'null'], format: date-time}
        approved_at: {type: [string, 'null'], format: date-time}
        suspended_at: {type: [string, 'null'], format: date-time}
        suspended_reason: {type: [string, 'null']}
        pd_consent_at: {type: [string, 'null'], format: date-time}
        pd_consent_version: {type: [string, 'null']}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    AdminDriverListItem:
      type: object
