        '204':
          description: Deleted.
        '401': {$ref: '#/components/responses/AdminUnauthorized'}
        '403': {$ref: '#/components/responses/AdminForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  # ----------------------------------------------------------- admin-tariffs
  /admin/tariffs:
    get:
      operationId: adminListTariffs
      tags: [admin-tariffs]
      summary: List tariffs
      description: |
        Active tariffs by default; `include_inactive=true` adds earlier versions. Ordered by city,
        category (`taxi`, `parcel`, `other`), vehicle class (class display order) and version (newest
        first). Not paged. `fields`: `city_id` / `category` / `vehicle_class` / `include_inactive` = `invalid`.
      x-jantaxi-permission: dashboard.view
      security: [{adminSession: []}]
      parameters:
        - $ref: '#/components/parameters/CityIdQuery'
        - name: category
          in: query
          schema: {$ref: '#/components/schemas/OrderCategory'}
        - name: vehicle_class
          in: query
          schema: {$ref: '#/components/schemas/VehicleClassCode'}
        - name: include_inactive
          in: query
          description: Any value accepted by Go `strconv.ParseBool`.
          schema: {type: boolean, default: false}
      responses:
        '200':
          description: Tariffs.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TariffList'}
        '401': {$ref: '#/components/responses/AdminUnauthorized'}
        '403': {$ref: '#/components/responses/AdminForbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
    post:
      operationId: adminCreateTariffVersion
      tags: [admin-tariffs]
      summary: Publish a new tariff version
      description: |
        Tariffs are immutable: publishing creates version N+1 for the city, category and vehicle
        class (`vehicle_class`, default `sedan`) and deactivates that class's previous version in the
        same transaction (concurrent publishes are
        serialised; a lost race is `409 conflict`). Existing quotes and orders keep the version
        they were priced with. `404` for an unknown city. `commission_bps` defaults to the
        setting `commission.default_bps`. `fields`: `city_id` / `category` = `required |
        invalid`; `min_fare` / `max_fare` / `fare_step` = `required | too_small | too_large`
        (1..10000000); `base_fare` / `per_km` / `per_minute` / `extra_stop_fee` = `too_small |
        too_large` (0..10000000); `max_fare = too_small` below `min_fare`; `min_fare` /
        `max_fare` = `invalid` when not a multiple of `fare_step`; `fare_step = too_small` when
        it yields more than 500 fare options; `commission_bps` = `too_small | too_large`
        (0..5000); `extra_fees = too_many` (more than 10); `extra_fees.N.code` = `required |
        invalid | duplicate`; `extra_fees.N.name` = `required`;
        `extra_fees.N.name.<lang>` = `required | too_long | invalid` (≤60);
        `extra_fees.N.amount` = `required | too_small | too_large`; `vehicle_class` = `required |
        invalid | not_found | not_allowed` (a taxi tariff needs a passenger-capable class, a
        parcel/other tariff a cargo-capable one). Audit-logged (`tariff.create` with before/after).
      x-jantaxi-permission: config.manage
      security: [{adminSession: [], csrfHeader: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TariffCreateRequest'}
      responses:
        '201':
          description: New active version.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Tariff'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/AdminUnauthorized'}
        '403': {$ref: '#/components/responses/AdminForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: '`conflict`: a tariff version was published concurrently.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              example: {error: {code: conflict, message: a tariff version was published concurrently}}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /admin/tariffs/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      operationId: adminGetTariff
      tags: [admin-tariffs]
      summary: One tariff version
      description: Any version, active or not. `404` for an unknown id.
      x-jantaxi-permission: dashboard.view
      security: [{adminSession: []}]
      responses:
        '200':
          description: Tariff version.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Tariff'}
        '401': {$ref: '#/components/responses/AdminUnauthorized'}
        '403': {$ref: '#/components/responses/AdminForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /admin/vehicle-classes:
    get:
      operationId: adminListVehicleClasses
      tags: [admin-tariffs]
      summary: List vehicle classes
      description: Every class, active or not, in display order (`sort`, then `code`). Not paged.
      x-jantaxi-permission: config.manage
      security: [{adminSession: []}]
      responses:
        '200':
          description: Vehicle classes.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VehicleClassList'}
        '401': {$ref: '#/components/responses/AdminUnauthorized'}
        '403': {$ref: '#/components/responses/AdminForbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
    post:
      operationId: adminCreateVehicleClass
      tags: [admin-tariffs]
      summary: Create a vehicle class
      description: |
        Adds a class (ARCHITECTURE §21). Price it with `POST /admin/tariffs` (`vehicle_class`) before
        passengers are offered it. `409 vehicle_class_exists` for a taken code. `fields`: `code` =
        `required | invalid`; `name` = `required`; `name.<lang>` = `required | too_long` (≤40);
        `examples` = `too_long` (≤80); `seats_max` / `seats_default` = `required | too_small | too_large`
        (1..60, `seats_default` ≤ `seats_max`); `cargo_volume_l_default` = `required | too_small | too_large`
        (0..100000); `passenger_capable` / `cargo_capable` = `required`, both `one_required` when neither
        is true; `icon` = `required | invalid`; `serves` = `too_many`; `serves.N` = `invalid | not_found`;
        `sort` = `out_of_range` (0..1000). Audit-logged (`vehicle_class.create`).
      x-jantaxi-permission: config.manage
      security: [{adminSession: [], csrfHeader: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VehicleClassCreateRequest'}
      responses:
        '201':
          description: Created class.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VehicleClass'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/AdminUnauthorized'}
        '403': {$ref: '#/components/responses/AdminForbidden'}
        '409':
          description: '`vehicle_class_exists`: the code is taken.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              example: {error: {code: vehicle_class_exists, message: a vehicle class with this code already exists}}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /admin/vehicle-classes/{code}:
    parameters:
      - name: code
        in: path
        required: true
        schema: {$ref: '#/components/schemas/VehicleClassCode'}
    patch:
      operationId: adminUpdateVehicleClass
      tags: [admin-tariffs]
      summary: Update a vehicle class
      description: |
        Partial update with the create rules (`code` = `immutable`). Deactivating a class
        (`is_active=false`) stops offering it to passengers and at registration; vehicles that already
        have it keep it and keep receiving the orders their class serves. `404` for an unknown code.
        Audit-logged (`vehicle_class.update` with before/after).
      x-jantaxi-permission: config.manage
      security: [{adminSession: [], csrfHeader: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VehicleClassUpdateRequest'}
      responses:
        '200':
          description: Updated class.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VehicleClass'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/AdminUnauthorized'}
        '403': {$ref: '#/components/responses/AdminForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  # ---------------------------------------------------------- admin-settings
  /admin/settings:
    get:
      operationId: adminGetSettings
      tags: [admin-settings]
      summary: Runtime settings
      description: |
        Every registered setting with its effective value: the database row, else the
        environment default, else the built-in default (`source`). Secrets are never settings.
      x-jantaxi-permission: config.manage
      security: [{adminSession: []}]
      responses:
        '200':
          description: Settings.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SettingList'}
        '401': {$ref: '#/components/responses/AdminUnauthorized'}
        '403': {$ref: '#/components/responses/AdminForbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
    patch:
      operationId: adminUpdateSettings
      tags: [admin-settings]
      summary: Change settings
      description: |
        The body is a flat object `{"<key>": <value>, …}`; `null` resets a key to its default
        (the row is deleted). An empty object is `400`. Every key is validated against the
        registry before anything is written: `fields.<key>` = `unknown_setting`,
        `invalid_type`, `invalid`, `out_of_range`, `required`, `too_short`, `too_long`,
        `too_many`, `duplicate` or `incomplete` (localized text filled for only some
        languages). Top-up limits are checked together: `fields["topup.min_amount"] =
        greater_than_max`, `fields["topup.presets"] = out_of_range`. Read-only keys
        (`read_only: true`, e.g. `commission.fixed_min` / `commission.fixed_max`) answer
        `fields.<key> = read_only`. `commission.fixed_amount` must stay within
        `commission.fixed_min..commission.fixed_max` (50..100 KZT): `fields["commission.fixed_amount"]
        = out_of_range` with `details {min, max}` (§22.7). `driver.welcome_bonus` is any amount
        0..100000 (0 switches the welcome bonus off). All changes are written and audited
        (`settings.update` / `settings.reset`) in one transaction. Returns the full list.
      x-jantaxi-permission: config.manage
      security: [{adminSession: [], csrfHeader: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SettingsUpdateRequest'}
      responses:
        '200':
          description: All settings after the update.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SettingList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/AdminUnauthorized'}
        '403': {$ref: '#/components/responses/AdminForbidden'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  # ----------------------------------------------------- admin-notifications
  /admin/notification-templates:
    get:
      operationId: adminListNotificationTemplates
      tags: [admin-notifications]
      summary: Notification templates
      description: |
        Every template key in `kk`, `ru` and `en` (key order, then language), with the built-in
        default, any stored override, the parameters and the inline button.
      x-jantaxi-permission: config.manage
      security: [{adminSession: []}]
      responses:
        '200':
          description: Templates.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotificationTemplateList'}
        '401': {$ref: '#/components/responses/AdminUnauthorized'}
        '403': {$ref: '#/components/responses/AdminForbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /admin/notification-templates/{key}/{lang}:
    parameters:
      - $ref: '#/components/parameters/TemplateKeyPath'
      - $ref: '#/components/parameters/LangPath'
    put:
      operationId: adminUpsertNotificationTemplate
      tags: [admin-notifications]
      summary: Override a template text
      description: |
        Telegram HTML subset (`b`, `strong`, `i`, `em`, `u`, `ins`, `s`, `strike`, `del`,
        `code`, `pre`, `blockquote`, `tg-spoiler`, and `a` with only `href`), properly nested,
        with `{{name}}` placeholders from the template's `params`; every
        parameter value is HTML-escaped when rendered. The body is trimmed (CRLF → LF);
        `fields.body` = `required | too_long` (more than `max_body_length` = 3500 characters)
        `| invalid` with `details {reason, allowed_placeholders}` (unknown or malformed
        placeholder, unsupported or unclosed tag). An unknown key or language is `404`.
        Audit-logged.
      x-jantaxi-permission: config.manage
      security: [{adminSession: [], csrfHeader: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NotificationTemplateUpdateRequest'}
      responses:
        '200':
          description: Template.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotificationTemplate'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/AdminUnauthorized'}
        '403': {$ref: '#/components/responses/AdminForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422':
          description: '`validation_failed` on `body`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              example:
                error:
                  code: validation_failed
                  message: validation failed
                  fields: {body: invalid}
                  details: {reason: 'unknown placeholder {{fare}}', allowed_placeholders: [order_number, driver_name]}
        '429': {$ref: '#/components/responses/TooManyRequests'}
    delete:
      operationId: adminRevertNotificationTemplate
      tags: [admin-notifications]
      summary: Revert to the default text
      description: Removes the override (no-op when there is none); audit-logged when one existed. An unknown key or language is `404`.
      x-jantaxi-permission: config.manage
      security: [{adminSession: [], csrfHeader: []}]
      responses:
        '200':
          description: 'Template after reverting (`is_custom: false`).'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotificationTemplate'}
        '401': {$ref: '#/components/responses/AdminUnauthorized'}
        '403': {$ref: '#/components/responses/AdminForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /admin/notifications:
    get:
      operationId: adminListNotifications
      tags: [admin-notifications]
      summary: Telegram outbox
      description: |
        Outbox rows with delivery status and a summary of their attempts, newest first.
        `fields`: `status` / `bot` / `template` / `user_id` / `page` / `page_size` = `invalid`.
      x-jantaxi-permission: orders.manage
      security: [{adminSession: []}]
      parameters:
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/OutboxStatus'}
        - name: bot
          in: query
          schema: {$ref: '#/components/schemas/BotName'}
        - name: template
          in: query
          schema: {$ref: '#/components/schemas/NotificationTemplateKey'}
        - name: user_id
          in: query
          description: Recipient user id.
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Page of outbox rows, newest first.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OutboxPage'}
        '401': {$ref: '#/components/responses/AdminUnauthorized'}
        '403': {$ref: '#/components/responses/AdminForbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /admin/notifications/{id}/retry:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      operationId: adminRetryNotification
      tags: [admin-notifications]
      summary: Retry a failed notification
      description: |
        `dead` or `cancelled` → `pending` with the attempt counter reset; other statuses are
        `409 invalid_transition` with `details.status`. Audit-logged.
      x-jantaxi-permission: orders.manage
      security: [{adminSession: [], csrfHeader: []}]
      responses:
        '200':
          description: Requeued row.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OutboxItem'}
        '401': {$ref: '#/components/responses/AdminUnauthorized'}
        '403': {$ref: '#/components/responses/AdminForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: '`invalid_transition`: only dead or cancelled rows can be retried.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              example: {error: {code: invalid_transition, message: only dead or cancelled notifications can be retried, details: {status: sent}}}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  # ------------------------------------------------------------- admin-audit
  /admin/audit-logs:
    get:
      operationId: adminListAuditLogs
      tags: [admin-audit]
      summary: Audit log
      description: |
        Append-only record of admin actions, newest first. Secrets are redacted from
        `before`/`after`. `from`/`to` accept RFC 3339 or `YYYY-MM-DD` (UTC; a date in `to`
        includes the whole day). `fields`: `admin_id` / `from` / `to` / `page` / `page_size` =
        `invalid`, `entity_type` / `entity_id` / `action` = `too_long`, `to = before_from`.
      x-jantaxi-permission: audit.view
      security: [{adminSession: []}]
      parameters:
        - name: admin_id
          in: query
          schema: {type: string, format: uuid}
        - name: entity_type
          in: query
          schema: {type: string, maxLength: 64}
          example: driver
        - name: entity_id
          in: query
          schema: {type: string, maxLength: 128}
        - name: action
          in: query
          schema: {type: string, maxLength: 64}
          example: driver.approve
        - name: from
          in: query
          description: Inclusive lower bound (RFC 3339 or `YYYY-MM-DD`).
          schema: {type: string}
        - name: to
          in: query
          description: Exclusive upper bound (RFC 3339, or `YYYY-MM-DD` meaning the end of that day).
          schema: {type: string}
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Page of audit entries.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditLogPage'}
        '401': {$ref: '#/components/responses/AdminUnauthorized'}
        '403': {$ref: '#/components/responses/AdminForbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  # ---------------------------------------------------------------- internal
  # Internal listener only. Path keys carry the full /internal/v1 prefix and each path item
  # overrides `servers`, so they never resolve against the public /api/v1 base.
  /internal/v1/bots/{bot}/lease:
    servers:
      - url: http://api:8081
        description: Internal bot API listener (compose network only; never published or proxied).
    parameters:
      - $ref: '#/components/parameters/BotPath'
      - $ref: '#/components/parameters/BotHeader'
    post:
      operationId: botAcquireLease
      tags: [internal]
      summary: Acquire or renew the polling lease
      description: |
        One `getUpdates` consumer per bot token. Grants (or renews, for the current holder) a lease
        of `ttl_s` seconds; another instance gets `acquired: false` until the lease expires.
        Instances renew every 10 seconds and idle while they do not hold the lease.
      security: [{serviceSecret: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BotLeaseRequest'}
      responses:
        '200':
          description: Lease state.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BotLeaseResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /internal/v1/bots/{bot}/offset:
    servers:
      - url: http://api:8081
        description: Internal bot API listener (compose network only; never published or proxied).
    parameters:
      - $ref: '#/components/parameters/BotPath'
      - $ref: '#/components/parameters/BotHeader'
    post:
      operationId: botSaveOffset
      tags: [internal]
      summary: Store the last processed update id
      description: |
        Monotonic: a lower value than the stored one is ignored and the stored value returned.
        Only the current lease holder may write (`409 conflict`).
      security: [{serviceSecret: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BotOffsetRequest'}
      responses:
        '200':
          description: Stored offset.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BotOffsetResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /internal/v1/bots/{bot}/updates/{update_id}/claim:
    servers:
      - url: http://api:8081
        description: Internal bot API listener (compose network only; never published or proxied).
    parameters:
      - $ref: '#/components/parameters/BotPath'
      - $ref: '#/components/parameters/UpdateIdPath'
      - $ref: '#/components/parameters/BotHeader'
    post:
      operationId: botClaimUpdate
      tags: [internal]
      summary: Claim an update before side effects
      description: |
        `claimed: true` the first time an update id is claimed for the bot, `false` afterwards; the
        bot skips updates it could not claim, so restarts never process an update twice. Claims are
        kept for 7 days.
      security: [{serviceSecret: []}]
      responses:
        '200':
          description: Claim result.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BotClaimResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /internal/v1/bots/{bot}/users/sync:
    servers:
      - url: http://api:8081
        description: Internal bot API listener (compose network only; never published or proxied).
    parameters:
      - $ref: '#/components/parameters/BotPath'
      - $ref: '#/components/parameters/BotHeader'
    post:
      operationId: botSyncUser
      tags: [internal]
      summary: Upsert the Telegram user seen by the bot
      description: |
        Upserts the user from the update's `from` (never from message text) and records
        `/start` (`started`) or `my_chat_member` kicked/blocked (`blocked`) for this bot. New users
        get language `kk`. Returns the stored language so the bot can answer in it.
      security: [{serviceSecret: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BotUserSyncRequest'}
      responses:
        '200':
          description: Stored user.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BotUserSyncResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /internal/v1/bots/{bot}/users/{tg_id}/language:
    servers:
      - url: http://api:8081
        description: Internal bot API listener (compose network only; never published or proxied).
    parameters:
      - $ref: '#/components/parameters/BotPath'
      - $ref: '#/components/parameters/TgIdPath'
      - $ref: '#/components/parameters/BotHeader'
    put:
      operationId: botSetUserLanguage
      tags: [internal]
      summary: Set the user's language
      description: Same preference as `PATCH /me/preferences`; shared by both bots and Mini Apps.
      security: [{serviceSecret: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BotLanguage'}
      responses:
        '200':
          description: Stored language.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BotLanguage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /internal/v1/passenger/{tg_id}/orders:
    servers:
      - url: http://api:8081
        description: Internal bot API listener (compose network only; never published or proxied).
    parameters:
      - $ref: '#/components/parameters/TgIdPath'
      - $ref: '#/components/parameters/BotHeader'
    get:
      operationId: botListPassengerOrders
      tags: [internal]
      summary: Recent orders of a passenger
      description: 'For the passenger bot''s "my orders" reply. Requires `X-Jantaxi-Bot: passenger`.'
      security: [{serviceSecret: []}]
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 20, default: 5}
      responses:
        '200':
          description: Orders, newest first (empty for unknown users).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BotOrderList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /internal/v1/passenger/{tg_id}/contact:
    servers:
      - url: http://api:8081
        description: Internal bot API listener (compose network only; never published or proxied).
    parameters:
      - $ref: '#/components/parameters/TgIdPath'
      - $ref: '#/components/parameters/BotHeader'
    post:
      operationId: botVerifyPassengerContact
      tags: [internal]
      summary: Store the passenger's Telegram-verified phone
      description: |
        Called when the passenger bot receives a shared contact (after the passenger Mini App's
        `WebApp.requestContact()`, ARCHITECTURE §22.5). The API requires `contact_user_id ==
        tg_id` (`403 forbidden` with `details.reason = contact_mismatch` otherwise), normalises
        the number to a Kazakhstan mobile in E.164 (`422`, `fields.phone = invalid`) and stores it
        on the user (`users.phone_e164`, `phone_verified_at`; `GET /me` then reports
        `phone_verified: true`). A blocked user is `403` with `details.reason = user_blocked`;
        an unknown user `404`. Emits `user.phone_verified` to the user. The driver who takes the
        passenger's orders sees the phone (`DriverOrderDetail.passenger.phone`). Requires
        `X-Jantaxi-Bot: passenger`.
      security: [{serviceSecret: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BotContactRequest'}
      responses:
        '200':
          description: Phone stored and verified.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BotPassengerContactResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /internal/v1/driver/{tg_id}/summary:
    servers:
      - url: http://api:8081
        description: Internal bot API listener (compose network only; never published or proxied).
    parameters:
      - $ref: '#/components/parameters/TgIdPath'
      - $ref: '#/components/parameters/BotHeader'
    get:
      operationId: botGetDriverSummary
      tags: [internal]
      summary: Driver status for the bot menu
      description: 'Registration status, code, online flag, wallet, active order and open corrections. Requires `X-Jantaxi-Bot: driver`.'
      security: [{serviceSecret: []}]
      responses:
        '200':
          description: 'Summary (`registered: false` when the user has no driver profile).'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BotDriverSummary'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /internal/v1/driver/{tg_id}/availability:
    servers:
      - url: http://api:8081
        description: Internal bot API listener (compose network only; never published or proxied).
    parameters:
      - $ref: '#/components/parameters/TgIdPath'
      - $ref: '#/components/parameters/BotHeader'
    post:
      operationId: botSetDriverAvailability
      tags: [internal]
      summary: Go online or offline from the bot
      description: 'Same rules and errors as `PATCH /driver/availability`. Requires `X-Jantaxi-Bot: driver`.'
      security: [{serviceSecret: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AvailabilityUpdateRequest'}
      responses:
        '200':
          description: New availability.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Availability'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402': {$ref: '#/components/responses/InsufficientBalance'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /internal/v1/driver/{tg_id}/orders:
    servers:
      - url: http://api:8081
        description: Internal bot API listener (compose network only; never published or proxied).
    parameters:
      - $ref: '#/components/parameters/TgIdPath'
      - $ref: '#/components/parameters/BotHeader'
    get:
      operationId: botListDriverAvailableOrders
      tags: [internal]
      summary: Available orders for the bot
      description: 'Same eligibility rules as `GET /driver/orders`. Requires `X-Jantaxi-Bot: driver`.'
      security: [{serviceSecret: []}]
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 20, default: 5}
      responses:
        '200':
          description: Available orders.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AvailableOrders'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /internal/v1/driver/{tg_id}/orders/{id}/accept:
    servers:
      - url: http://api:8081
        description: Internal bot API listener (compose network only; never published or proxied).
    parameters:
      - $ref: '#/components/parameters/TgIdPath'
      - $ref: '#/components/parameters/IdPath'
      - $ref: '#/components/parameters/BotHeader'
    post:
      operationId: botAcceptOrder
      tags: [internal]
      summary: Take an order from a bot offer («✅ Алу»)
      description: |
        The driver tapped «✅ Алу» (callback `take:<order_id>`) on an offer in the driver bot
        (ARCHITECTURE §22.4). Runs the same atomic acceptance as `POST /driver/orders/{id}/accept`
        (first tap wins; the commission is charged in the same transaction) with the same errors:
        `409 order_already_taken`, `402 insufficient_balance` (`details {required, available,
        currency, topup_min_amount}`), `409 driver_offline`, `422 location_required`
        (`details.reason = location_required | location_stale`), `409 driver_has_active_order`,
        `403 driver_not_approved`, `404` (not registered, outside the radius, vehicle does not fit,
        own order) and `409 invalid_transition` (cancelled or expired). A repeated tap by the
        winner is `200` with `replayed: true`. The bot itself edits the tapped message to
        «✅ Сіз алдыңыз» and sends the trip card with the passenger's contact, so the outbox sends
        neither; the other drivers' offers are edited to "taken" through the outbox (kind `edit`).
        Requires `X-Jantaxi-Bot: driver`.
      security: [{serviceSecret: []}]
      responses:
        '200':
          description: The order is the driver's.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BotAcceptResult'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402': {$ref: '#/components/responses/InsufficientBalance'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/AcceptConflict'}
        '422':
          description: '`location_required` with `details {reason: location_required | location_stale, max_age_s}`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /internal/v1/driver/{tg_id}/contact:
    servers:
      - url: http://api:8081
        description: Internal bot API listener (compose network only; never published or proxied).
    parameters:
      - $ref: '#/components/parameters/TgIdPath'
      - $ref: '#/components/parameters/BotHeader'
    post:
      operationId: botVerifyDriverContact
      tags: [internal]
      summary: Store a Telegram-verified phone
      description: |
        Called when the driver bot receives a shared contact (after `WebApp.requestContact()`).
        The bot passes `contact.user_id`; the API requires `contact_user_id == tg_id`
        (`403 forbidden` otherwise — someone else's contact), normalises the number to a Kazakhstan
        mobile in E.164 (`422` otherwise) and marks it verified on the user and, if it exists, the
        driver profile (`409 phone_taken` when another live driver holds it). Emits
        `driver.phone_verified`. Requires `X-Jantaxi-Bot: driver`.
      security: [{serviceSecret: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BotContactRequest'}
      responses:
        '200':
          description: Phone verified.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BotContactResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /internal/v1/driver/{tg_id}/location:
    servers:
      - url: http://api:8081
        description: Internal bot API listener (compose network only; never published or proxied).
    parameters:
      - $ref: '#/components/parameters/TgIdPath'
      - $ref: '#/components/parameters/BotHeader'
    post:
      operationId: botReportDriverLocation
      tags: [internal]
      summary: Location shared in the driver bot
      description: |
        Static or live location messages (including `edited_message` updates of a live location).
        Same storage and rules as `POST /driver/location` (inside Kazakhstan; heartbeat). Requires
        `X-Jantaxi-Bot: driver`.
      security: [{serviceSecret: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BotLocationRequest'}
      responses:
        '204':
          description: Stored.
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /internal/v1/driver/{tg_id}/topup-receipt:
    servers:
      - url: http://api:8081
        description: Internal bot API listener (compose network only; never published or proxied).
    parameters:
      - $ref: '#/components/parameters/TgIdPath'
      - $ref: '#/components/parameters/BotHeader'
    post:
      operationId: botUploadTopUpReceipt
      tags: [internal]
      summary: Kaspi receipt PDF sent to the driver bot
      description: |
        The driver bot downloads a PDF document the driver sent (getFile, at most 5 MiB) and
        forwards it here. It is attached to the driver's most recent open top-up (`created` or
        `pending_verification`) with the same checks as `POST /driver/wallet/topups/{id}/receipt`.
        Without an open top-up: `409 receipt_already_used` when this receipt was already used,
        else `409 no_open_topup`. Not idempotent: the bot does not retry it. Requires
        `X-Jantaxi-Bot: driver`; 10 receipts per minute per driver.
      security: [{serviceSecret: []}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {$ref: '#/components/schemas/ReceiptUpload'}
            encoding:
              file:
                contentType: application/pdf
      responses:
        '200':
          description: Outcome (`credited`, `pending_verification` with reasons).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BotTopUpReceiptResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/ReceiptConflict'}
        '413': {$ref: '#/components/responses/FileTooLarge'}
        '415':
          description: '`unsupported_media_type`: not `multipart/form-data`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '422': {$ref: '#/components/responses/UnprocessableReceipt'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503':
          description: Receipt intake is not configured on this API instance.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /internal/v1/config:
    servers:
      - url: http://api:8081
        description: Internal bot API listener (compose network only; never published or proxied).
    parameters:
      - $ref: '#/components/parameters/BotHeader'
    get:
      operationId: botGetConfig
      tags: [internal]
      summary: Bot runtime configuration
      description: Mini App URLs, bot usernames and support contacts (read at start and refreshed periodically).
      security: [{serviceSecret: []}]
      responses:
        '200':
          description: Configuration.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BotConfig'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
components:
  securitySchemes:
    adminSession:
      type: apiKey
      in: cookie
      name: jt_admin
      description: |
        Admin session cookie set by `POST /admin/auth/login` (`HttpOnly; Secure; SameSite=Strict;
        Path=/api`), 12h idle / 7d absolute. The route's permission is listed in
        `x-jantaxi-permission`; missing permission → `403 forbidden`.
    appToken:
      type: http
      scheme: bearer
      bearerFormat: 'base64url(payload).base64url(HMAC-SHA256)'
      description: |
        Mini App token from `POST /auth/telegram/{passenger|driver}`. Payload
        `{"v":1,"uid":"<uuid>","app":"passenger|driver","exp":<unix>}` signed with `SESSION_SECRET`,
        TTL 12h. The `app` claim must match the route group (see `x-jantaxi-app`). Re-authenticate
        with fresh `initData` on `401`.
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: |
        Required together with `adminSession` on every non-GET admin request; equals the
        `csrf_token` returned by login and `GET /admin/auth/me` (`HMAC(SESSION_SECRET, session_id)`).
        Missing or wrong → `403 forbidden`.
    serviceSecret:
      type: http
      scheme: bearer
      description: |
        `Authorization: Bearer $INTERNAL_BOT_SERVICE_SECRET` (constant-time compare) on the internal
        listener, always together with the `X-Jantaxi-Bot` header (`BotHeader` parameter). For
        `/internal/v1/bots/{bot}/…` the path segment must equal the header (`403 forbidden`).

  parameters:
    BotHeader:
      name: X-Jantaxi-Bot
      in: header
      required: true
      description: Calling bot; part of service authentication.
      schema: {$ref: '#/components/schemas/BotName'}
    BotPath:
      name: bot
      in: path
      required: true
      description: Bot the state belongs to; must equal `X-Jantaxi-Bot`.
      schema: {$ref: '#/components/schemas/BotName'}
    CityIdQuery:
      name: city_id
      in: query
      description: Filter by city.
      schema: {type: string, format: uuid}
    CursorBefore:
      name: before
      in: query
      description: Opaque cursor from a previous `next_cursor`; omit for the first page.
      schema: {type: string, maxLength: 200}
    CursorLimit:
      name: limit
      in: query
      description: Page size.
      schema: {type: integer, minimum: 1, maximum: 50, default: 20}
    DriverIdQuery:
      name: driver_id
      in: query
      description: Filter by driver profile id.
      schema: {type: string, format: uuid}
    FileIdPath:
      name: fileId
      in: path
      required: true
      description: File id (`FileRef.id` / `VehiclePhoto.id`).
      schema: {type: string, format: uuid}
    FromQuery:
      name: from
      in: query
      description: Period start, inclusive (RFC 3339).
      schema: {type: string, format: date-time}
      example: '2026-10-01T00:00:00Z'
    IdPath:
      name: id
      in: path
      required: true
      description: Resource id. Malformed ids return `404 not_found`.
      schema: {type: string, format: uuid}
      example: 0a6f4c4e-6f1b-4b8e-9a52-3c1d2e7f9b10
    LangPath:
      name: lang
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Language'}
    LangQuery:
      name: lang
      in: query
      description: Result language; defaults to the user's preference.
      schema: {$ref: '#/components/schemas/Language'}
    Page:
      name: page
      in: query
      description: 1-based page number.
      schema: {type: integer, minimum: 1, maximum: 100000, default: 1}
    PageSize:
      name: page_size
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 25}
    SearchQuery:
      name: q
      in: query
      description: Free-text search.
      schema: {type: string, maxLength: 100}
    StopIdPath:
      name: stopId
      in: path
      required: true
      description: Stop id (`Stop.id`).
      schema: {type: string, format: uuid}
    TemplateKeyPath:
      name: key
      in: path
      required: true
      schema: {$ref: '#/components/schemas/NotificationTemplateKey'}
    TgIdPath:
      name: tg_id
      in: path
      required: true
      description: Telegram user id from the update the bot received.
      schema: {type: integer, format: int64, minimum: 1}
      example: 784512369
    ToQuery:
      name: to
      in: query
      description: Period end, exclusive (RFC 3339).
      schema: {type: string, format: date-time}
      example: '2026-11-01T00:00:00Z'
    UpdateIdPath:
      name: update_id
      in: path
      required: true
      description: Telegram `update_id`.
      schema: {type: integer, format: int64, minimum: 0}

  headers:
    RetryAfter:
      description: Seconds to wait before retrying.
      schema: {type: integer, minimum: 1}

  responses:
    AdminForbidden:
      description: 'The admin''s role lacks the permission (`forbidden`), or the CSRF token is missing or wrong on a non-GET request (`csrf_failed`).'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          examples:
            forbidden:
              value: {error: {code: forbidden, message: not allowed}}
            csrf:
              value: {error: {code: csrf_failed, message: missing or invalid CSRF token}}
    AdminUnauthorized:
      description: 'No admin session, or the session expired or was revoked (`unauthorized`).'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example: {error: {code: unauthorized, message: authentication required}}
    AppForbidden:
      description: 'App token of the other Mini App, or the user is blocked (`forbidden` / `user_blocked`).'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          examples:
            forbidden:
              value: {error: {code: forbidden, message: not allowed}}
            blocked:
              value: {error: {code: user_blocked, message: user is blocked}}
    AppUnauthorized:
      description: 'Missing, invalid or expired app token (`unauthorized`).'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example: {error: {code: unauthorized, message: authentication required}}
    ConfirmConflict:
      description: 'The top-up cannot be confirmed: `invalid_transition` (not awaiting confirmation), `payment_reference_used` (the Kaspi transaction is already recorded) or `conflict` (see `details`).'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          examples:
            transition:
              value: {error: {code: invalid_transition, message: transition not allowed}}
            reference:
              value: {error: {code: payment_reference_used, message: provider transaction already recorded}}
    CsrfFailed:
      description: 'Missing or wrong `X-CSRF-Token` header (`csrf_failed`).'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example: {error: {code: csrf_failed, message: missing or invalid CSRF token}}
    DriverActionForbidden:
      description: 'Driver app route needing a profile and approval: `forbidden` (wrong app, blocked), `driver_not_registered` or `driver_not_approved`.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          examples:
            notRegistered:
              value: {error: {code: driver_not_registered, message: driver profile required}}
            notApproved:
              value: {error: {code: driver_not_approved, message: driver is not approved}}
    DriverForbidden:
      description: 'Driver app route needing a profile: `forbidden` (wrong app, blocked) or `driver_not_registered`.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          examples:
            forbidden:
              value: {error: {code: forbidden, message: not allowed}}
            notRegistered:
              value: {error: {code: driver_not_registered, message: driver profile required}}
    InitDataRejected:
      description: 'Telegram `initData` failed validation (`invalid_init_data`) or is too old (`init_data_expired`).'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          examples:
            invalid:
              value: {error: {code: invalid_init_data, message: invalid Telegram init data}}
            expired:
              value: {error: {code: init_data_expired, message: Telegram init data expired}}
    RegistrationConflict:
      description: 'Registration not editable in its status (`conflict`, `details.reason = registration_locked`), or the phone/plate belongs to another live driver (`phone_taken` / `plate_taken`).'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          examples:
            locked:
              value: {error: {code: conflict, message: registration is not editable in its current status, details: {reason: registration_locked, status: pending}}}
            plate:
              value: {error: {code: plate_taken, message: plate is registered to another driver}}
    SignInBlocked:
      description: 'The Telegram user is blocked by an administrator (`user_blocked`).'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example: {error: {code: user_blocked, message: user is blocked}}
    UnprocessableAvailability:
      description: '`location_required` (no fresh location; `details.max_age_s`) or `validation_failed`.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          examples:
            location:
              value: {error: {code: location_required, message: a fresh location is required to go online, details: {max_age_s: 300}}}
    UnprocessableLocation:
      description: '`validation_failed` (coordinates, accuracy, heading, speed, recorded_at) or `outside_service_area` (the point is outside Kazakhstan).'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          examples:
            outside:
              value: {error: {code: outside_service_area, message: point is outside the service area}}
    WalletForbidden:
      description: 'Wallet routes need a driver profile: `forbidden` (wrong app, blocked) or `driver_not_registered`.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          examples:
            notRegistered:
              value: {error: {code: driver_not_registered, message: driver profile required}}
    AcceptConflict:
      description: |
        The order cannot be accepted: `order_already_taken`, `driver_has_active_order`,
        `driver_offline` or `invalid_transition`.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          examples:
            taken:
              value: {error: {code: order_already_taken, message: order already taken}}
            active:
              value: {error: {code: driver_has_active_order, message: driver already has an active order}}
            offline:
              value: {error: {code: driver_offline, message: driver is offline}}
    BadRequest:
      description: Malformed request (invalid JSON, unknown field, empty body).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example: {error: {code: bad_request, message: 'invalid JSON: unknown field "telegram_id"'}}
    Conflict:
      description: |
        State conflict: `conflict` (duplicate, already done, not editable, idempotency key reused
        with a different payload; see `details`), `invalid_transition`, `phone_taken`,
        `plate_taken` or `payment_reference_used`.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          examples:
            activeOrder:
              value:
                error:
                  code: conflict
                  message: passenger already has an active order of this service type
                  details: {reason: active_order_exists, active_order_id: 0a6f4c4e-6f1b-4b8e-9a52-3c1d2e7f9b10}
            plateTaken:
              value: {error: {code: plate_taken, message: plate is registered to another driver}}
            referenceUsed:
              value: {error: {code: payment_reference_used, message: provider transaction already recorded}}
    DefaultRegionLocked:
      description: The nationwide default region cannot be deactivated and its zone cannot be changed (`default_region_locked`).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example: {error: {code: default_region_locked, message: the nationwide default region cannot be deactivated or deleted}}
    CsvFile:
      description: CSV export (UTF-8 with BOM, CRLF line ends, header row), streamed.
      headers:
        Content-Disposition:
          description: '`attachment; filename="orders-2026-10-01-2026-11-01.csv"` (kind, local from-date, local to-date).'
          schema: {type: string}
        Cache-Control:
          description: Always `no-store`.
          schema: {type: string, const: no-store}
      content:
        text/csv:
          schema: {type: string}
    Forbidden:
      description: |
        Authenticated but not allowed: `forbidden` (wrong app, blocked user, missing permission,
        bad CSRF token), `driver_not_registered` (driver route without a profile) or
        `driver_not_approved`.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          examples:
            forbidden:
              value: {error: {code: forbidden, message: not allowed}}
            notRegistered:
              value: {error: {code: driver_not_registered, message: driver profile required}}
            notApproved:
              value: {error: {code: driver_not_approved, message: driver is not approved}}
    InsufficientBalance:
      description: Available wallet balance is too low; `details` carries the amounts and a top-up hint.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example:
            error:
              code: insufficient_balance
              message: insufficient balance
              details: {required: 100, available: 40, currency: KZT, topup_min_amount: 500}
    InvalidTransition:
      description: The resource's current status does not allow this action.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example:
            error:
              code: invalid_transition
              message: transition not allowed
              details: {from: completed, action: cancel}
    JpegImage:
      description: Private JPEG image (EXIF stripped).
      headers:
        Cache-Control:
          description: Always `private, no-store`.
          schema: {type: string, const: 'private, no-store'}
      content:
        image/jpeg:
          schema: {type: string, contentMediaType: image/jpeg}
    NotFound:
      description: Unknown id, or a resource the caller may not see.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example: {error: {code: not_found, message: not found}}
    PayloadTooLarge:
      description: Body over 64 KiB (JSON) or 10 MiB (upload).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example: {error: {code: payload_too_large, message: request body too large}}
    RoutingUnavailable:
      description: The routing engine is unreachable; retry later.
      headers:
        Retry-After: {$ref: '#/components/headers/RetryAfter'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example: {error: {code: route_unavailable, message: routing service unavailable}}
    TooManyRequests:
      description: Rate limited (also used for the admin login lock).
      headers:
        Retry-After: {$ref: '#/components/headers/RetryAfter'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example: {error: {code: too_many_requests, message: too many requests}}
    Unauthorized:
      description: Missing, invalid or expired credentials (app token, initData, session cookie or service secret).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example: {error: {code: unauthorized, message: authentication required}}
    UnprocessableOrder:
      description: '`validation_failed`, `quote_expired`, `fare_not_allowed` or `outside_service_area`.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          examples:
            validation:
              value:
                error:
                  code: validation_failed
                  message: validation failed
                  fields: {cargo_description: required, recipient_phone: invalid, prohibited_items_ack: must_be_true}
            quoteExpired:
              value: {error: {code: quote_expired, message: quote expired}}
            fare:
              value:
                error:
                  code: fare_not_allowed
                  message: fare not allowed
                  details: {min: 500, max: 1500, step: 50}
    UnprocessableRegistration:
      description: '`registration_incomplete` (with `details.missing_fields`), `phone_not_verified` or `validation_failed`.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          examples:
            incomplete:
              value:
                error:
                  code: registration_incomplete
                  message: registration incomplete
                  details: {missing_fields: [id_back, vehicle_photos]}
            phone:
              value: {error: {code: phone_not_verified, message: phone not verified}}
    FileTooLarge:
      description: '`file_too_large`: the upload exceeds the limit (`MAX_UPLOAD_BYTES`; 5 MiB for PDF receipts).'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example: {error: {code: file_too_large, message: file is too large}}
    ReceiptConflict:
      description: |
        `invalid_transition` (the top-up is closed), `receipt_already_used` (the receipt was used
        before; the top-up named in `details.topup_id` is now `rejected`; the earlier use is never
        disclosed) or `no_open_topup` (bot intake without an open top-up).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          examples:
            used:
              value:
                error:
                  code: receipt_already_used
                  message: this receipt was already used
                  details: {reason: duplicate_receipt, topup_id: 8e9f0a1b-2c3d-4e4f-9a5b-6c7d8e9f0a1b, status: rejected}
            noTopUp:
              value: {error: {code: no_open_topup, message: 'create a top-up first, then send its receipt'}}
    ReceiptFile:
      description: Private receipt file (original PDF, or a sanitised JPEG for images).
      headers:
        Cache-Control:
          description: Always `private, no-store`.
          schema: {type: string, const: 'private, no-store'}
        Content-Disposition:
          description: '`inline; filename="<file_id>.pdf"` (or `.jpg`).'
          schema: {type: string}
      content:
        application/pdf:
          schema: {type: string, contentMediaType: application/pdf}
        image/jpeg:
          schema: {type: string, contentMediaType: image/jpeg}
    UnprocessableReceipt:
      description: |
        `unsupported_file_type` (neither a PDF nor a JPEG/PNG/WebP image), `pdf_unreadable`,
        `pdf_not_allowed` (`details.reason`: `encrypted` or `active_content` with `details.features`)
        or `image_too_large`.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example:
            error:
              code: pdf_not_allowed
              message: encrypted PDFs and PDFs with scripts, attachments or data submission are not accepted
              details: {reason: active_content, features: [JavaScript]}
    UnprocessableUpload:
      description: '`unsupported_file_type` (not a JPEG, PNG or WebP image) or `image_too_large`.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example: {error: {code: unsupported_file_type, message: 'only JPEG, PNG and WebP images are accepted'}}
    UnprocessableRoute:
      description: '`validation_failed`, `outside_service_area` (with `details.field`/`index`) or `route_unavailable` (no road route between the points).'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          examples:
            outside:
              value:
                error:
                  code: outside_service_area
                  message: point is outside the service area
                  details: {field: stops, index: 1}
            noRoute:
              value: {error: {code: route_unavailable, message: no route between the points}}
            validation:
              value:
                error:
                  code: validation_failed
                  message: validation failed
                  fields: {stops: too_many}
    UnsupportedMediaType:
      description: Wrong `Content-Type` (JSON expected, or multipart for uploads).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example: {error: {code: unsupported_media_type, message: expected application/json}}
    ValidationFailed:
      description: '`validation_failed` with per-field reasons, or another 422 code such as `outside_service_area`.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example:
            error:
              code: validation_failed
              message: validation failed
              fields: {comment: too_long}

  schemas:
    ActorType:
      type: string
      description: Who performed an action.
      enum: [passenger, driver, admin, system]
    AdminCreateRequest:
      type: object
      additionalProperties: false
      required: [email, full_name, role, password]
      properties:
        email: {type: string, format: email, maxLength: 254, example: operator@jantaxi.kz}
        full_name: {type: string, minLength: 1, maxLength: 120, example: Динара Әлібекова}
        role: {$ref: '#/components/schemas/AdminRole'}
        password: {type: string, minLength: 12, maxLength: 256, writeOnly: true, description: '12..256 characters, at most 1024 bytes.'}
    AdminDisputeOpenRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: {type: string, minLength: 1, maxLength: 500}
    AdminDriverDetail:
      type: object
      description: Full driver record for moderators and operators. File URLs point to `/api/v1/admin/files/{id}`.
      required: [id, code, status, first_name, last_name, phone, phone_verified, phone_verified_at, city, is_online, online_since, last_heartbeat_at, user, avatar, documents, vehicle, corrections, applications, moderation_events, wallet, welcome_bonus, bonuses, stats, last_location, active_order, rating, rating_count, completed_trips, submitted_at, approved_at, suspended_at, suspended_reason, pd_consent_at, pd_consent_version, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        code: {type: string, example: EMB001}
        status: {$ref: '#/components/schemas/DriverStatus'}
        first_name: {type: string, example: Ерлан}
        last_name: {type: string, example: Бекенов}
        phone: {type: [string, 'null'], example: '+77071234567'}
        phone_verified: {type: boolean}
        phone_verified_at: {type: [string, 'null'], format: date-time}
        city: {$ref: '#/components/schemas/CityRef'}
        is_online: {type: boolean}
        online_since: {type: [string, 'null'], format: date-time}
        last_heartbeat_at: {type: [string, 'null'], format: date-time}
        user:
          type: object
          description: Underlying Telegram user.
          required: [id, telegram_user_id, username, is_blocked, driver_bot_started_at, driver_bot_blocked_at]
          properties:
            id: {type: string, format: uuid}
            telegram_user_id: {type: integer, format: int64, example: 784512369}
            username: {type: [string, 'null']}
            is_blocked: {type: boolean}
            driver_bot_started_at: {type: [string, 'null'], format: date-time}
            driver_bot_blocked_at: {type: [string, 'null'], format: date-time}
        avatar:
          oneOf:
            - $ref: '#/components/schemas/FileRef'
            - type: 'null'
        documents:
          description: Identity card photos; `null` when the admin lacks `documents.view`.
          oneOf:
            - type: object
              required: [id_front, id_back]
              properties:
                id_front:
                  oneOf:
                    - $ref: '#/components/schemas/FileRef'
                    - type: 'null'
                id_back:
                  oneOf:
                    - $ref: '#/components/schemas/FileRef'
                    - type: 'null'
            - type: 'null'
        vehicle:
          oneOf:
            - $ref: '#/components/schemas/RegistrationVehicle'
            - type: 'null'
        corrections:
          type: array
          description: Open correction items (status `changes_requested`).
          items: {$ref: '#/components/schemas/CorrectionItem'}
        applications:
          type: array
          description: Submission rounds, newest first.
          items: {$ref: '#/components/schemas/DriverApplication'}
        moderation_events:
          type: array
          description: Newest first.
          items: {$ref: '#/components/schemas/ModerationEvent'}
        wallet:
          description: '`null` until the wallet exists (created with the profile on the first `PUT /driver/registration`; ensured again on approval).'
          oneOf:
            - $ref: '#/components/schemas/Wallet'
            - type: 'null'
        welcome_bonus:
          description: The welcome balance granted on the first approval (§22.1), or `null`.
          oneOf:
            - $ref: '#/components/schemas/WelcomeBonus'
            - type: 'null'
        bonuses:
          type: array
          description: Bonus history (welcome and operator bonuses), newest first, at most 50; the full history is the ledger with `type=bonus_credit`.
          items: {$ref: '#/components/schemas/DriverBonus'}
        stats: {$ref: '#/components/schemas/DriverStats'}
        last_location:
          oneOf:
            - $ref: '#/components/schemas/DriverLastLocation'
            - type: 'null'
        active_order:
          oneOf:
            - $ref: '#/components/schemas/OrderRef'
            - type: 'null'
        rating: {type: [number, 'null'], minimum: 1, maximum: 5}
        rating_count: {type: integer, minimum: 0}
        completed_trips: {type: integer, minimum: 0}
        submitted_at: {type: [string, 'null'], format: date-time}
        approved_at: {type: [string, 'null'], format: date-time}
        suspended_at: {type: [string, 'null'], format: date-time}
        suspended_reason: {type: [string, 'null']}
        pd_consent_at: {type: [string, 'null'], format: date-time}
        pd_consent_version: {type: [string, 'null']}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    AdminDriverListItem:
      type: object
      required: [id, code, status, first_name, last_name, phone, phone_verified, city, is_online, last_heartbeat_at, vehicle, rating, rating_count, completed_trips, wallet_available, submitted_at, approved_at, created_at]
      properties:
        id: {type: string, format: uuid}
        code: {type: string, example: EMB001}
        status: {$ref: '#/components/schemas/DriverStatus'}
        first_name: {type: string}
        last_name: {type: string}
        phone: {type: [string, 'null']}
        phone_verified: {type: boolean}
        city: {$ref: '#/components/schemas/CityRef'}
        is_online: {type: boolean}
        last_heartbeat_at: {type: [string, 'null'], format: date-time}
        vehicle:
          oneOf:
            - $ref: '#/components/schemas/Vehicle'
            - type: 'null'
        rating: {type: [number, 'null'], minimum: 1, maximum: 5}
        rating_count: {type: integer, minimum: 0}
        completed_trips: {type: integer, minimum: 0}
        wallet_available:
          type: [integer, 'null']
          format: int64
          description: Available balance; `null` until the wallet exists.
        submitted_at: {type: [string, 'null'], format: date-time}
        approved_at: {type: [string, 'null'], format: date-time}
        created_at: {type: string, format: date-time}
    AdminDriverPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: {$ref: '#/components/schemas/AdminDriverListItem'}
    AdminDriverUpdateRequest:
      type: object
      additionalProperties: false
      required: [city_id]
      properties:
        city_id: {type: string, format: uuid}
    AdminLedgerEntry:
      allOf:
        - $ref: '#/components/schemas/LedgerEntry'
        - type: object
          required: [wallet_id, driver, admin, reservation_id, idempotency_key]
          properties:
            wallet_id: {type: string, format: uuid}
            driver: {$ref: '#/components/schemas/DriverRef'}
            admin:
              description: Admin who caused the entry (confirmations, refunds, adjustments).
              oneOf:
                - $ref: '#/components/schemas/AdminRef'
                - type: 'null'
            reservation_id: {type: [string, 'null'], format: uuid}
            idempotency_key: {type: string, example: 'charge:0a6f4c4e-6f1b-4b8e-9a52-3c1d2e7f9b10'}
    AdminLedgerPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
